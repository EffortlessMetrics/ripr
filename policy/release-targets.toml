# --------------------------------------------------------------------------
# Umbrella parents. `counted_in = "none"` means the parent is outside every
# committed denominator so it cannot double-count its own leaves. A parent may
# be counted in one release only with a justification naming the distinct final
# acceptance it owns beyond its leaves, and then it may not also have a leaf
# committed to that same release.
# --------------------------------------------------------------------------

