# Release target manifest (#3013 Slice B; live-head 0.11.0 reset).
#
# This file is the checked-in membership authority for release-candidate
# scope. `cargo xtask check-release-targets` validates it offline and
# network-free.
#
# Why a manifest and not a parser over release-goal prose:
#
# The release-goal bodies (#3004, #3005, #3006) express some membership as
# en-dash ranges such as `#2665 / #2968-#2970`. A checker that extracted issue
# references from that prose would either invent numbering semantics GitHub
# does not guarantee, or silently miss every member written inside a range.
# In the manual audit recorded on #3013, #2966 and #2969 -- real conditional
# issues -- never appeared in the extracted reference set at all for exactly
# that reason. A gate reporting a clean graph over members it never saw is a
# false-confidence surface. The goal bodies are human-validated documentation;
# this file is the parsed input.
#
# For 0.11.0, this manifest records the issue graph and membership anchors;
# the publication candidate itself is the exact transaction-boundary
# `ripr-swarm/main` SHA recorded by
# `docs/release-candidates/0.11.0-live-head-selection.json`. It must not be
# interpreted as a C-to-T projection or a floating-main candidate.
#
# Scope limit, stated so it is not mistaken for completeness:
#
# - Committed, conditional, and release-referenced rolling issues are
#   enumerated here. The 271 open `target/rolling` issues are deliberately not
#   mirrored: enumerating them would restate GitHub rather than record policy.
#   Live rolling exclusion is Slice C's network-owned check.
# - `[[parent]].leaves` may name issues outside every release target. That is a
#   real fact about the parent, not a gap, so leaves are exempt from the
#   referential-closure rule (rule 8). Every other cross-reference must resolve
#   inside this file.
#
# Known divergence from live milestone membership, observed 2026-08-08:
#
#   `0.12.0 candidate` also contains #1146, #2615, #2628
#   `0.13.0 candidate` also contains #1573, #1574, #1583
#
# All six are umbrella parents that #3005 and #3006 place outside milestone
# progress ("Parent reconciliation outside milestone progress"; "should not
# double-count milestone progress unless #3013 records a distinct
# final-acceptance role"). This manifest records the membership law, so they
# appear here as `[[parent]]` records with `counted_in = "none"` and are absent
# from every committed set. Resolving the divergence -- removing them from the
# milestones, or recording a distinct final-acceptance role through an
# admission comment -- is an owner ruling, not a mechanical repair, and is left
# open deliberately. Slice C's live parity check is the surface that will keep
# reporting it until it is resolved.

schema_version = "0.1"
non_claim = "Milestone membership is the committed candidate denominator for qualification in ripr-swarm. It does not authorize or establish version publication, tagging, signing, marketplace mutation, or post-publication verification."
control_issue = 3013

# --------------------------------------------------------------------------
# Releases. Declared in ascending version order; that order is the prerequisite
# ordering used by rule 6.
#
# Committed membership is `goal_issue` + `claim_blockers` + `proof_blockers` +
# `companions`. `conditional_issues` are NOT committed: they carry an intended
# destination but stay outside the milestone until an admission comment cites
# the evidence that made them blocking.
# --------------------------------------------------------------------------

