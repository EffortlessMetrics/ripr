# Selected 2026-07-09 after reconciling the completed 0.9.0 release with the
# stale use-case-spec-spine manifest. This campaign owns the Rust repair loop.
#
# Spec-system authority: cargo-allow's advisory spec-system profile owns
# structural artifact governance and its ledger. RIPR xtask executes product
# proof; it must not become a second structural graph authority. The sole RIPR
# active manifest remains excluded from cargo-allow native validation until
# cargo-allow #2119 can preserve this execution dialect without duplication.
id = "rust-one-shot-evidence-to-repair"
title = "Rust One-Shot Evidence-to-Repair Product Closure"
status = "active"
lane = "lane1"
issue = "https://github.com/EffortlessMetrics/ripr-swarm/issues/1440"
no_current_goal = false

objective = """
Make RIPR's Rust pull-request workflow turn changed behavior into one exact,
safe, test-only repair and a verified before/after receipt. Unsupported analysis
must fail closed into a named limitation with a concrete route rather than
recommend a repair RIPR cannot credit.
"""

end_state = [
  "Default Rust human output presents one bounded start-here route while exhaustive and machine evidence remain explicitly available.",
  "Actionable Rust packets carry canonical identity and complete repair/verify/receipt fields, or fail closed.",
  "Gate failures name the exact repair route without artifact archaeology; targeted-mutation routes are concrete or limited.",
  "Known Rust field-constant and same-crate construction false-actionability cases have positive and adversarial regression coverage.",
  "Targeted reruns preserve canonical identity and receipt semantics, with explicit cache reuse and invalidation.",
  "Receipt-backed Rust dogfood and route-quality results support only the reviewed support-tier claim.",
]

non_goals = [
  "Preview-language breadth or promotion.",
  "Automatic test generation, mutation execution by default, or consumer production edits.",
  "Default CI blocking, badge/baseline authority changes, release, signing, publishing, credentials, or workspace reshaping.",
  "Coverage, runtime mutation, correctness, or complete test-quality claims from static evidence.",
]

