# Selected 2026-07-12 after reconciling the accepted targeted-rerun contract
# with the remaining Rust repair trust and adoption work. This campaign owns
# the Rust evidence-to-repair protocol.
#
# Spec-system authority: cargo-allow's advisory spec-system profile owns
# structural artifact governance and its ledger. RIPR xtask executes product
# proof; it must not become a second structural graph authority. The sole RIPR
# active manifest remains excluded from cargo-allow native validation until
# cargo-allow #2119 can preserve this execution dialect without duplication.
# active_goal_required = false for cargo-allow native validation during that
# interval; this file remains the sole RIPR execution manifest.
id = "rust-one-shot-evidence-to-repair"
title = "Rust Evidence-Bound Repair Trust and Adoption"
status = "active"
lane = "lane1"
issue = "https://github.com/EffortlessMetrics/ripr-swarm/issues/1440"
no_current_goal = false

objective = """
Make RIPR the default evidence-to-repair protocol for Rust pull requests.
One changed behavior must become one exact, safe, test-only repair and a
current-state before/after receipt. Actionability may be promoted only from
producer-owned evidence that survives adversarial review and authorized
real-repository use. Unsupported analysis must fail closed into a named
limitation with a concrete investigation route rather than recommend a repair
RIPR cannot credit.
"""

end_state = [
  "Every actionable Rust result carries producer-owned identity, navigation, causality, command, and authority facts; incomplete routes are named limitations.",
  "CallPresence is receipt-proved for an unambiguous real/current-repository route or remains a durable fail-closed limitation with explicit negative controls.",
  "At least 20 receipt-backed real repair attempts across at least 3 authorized Rust repositories have before/after and verification provenance using closed movement outcomes.",
  "Targeted rerun remains regression-protected infrastructure with canonical identity, before state, invalidation disclosure, selector-scoped parity, and the registered benchmark floor.",
  "Review and proof receipts certify the exact current head SHA; later mutation invalidates prior certification and requires fresh independent challenge.",
  "Cargo-allow remains advisory structural authority, RIPR xtask remains proof executor, and .ripr/goals/active.toml remains the sole execution manifest until #2119 is resolved.",
  "The support-tier claim, active manifest, plan, specs, metrics, issues, receipts, and closeout agree with observed real-repository evidence and remaining limitations.",
]

non_goals = [
  "Preview-language breadth or promotion.",
  "Automatic test generation, mutation execution by default, or consumer production edits.",
  "Default CI blocking, badge/baseline authority changes, release, signing, publishing, credentials, or workspace reshaping.",
  "Coverage, runtime mutation, correctness, or complete test-quality claims from static evidence.",
  "Universal performance claims, support promotion from fixtures alone, labels or agent roles as proof, or a duplicate cargo-allow active-goal source.",
]

