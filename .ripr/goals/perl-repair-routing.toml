# Focused Perl usable-alpha tracker.
# This is not the active Codex Goals manifest. `.ripr/goals/active.toml` remains
# the active execution manifest (currently `use-case-spec-spine`). Promotion into
# `active.toml` is a maintainer decision recorded here.
#
# Durable plan: docs/IMPLEMENTATION_CAMPAIGNS.md -> Campaign 31
# Spec: docs/specs/RIPR-SPEC-0064-perl-fact-packet-contract.md (proposed)
# Proposal: docs/proposals/RIPR-PROP-0018-perl-repair-routing-lane.md (proposed)
# ADR: docs/adr/0018-perl-lsp-fact-substrate.md (proposed)
# ADR: docs/adr/0019-language-adapters-reuse-shared-packet-contract.md (proposed)
# Producer repo: perl-lsp-swarm (published crate: perl-lsp-rs-core)
#
# Public tracker: https://github.com/EffortlessMetrics/ripr-swarm/issues/1379
#
# ADR 0019 is load-bearing: the Perl adapter MUST project into the shared
# GapRecord and flip repair_packet_ready only via the shared
# validate_agent_gap_record_packet (agent_seam_packets.rs), mirroring the
# TypeScript pattern (typescript_gap_record_for + validator_parity_* tests). A
# Perl-local readiness validator or repair_packet_ready boolean is forbidden.
#
# Phase + PR number are encoded in each work_item id/branch (perl-A1..D18). The
# durable plan doc carries the phase table; this tracker carries execution state.
#
# NOTE on status vocabulary: ready/blocked/done per .ripr/goals/README.md. There
# is no "deferred" status; "deferred to a later PR/campaign" items are recorded
# as status = "blocked" with a note (keeps the manifest promotion-safe for
# check-goals).
#
# Reconciliation (2026-06-27): this tracker and the Campaign 31 plan doc were
# authored on an unmerged planning branch (PR #1412) and landed after the
# consumer-side work. Items A1..D15 plus C2/H1/H2/contract-freeze/E1 are now
# `done`; the bespoke-renderer ADR-0019 blocker (D16) and the two-binary producer
# proof (Phase B) remain genuinely open. The perl.rs monolith referenced in the
# original plan was split (#1417) into perl/mod.rs + perl/tests.rs; all path
# references below point at the post-split layout.

objective = """
A working alpha: a maintainer configures [perl] producer = \"perllsp\", runs the
normal RIPR loop (doctor, check, edit one test, check, outcome), and gets exactly
one honest result — a bounded Perl test-repair packet (concrete discriminator,
test location, verify command, edit cage, stop conditions, receipt path),
already-observed evidence explaining why no new test is needed, or a named
limitation explaining why safe routing is impossible. Not general Perl
correctness, coverage adequacy, or mutation testing.
"""

non_goals = [
  "stable support tier.",
  "General Perl correctness or coverage adequacy.",
  "Auto-test-execution by default, generated tests, or source edits.",
  "Custom-helper understanding beyond the named Test::More/Test2/Test::Exception/Test::Fatal frameworks.",
  "Reconciling the FNV-1a gap-id scheme with ripr's SHA-256-based finding identity (blocked work item; lands before or with PR 18 when receipt keys are established).",
]

end_state = [
  "A maintainer can configure [perl] producer = \"perllsp\" and run the normal RIPR loop end-to-end on a CPAN-style repo.",
  "perl-lsp ripr-facts emits deterministic ripr-perl-facts-v1 packets with concrete discriminators, relation reasons, and observed-sink facts.",
  "ripr consumes packets via a production PerlAdapter routing through the shared GapRecord + validate_agent_gap_record_packet (no Perl-local flip).",
  "Three-outcome CPAN-style fixture proves actionable / already-observed / limited paths against REAL perllsp output, not committed expected packets.",
  "top-1 repair-card precision >= 80%, verify-command validity >= 90%, false-actionable rate <= 5%, zero severe false-actionables, >= 5 before/after receipts with >= 3 improved/resolved, across >= 5 real Perl repos.",
  "Validator parity demonstrates Perl uses the same shared packet authority as Rust/TypeScript/Python.",
  "Gates/badges/baseline/RIPR Zero authority stay false; only repair_packet_ready flips, and only via the shared validator.",
]

