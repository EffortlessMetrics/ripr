t. The local-callable issue is a RELATION-DIAGNOSIS bug (the card falsely implies no direct test exists), NOT a classification bug. CORRECTED ACCEPTANCE: trace a single unambiguous `local = OwnerClass(...)` binding called as `local(...)` so the relation links DIRECT and the existing oracle (smoke) is surfaced — the fixture should resolve to weakly_exposed/smoke/direct-relation, MATCHING python_broad_boolean_assertion, NOT exposed. Guard reassigned/dynamic/wrapper bindings. This change CANNOT introduce false-exposed (the smoke oracle and the orthogonal alignment of `stop(3)` both block the exposed branch), and it must produce ZERO classification flips on any golden (protect python_strong_oracle/cross_file/field/broad_boolean). Value: removes the misleading 'no direct test' card on the smoke local-binding family. REFRAMED PRECISION LEVER: the four Tier B false-actionables split by oracle STRENGTH (scaled-judged.json, n=7). tenacity's discriminating assertion is a SMOKE oracle (assertTrue), so the correct RESOLVED state is weakly_exposed/smoke per python_broad_boolean_assertion (this work item is a relation/card fix, NOT an exposed flip). Precise cause: today the weakly_exposed comes from the same_stem relation miss (oracle surfaced as `unknown`, not `smoke`); the fix surfaces the smoke oracle and corrects the 'no direct test' card without changing the class. jinja/structlog/anyio = STRONG oracles (ExactValue / ExactErrorVariant) that ripr NEVER SAW due to relation/extraction misses — those are the TRUE false-actionables and the only ones legitimately flippable to exposed. Tractable next: structlog's cross-file relation miss (ripr linked test_processors.py; the strong `pytest.raises(ValueError, match=...)` lives in test_renderers.py::test_invalid_key) -> a NEW work item `analysis/python-cross-file-strong-oracle-relation`. jinja (framework filter-dispatch) and anyio (fn-result + async non-value oracle) remain hard/defensible limitations. Do NOT chase exposed on the smok