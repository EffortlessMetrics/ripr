[[work_item]]
id = "analysis/python-local-callable-instance-alignment"
status = "ready"
branch = "analysis/py-local-callable-instance-alignment"
acceptance = "GOAL CORRECTED 2026-06-13 (was: 'flip python_local_callable_binding to exposed'). Reading the actual classifier + the `python_broad_boolean_assertion` golden DISPROVED that goal. `exposed` requires `strongest_strength >= Strong && alignment.observes()`; `assertTrue`/`assertFalse` map to OracleStrength::Smoke (oracle_for_call); and `python_broad_boolean_assertion` pins `assert is_priority(100)` — a DIRECT broad-boolean call on the changed predicate owner — as weakly_exposed/smoke BY DESIGN. The tenacity `stop = stop_after_attempt(3); assertTrue(stop(3))` shape is exactly that plus a local binding, so flipping it to `exposed` would CONTRADICT the golden and the discrimination-not-coverage contract. The local-callable issue is a RELATION-DIAGNOSIS bug (the card falsely implies no direct test exists), NOT a classification bug. CORRECTED ACCEPTANCE: trace a single unambiguous `local = OwnerClass(...)` binding called as `local(...)` so the relation links DIRECT and the existing oracle (smoke) is surfaced — the fixture should resolve to weakly_exposed/smoke/direct-relation, MATCHING python_broad_boolean_assertion, NOT exposed. Guard reassigned/dynamic/wrapper bindings. This change CANNOT introduce false-exposed (the smoke oracle and the orthogonal alignment of `stop(3)` both block the exposed branch), and it must produce ZERO classification flips on any golden (protect python_strong_oracle/cross_file/field/broad_boolean). Value: removes the misleading 'no direct test' card on the smoke local-binding family. REFRAMED PRECISION LEVER: the four Tier B false-actionables split by oracle STRENGTH (scaled-judged.json, n=7). tenacity's discriminating assertion is a SMOKE oracle (assertTrue), so the correct RESOLVED state is weakly_exposed/smoke per python_broad_boolean_assertion (this work item is a relation/card fix, NOT an exposed flip). Precise cause: today the weakly_exposed comes from the same_stem relation miss (oracle surfaced as `unknown`, not `smoke`); the fix surfaces the smoke oracle and corrects the 'no direct test' card without changing the class. jinja/structlog/anyio = STRONG oracles (ExactValue / ExactErrorVariant) that ripr NEVER SAW due to relation/extraction misses — those are the TRUE false-actionables and the only ones legitimately flippable to exposed. Tractable next: structlog's cross-file relation miss (ripr linked test_processors.py; the strong `pytest.raises(ValueError, match=...)` lives in test_renderers.py::test_invalid_key) -> a NEW work item `analysis/python-cross-file-strong-oracle-relation`. jinja (framework filter-dispatch) and anyio (fn-result + async non-value oracle) remain hard/defensible limitations. Do NOT chase exposed on the smoke local-binding case."
commands = [
  "cargo xtask goldens check",
  "cargo xtask dogfood",
  "cargo xtask check-pr",
]

[[work_item]]
id = "analysis/python-cross-file-strong-oracle-relation"
status = "ready"
branch = "analysis/py-cross-file-strong-oracle-relation"
acceptance = "The REAL precision lever surfaced by Tier B pass-2 (scaled-judged.json, n=7): the genuine false-actionables are STRONG owner-aligned oracles that ripr never links because its relation heuristic reaches the WRONG tests. structlog is the tractable exemplar — the changed owner LogfmtRenderer.__call__ has a strong discriminator `pytest.raises(ValueError, match='Invalid key: \"invalid key\"')` calling `LogfmtRenderer()(None, None, {'invalid key': ...})` in tests/processors/test_renderers.py::TestLogfmtRenderer::test_invalid_key, but ripr's name-proximity relation linked tests/processors/test_processors.py (wrong file) and surfaced only unknown oracles, so it read weakly_exposed/no_strong_oracle and routed a card. UNLIKE the smoke local-binding case, this oracle IS strong and IS sink-aligned (it raises ValueError on the changed-key path), so linking it correctly SHOULD flip structlog to exposed — a real, contract-honoring precision gain. Scope: improve cross-file / inline-construct-call relation so the strong oracle is found and aligned, fixture-first with a new fixture that pins the structlog shape, WITHOUT crediting genuinely-orthogonal oracles or over-linking unrelated same-name tests across files (no false-exposed; protect all existing goldens incl. python_broad_boolean_assertion which must STAY weakly_exposed). Higher-risk; sequence after the safe relation-diagnosis fix. OUT OF SCOPE: jinja framework filter-dispatch (rendered-template oracle reached via the filter registry — opaque, defensible permanent limitation) and anyio function-result binding observed by a non-value async-cancellation oracle (both remain weakly_exposed)."
commands = [
  "cargo xtask goldens check",
  "cargo xtask dogfood",
  "cargo xtask check-pr",
]

