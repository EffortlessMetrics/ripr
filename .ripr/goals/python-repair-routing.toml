[[work_item]]
id = "analysis/python-local-callable-instance-alignment"
status = "ready"
branch = "analysis/py-local-callable-instance-alignment"
acceptance = "The first evidence-driven analyzer fix candidate (Tier B #1160). ROOT CAUSE corrected by fixture-first reproduction (fixtures/python_local_callable_binding): the limitation is in RELATION + ORACLE EXTRACTION, not sink-alignment. A test that reaches the owner via a local binding — `stop = stop_after_attempt(3); self.assertTrue(stop(3))` — links only by `same_stem` (uncertain) and extracts NO oracle (oracle_strength unknown), so the finding is weakly_exposed/no_strong_oracle. A sink-alignment-only change never executes (no strong oracle is extracted). The fix must trace a single unambiguous `local = OwnerClass(...)` binding as a direct relation + extract `local(...)` as an oracle on the owner, flipping python_local_callable_binding to exposed — WITHOUT crediting reassigned/dynamic bindings, the Retrying-wrapper indirection, or a genuinely-orthogonal oracle (no over-credit; protect python_strong_oracle/cross_file/field/broad_boolean goldens). Higher-risk than first scoped; sequence after eval-sweep-scale gives more evidence."
commands = [
  "cargo xtask goldens check",
  "cargo xtask dogfood",
  "cargo xtask check-pr",
]

