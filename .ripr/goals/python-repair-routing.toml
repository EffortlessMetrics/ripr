[[work_item]]
id = "analysis/python-false-exposed-attribute-call-owner-name"
status = "in_progress"
branch = "fix/py-false-exposed-attribute-call-owner-name"
acceptance = "PARTIAL — NOT closed. Layered oppositional review (3 rounds) proved the import/token-guard approach leaks: round 1 gated bare method-name by import; round 2 closed dead-import + free-fn alias; round 3 STILL found comment/string body-usage spoof, alias-as-constructor-arg, and CROSS-TEST satisfaction (the two gate halves satisfied by different tests). Root cause is structural: the alignment layer lacks RECEIVER IDENTITY, so name/import guards leak indefinitely. The #1249 branch closes the primary + 2 round-1 vectors with zero golden drift (a real partial hardening) but must NOT be merged as a closure. PROPER FIX -> new work_item analysis/python-method-owner-receiver-binding-identity (receiver-binding resolution at the relation layer; credit a method owner `direct` only when the method is called on a receiver statically bound to the owner class — `v = OwnerClass(...); v.method(...)` or inline `OwnerClass(...).method(...)`; closes all five bypasses AND preserves the legit `v=Cls(); v.method()==x` pattern; subsumes Cluster A method-owner case). PRIOR (premature) DONE note kept for history: closed the live false-exposed in classify_sink_alignment. For method/classmethod owners, the bare method-name token no longer credits `direct` alignment without owner-class identity (the owner's class token is observed, or a strong observing test imports the owner's class); otherwise it falls through to changed_sink_token/orthogonal. Free-function names and class tokens are unambiguous and unchanged. The TokenValidator.validate / PaymentProcessor.validate repro now reads weakly_exposed/orthogonal. ZERO existing golden drift (the fix had no blast radius); same-method fixture re-added as a pinned guard python_adversarial_same_method_other_class; 2 new unit tests (negative guard + positive identity-preserved); docs/STATIC_EXPOSURE_MODEL.md § Identity beats token overlap. Stacked on #1244. Preserved: python_strong_oracle, python_cross_file_construct_call (#1228), python_adversarial_buffer_token (#1224). ORIGINAL: HIGH PRIORITY — close a LIVE analyzer false-exposed found 2026-06-14 by the v1 guards. This is an ANALYZER bug, not just an eval finding. Repro: owner `TokenValidator.validate` (src/auth.py) changed `token` -> `token.strip()`; the ONLY related test `test_billing_validate` tests a DIFFERENT class `PaymentProcessor.validate` (src/billing.py), never importing or naming TokenValidator. ripr reads `exposed` (summary.exposed=1). Chain: (1) body_calls_owner links a syntactic_call via contains_any_attribute_call(body, owner.name) — a bare `.validate(` with ANY receiver; (2) classify_sink_alignment credits oracle_alignment=direct / strong_oracle_observes_owner_name because the strong `== True` oracle text contains the owner's BARE METHOD-NAME token `validate`. Fix: for method/classmethod owners, bare method-name overlap or any `.validate(` receiver is NOT enough to credit `exposed` — require owner IDENTITY evidence (owner-class token observed, import/alias of the owner class, inline construct call, local binding, or a receiver statically bound to the owner). Else downgrade to weakly_exposed/orthogonal. Trades a little false-actionable to close a false-exposed (contract-prioritized). REQUIRES careful golden review — must PRESERVE python_strong_oracle (free-function exact-value stays exposed), python_cross_file_construct_call (#1228 inline construct stays exposed), python_adversarial_buffer_token (#1224 guard), and python_local_callable_binding (#1242 weakly_exposed/smoke). Then the same-method fixture (repro under target/ripr/found-false-exposed/) flips to weakly_exposed and is added as a pinned guard."
