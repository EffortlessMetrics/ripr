[[work_item]]
id = "analysis/python-local-callable-instance-alignment"
status = "ready"
branch = "analysis/py-local-callable-instance-alignment"
acceptance = "The first evidence-driven analyzer fix candidate (Tier B #1160). ROOT CAUSE corrected by fixture-first reproduction (fixtures/python_local_callable_binding): the limitation is in RELATION + ORACLE EXTRACTION, not sink-alignment. A test that reaches the owner via a local binding — `stop = stop_after_attempt(3); self.assertTrue(stop(3))` — links only by `same_stem` (uncertain) and extracts NO oracle (oracle_strength unknown), so the finding is weakly_exposed/no_strong_oracle. A sink-alignment-only change never executes (no strong oracle is extracted). The fix must trace a single unambiguous `local = OwnerClass(...)` binding as a direct relation + extract `local(...)` as an oracle on the owner, flipping python_local_callable_binding to exposed — WITHOUT crediting reassigned/dynamic bindings, the Retrying-wrapper indirection, or a genuinely-orthogonal oracle (no over-credit; protect python_strong_oracle/cross_file/field/broad_boolean goldens). Higher-risk than first scoped; sequence after eval-sweep-scale gives more evidence. SCALE EVIDENCE (#1160, 8-repo sweep): the pattern is COMMON — 2 of the supported-with-findings repos (tenacity + anyio) are orthogonal false-actionable candidates, and the family is BROADER than callable-class instances: anyio binds a local to a function RESULT (`iterator = repeat(x, 0); assert collect(iterator) == []`) — ripr can't trace `iterator = repeat(...)` to the owner either. The fix should generalize to a single unambiguous local binding to the owner's call/result, observed by a strong oracle. Still: 0 false-`exposed` at scale, so this stays the conservative direction (over-suggest, not over-credit). TIER B PASS-2 BOUND (scaled-judged.json, n=7): of the 4 measured false-actionables, this scoped fix reaches at most TWO cleanly — tenacity (local-instance binding) and the local/function-result half of anyio. The other two are OUT OF SCOPE and must stay weakly_exposed: jinja is framework filter-dispatch (owner reached via Jinja's filter registry by the literal name 'round'; the oracle is a rendered template string) — genuinely opaque, a defensible permanent limitation; structlog is an inline construct-call `LogfmtRenderer()(...)` in a DIFFERENT test file than the relation heuristic reached (cross-file miss) — a separate relation-precision problem, not local-binding. anyio's discriminating oracle is also a non-value async-cancellation assertion, harder than a value oracle. So this fix is necessary but not sufficient for `usable` precision; do not over-reach it to chase jinja/structlog."
commands = [
  "cargo xtask goldens check",
  "cargo xtask dogfood",
  "cargo xtask check-pr",
]

