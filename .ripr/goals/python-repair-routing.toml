id = "python-repair-routing-reliability"
title = "Python Repair-Routing Reliability to Release"
status = "tracker"
lane = 1

# Focused Python release-readiness tracker.
# This is not the active Codex Goals manifest. `.ripr/goals/active.toml` remains
# the active execution manifest (use-case spec spine, frozen until 0.9.0 ships).
# Promotion into `active.toml` is a maintainer decision recorded here.
#
# Public tracker: https://github.com/EffortlessMetrics/ripr-swarm/issues/1160
# Ruff parser-substrate watchpoint (NOT a release gate): EffortlessMetrics/ripr#1430

objective = """
Promote Python repair routing from usable-alpha proof to a usable release claim
shipped from source `ripr`, using external-repo evidence as the spine. Each PR
adds one production delta plus its evidence; promotion gates on measured crash
rate, parse-failure rate, runtime, gap-ID stability, and false-actionability,
never on assertion. Target tier is `usable`, not `stable`.
"""

non_goals = [
  "Ruff integration or parser breadth (tracked separately as ripr#1430).",
  "Completeness across all Python constructs or frameworks.",
  "A `stable` claim; the target tier is `usable`.",
  "Supporting Django/SQLAlchemy/etc — only failing closed (named limitation) there.",
]

# The evidence ladder. Tier A measures robustness only; Tier B measures top-card
# usefulness and false-actionability; Tier C measures repair closure.
evidence_path = [
  "baseline dogfood (in-repo corpus, saturated 26/26) — done",
  "Tier A external robustness sweep (crash / parse-fail / runtime / gap-ID stability)",
  "Tier B judged external PR panel (top-1 usefulness, false-actionable rate)",
  "Tier C external repair attempts (before/after receipts)",
  "rollback / regression proof",
  "support-tier promotion (usable)",
  "source promotion into ripr",
]

end_state = [
  "ripr runs crash-free and gap-ID-stable on external Python repos at scale.",
  "False-actionable rate measured and low on a judged external PR (diff) panel.",
  "Repair closure demonstrated externally with before/after receipts.",
  "Rollback/regression behavior documented and honest.",
  "Support tier promoted to `usable` with signoff.",
  "Demonstrated surface shipped from source `ripr`.",
]

