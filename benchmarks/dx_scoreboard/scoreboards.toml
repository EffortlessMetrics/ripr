# Developer-experience scoreboards for `cargo xtask dx-scoreboard`.
#
# Each metric names the board it belongs to, the bar a developer would feel
# (`target`), and the margin that counts as a regression against a committed
# baseline. Targets are proposals until accepted; changing one is a reviewed
# edit to this file, never a side effect of a run.
#
# `source` says where the number comes from:
#   measured          the command measures it on this host
#   file:<path>       read from a committed receipt in this repository
#   ingest:<kind>     supplied by `--ingest <file>` from another harness
#   pending           no instrument yet; always reported as not_measured
#
# `runner_dependent = true` metrics (wall time, memory) are compared against a
# baseline only when the baseline's runner class matches this run's.

schema_version = "ripr-dx-scoreboards-v1"

# The shared Rust corpus (`benchmarks/rust_corpus/manifest.json`, #5288, now on
# main) can replace the inline list below; switching needs a new baseline
# because its pins differ:
#   corpus_manifest = "benchmarks/rust_corpus/manifest.json"
# Its `fast` tier then runs by default and `full` with --include-heavy.

# Fixed corpus of real repositories. Pins are exact commits so a moving
# upstream cannot move the measurement; only the analyzer under test changes.
# Each pin is a commit whose own change touches production Rust, so the warm
# `ripr check --base HEAD~1` measures a real small edit rather than an empty
# diff. Entries can also be repositories we intend to integrate with; the
# report shows each one as its own row set.
[[corpus]]
id = "serde"
url = "https://github.com/serde-rs/serde"
sha = "dd18663450ec3ee38e35e3a4ee141932614e662c"
note = "small library workspace, macro-heavy tests"

[[corpus]]
id = "ripgrep"
url = "https://github.com/BurntSushi/ripgrep"
sha = "020687a77d13146923333f0beb274eeabd54a270"
note = "multi-crate CLI workspace"

[[corpus]]
id = "regex"
url = "https://github.com/rust-lang/regex"
sha = "72d650cb0a880a01ab6dc2137c0888e8f89740f7"
note = "large library workspace with generated test suites"

[[corpus]]
id = "ripr-swarm"
url = "https://github.com/EffortlessMetrics/ripr-swarm"
sha = "7c64b9c8d0778cc7a6aeaab0deb0452d9e521663"
note = "large workspace (~900 files); pinned, not the checkout under test"
heavy = true

# ---------------------------------------------------------------- speed ----

[[metric]]
id = "speed.cold_pilot_ms"
board = "speed"
title = "Cold `ripr pilot` to first useful result"
unit = "ms"
direction = "lower_is_better"
target = 30000
regression_pct = 25
regression_floor = 3000
runner_dependent = true
source = "measured"
per_repo = true

[[metric]]
id = "speed.cold_pilot_peak_rss_mb"
board = "speed"
title = "Cold `ripr pilot` peak memory"
