version: 2

updates:
  # Rust workspace dependencies.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # unicode-ident 1.0.25+ moves ahead of unicode-properties 0.1.4 on the
      # Unicode version, and ra-ap-rustc_lexer (via ra_ap_syntax) const-asserts
      # the two match, so any bump past the manifest pin fails `cargo check`
      # with E0080. #3787 pinned 1.0.24 in crates/ripr/Cargo.toml so
      # `cargo install` without --locked still resolves. Ignore until a
      # unicode-properties release matches; then remove the pin and this
      # ignore together in one deliberate PR (#4420 documents the failure).
      - dependency-name: "unicode-ident"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # VS Code extension package.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - vscode
      - npm
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # @types/vscode is the compile-time contract for engines.vscode and must
      # move deliberately, in lockstep with the advertised support floor — never
      # via auto-bump. Pinned to ~1.90 in package.json so the floor is enforced
      # (#1033). Ignore all of its updates here.
      - dependency-name: "@types/vscode"
    groups:
      vscode-runtime:
        patterns:
          - "vscode-languageclient"
        update-types:
          - minor
          - patch
      vscode-dev-tools:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Toronto
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
      - ci
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
