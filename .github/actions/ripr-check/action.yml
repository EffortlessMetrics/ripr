name: 'ripr check'
description: 'Run ripr static mutation-exposure analysis on a PR diff'
author: 'EffortlessMetrics'

inputs:
  mode:
    description: 'Analysis mode: draft, deep, or ready'
    required: false
    default: 'draft'
  format:
    description: 'Output format: human, json, or sarif'
    required: false
    default: 'human'
  base:
    description: 'Base ref for diff (default: origin/main)'
    required: false
    default: 'origin/main'

runs:
  using: 'composite'
  steps:
    - name: Install ripr
      shell: bash
      run: |
        if ! command -v ripr &>/dev/null; then
          echo "Installing ripr from source..."
          cargo install ripr --locked || {
            echo "::error::Failed to install ripr. Pre-built binaries: https://github.com/EffortlessMetrics/ripr/releases"
            exit 1
          }
        fi

    # Inputs reach the shell through env, never through `${{ }}` inside
    # `run:`, so an input value cannot inject shell syntax.
    - name: Run ripr check
      shell: bash
      env:
        RIPR_INPUT_BASE: ${{ inputs.base }}
        RIPR_INPUT_MODE: ${{ inputs.mode }}
        RIPR_INPUT_FORMAT: ${{ inputs.format }}
      run: |
        ripr check --root . --base "$RIPR_INPUT_BASE" --mode "$RIPR_INPUT_MODE" --format "$RIPR_INPUT_FORMAT"

branding:
  icon: 'shield'
  color: 'blue'
