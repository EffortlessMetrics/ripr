name: Windows Advisory

on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# Advisory Windows test lane (#2393).
#
# The repo is developed on Windows and Linux but was only ever validated on
# Linux, so platform-specific breakage shipped and stayed green on `main`
# indefinitely. Four separate classes were found by hand once someone ran the
# suite on Windows: #2390 (path interpolated into JSON), #2391 (host separator
# compared against server output), #2409 (fixture swallowed git failures),
# #2429 (host separator in a portable output contract).
#
# This lane exists so that class of defect has a standing signal instead of
# depending on a manual investigation.
#
# The contract is narrower than "never fails", which the lane's own first run
# disproved by being broken:
#
#   - **Test outcomes are advisory.** A failing test does not fail this job and
#     does not gate merges. Known failures (#2419, #2430) will show up as
#     verdicts in the summary while the job stays green.
#   - **Evidence generation is not advisory.** A missing log, a missing captured
#     exit status, a summarizer crash, or a broken workflow fails the job. A lane
#     that reports success while proving nothing is the false-confidence
#     condition it exists to prevent.
#
# It is not a required check, and must not be promoted to required until #2419
# and #2430 are resolved and the lane shows stability across repeated runs on
# hardware that can actually reproduce them — the hosted runner does not
# reproduce the #2419 flakes at all, so green runs there prove nothing about
# them.
#
# Triggers:
#   - schedule: a daily standing signal independent of PR traffic.
#   - pull_request with the `windows-ci` or `full-ci` label: opt-in for authors
#     touching path handling, fixtures, or process/IO code.
#   - workflow_dispatch: manual run.
#
# The suite runs **twice** on purpose, because one sample cannot separate a
# reproducible failure from a load-dependent flake.
#
# Two samples still do not license a bare failed/flaky split. A test missing
# from a run has not been observed passing — it may have been masked, filtered,
# or never reached — so the summarizer tracks three states per run (failed,
# observed pass, not observed) and reports `masked_unknown` rather than guessing.
# Failing twice is reported as `repeated_failure`, not "deterministic", since a
# shared race can also reproduce twice.

jobs:
  windows-advisory:
    name: windows-advisory
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'windows-ci') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-windows-advisory-1.95-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every `run:` below uses a `|` block scalar. A plain YAML scalar treats
      # ` #` as the start of a comment, which silently truncates a command
      # mid-string and leaves an unterminated quote for the shell.
      - name: Record environment
        shell: bash
        run: |
          mkdir -p target && { rustc -Vv; cargo -V; echo "checkout_root=$PWD"; echo "cores=$(nproc 2>/dev/null || echo unknown)"; echo "parallel_mode=default"; } 2>&1 | tee target/windows-env.log

      # `--no-fail-fast` keeps cargo going after one target fails, so a routine
      # test failure no longer hides every later target — the masking this lane
      # exists to expose. The real cargo exit status is captured from
      # PIPESTATUS[0] into a file rather than inferred from log prose, which
      # cannot distinguish a compile failure from a test failure reliably. The
      # step itself exits 0 because test outcomes are advisory.
      - name: Run workspace tests (advisory, run 1)
        shell: bash
        run: |
          mkdir -p target; set +e; cargo test --workspace --no-fail-fast 2>&1 | tee target/windows-run1.log; printf '%s\n' "${PIPESTATUS[0]}" > target/windows-run1.status; exit 0

      - name: Run workspace tests (advisory, run 2)
        shell: bash
        run: |
          mkdir -p target; set +e; cargo test --workspace --no-fail-fast 2>&1 | tee target/windows-run2.log; printf '%s\n' "${PIPESTATUS[0]}" > target/windows-run2.status; exit 0

      - name: Summarize environment
        shell: bash
        run: |
          printf '## Windows advisory lane\n\nAdvisory only: this lane never fails and is not a required check (issue 2393).\n\n### Environment\n\n```\n%s\n```\n' "$(cat target/windows-env.log 2>/dev/null || echo unavailable)" >> "$GITHUB_STEP_SUMMARY" || true

      # The verdict is written to a file as well as to the step summary. A step
      # summary is not retrievable through the API, so a verdict that lived only
      # there could not be cited as evidence later — only the raw logs could,
      # which defeats the point of computing a verdict at all.
      #
      # Deliberately NOT suffixed with `|| true`. Test outcomes are advisory;
      # the lane's ability to produce trustworthy evidence is not. A missing log,
      # a missing exit status, or a summarizer crash fails this step and therefore
      # the job — otherwise the lane could report success while proving nothing,
      # which is the false-confidence condition it exists to prevent.
      - name: Summarize verdicts and repeated-run stability
        shell: bash
        run: |
          cargo xtask windows-advisory-summary --run1 target/windows-run1.log --run1-status target/windows-run1.status --run2 target/windows-run2.log --run2-status target/windows-run2.status | tee target/windows-verdict.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload advisory logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-windows-advisory
          path: |
            target/windows-verdict.md
            target/windows-env.log
            target/windows-run1.log
            target/windows-run2.log
            target/windows-run1.status
            target/windows-run2.status
          if-no-files-found: ignore
