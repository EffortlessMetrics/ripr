name: Repair 1710 candidate v3

on:
  push:
    branches:
      - release/manifest-v2-producer-catalog

permissions:
  contents: write

concurrency:
  group: repair-1710-candidate-v3
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/manifest-v2-producer-catalog

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/repair-1710-v2.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'repair-1710-v2-extracted.py', 'exec'))
          PY
          rm -f .github/workflows/repair-1710.yml
          rm -f .github/workflows/repair-1710-v2.yml
          rm -f .github/workflows/repair-1710-v3.yml
          cargo fmt --all
          git diff --check

      - name: Focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask release_distribution_catalog -- --nocapture
          cargo test -p xtask vscode_package -- --nocapture
          cargo test -p xtask command_catalog -- --nocapture
          npm --prefix editors/vscode ci
          npm --prefix editors/vscode run compile
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm --prefix editors/vscode test
          cargo xtask check-command-catalog
          cargo xtask check-process-policy
          cargo xtask check-network-policy
          cargo xtask check-generated-clean
          cargo xtask precommit
          git diff --check

      - name: Commit repaired candidate
        shell: bash
        env:
          BRANCH: release/manifest-v2-producer-catalog
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "fix(release): bind catalog production and packaging admission"
          git push origin "HEAD:${BRANCH}"
