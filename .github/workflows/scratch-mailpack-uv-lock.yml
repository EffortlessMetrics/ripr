name: Scratch mailpack uv lock proof

on:
  push:
    branches:
      - scratch/mailpack-uv-lock-20260826
    paths:
      - '.github/workflows/scratch-mailpack-uv-lock.yml'
      - '.scratch/mailpack-pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scratch-mailpack-uv-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_MANAGED_PYTHON: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - name: Checkout exact scratch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
          enable-cache: false

      - name: Materialize exact mailpack project metadata
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mailpack-lock"
          rm -rf "$root"
          mkdir -p "$root/src/mailpack"
          cp .scratch/mailpack-pyproject.toml "$root/pyproject.toml"
          printf '# Mailpack lock proof\n' > "$root/README.md"
          printf 'MIT\n' > "$root/LICENSE-MIT"
          printf 'Apache-2.0\n' > "$root/LICENSE-APACHE"
          printf '__version__ = "0.5.0"\n' > "$root/src/mailpack/__init__.py"
          : > "$root/src/mailpack/py.typed"
          printf '3.13.15\n' > "$root/.python-version"

      - name: Resolve and verify the universal lock
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mailpack-lock"
          cd "$root"
          uv --version
          uv python install 3.13.15
          uv lock
          uv lock --check
          UV_PROJECT_ENVIRONMENT="$root/.venv" \
            uv sync --locked --no-install-project
          UV_PROJECT_ENVIRONMENT="$root/.venv" \
            uv run --locked --no-sync python -c \
              'import sys; assert sys.version_info[:3] == (3, 13, 15)'
          uv tree --locked > uv-tree.txt
          uv export --locked --all-groups --all-extras \
            --format cyclonedx1.5 \
            --output-file dependencies.cdx.json

      - name: Write exact-input proof receipt
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mailpack-lock"
          ROOT="$root" SCRATCH_SHA="${GITHUB_SHA}" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['ROOT'])

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              'schema': 'mailpack-uv-lock-proof/1',
              'scratch_repository': os.environ['GITHUB_REPOSITORY'],
              'scratch_sha': os.environ['SCRATCH_SHA'],
              'python_version': '3.13.15',
              'uv_version': subprocess.check_output(
                  ['uv', '--version'], text=True
              ).strip(),
              'pyproject': {
                  'sha256': digest(root / 'pyproject.toml'),
                  'size': (root / 'pyproject.toml').stat().st_size,
              },
              'lock': {
                  'sha256': digest(root / 'uv.lock'),
                  'size': (root / 'uv.lock').stat().st_size,
              },
              'tree': {
                  'sha256': digest(root / 'uv-tree.txt'),
                  'size': (root / 'uv-tree.txt').stat().st_size,
              },
              'cyclonedx': {
                  'sha256': digest(root / 'dependencies.cdx.json'),
                  'size': (root / 'dependencies.cdx.json').stat().st_size,
              },
          }
          (root / 'proof.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Retain the verified lock in the scratch branch
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/mailpack-lock/uv.lock" .scratch/mailpack-uv.lock
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- .scratch/mailpack-uv.lock
          if git diff --cached --quiet; then
            echo 'Generated lock already matches the retained scratch object.'
          else
            git commit -m 'ci(scratch): retain generated mailpack uv lock'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Deliver the verified bytes to PR 257
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [[ -n "${GH_PAT:-}" ]] || {
            echo 'GH_PAT is not available to the scratch delivery lane' >&2
            exit 78
          }
          source_lock="${RUNNER_TEMP}/mailpack-lock/uv.lock"
          expected_lock_sha='fe1a3e42112eb55a8b9667c75646d3a1bed7634fecc7f5698165666a237e206d'
          expected_pyproject_sha='f95ecef68ef77e28e6caa9719ccbdbd106bdc7e236942b1818ba062569a146d6'
          [[ $(wc -c < "$source_lock") -eq 524395 ]]
          printf '%s  %s\n' "$expected_lock_sha" "$source_lock" | sha256sum --check

          askpass="${RUNNER_TEMP}/mailpack-git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_PAT" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 0700 "$askpass"

          target="${RUNNER_TEMP}/mailpack"
          rm -rf "$target"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git clone --filter=blob:none --no-checkout \
              https://github.com/EffortlessMetrics/mailpack.git "$target"
          cd "$target"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git fetch origin chore/uv-project-modernization
          git checkout --detach FETCH_HEAD
          [[ $(git rev-parse HEAD) == '1993faf1352498b00c5975f457e90f09010551ca' ]] || {
            echo 'PR 257 head moved; refusing stale delivery' >&2
            exit 75
          }
          printf '%s  %s\n' "$expected_pyproject_sha" pyproject.toml | sha256sum --check
          cp -- "$source_lock" uv.lock
          rm -f -- .github/workflows/import-verified-uv-lock.yml .ci/uv-lock-proof.json
          uv lock --check
          [[ $(wc -c < uv.lock) -eq 524395 ]]
          printf '%s  %s\n' "$expected_lock_sha" uv.lock | sha256sum --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- uv.lock .github/workflows/import-verified-uv-lock.yml .ci/uv-lock-proof.json
          git diff --cached --check
          git commit -m 'build(uv): commit the verified universal lock'
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:chore/uv-project-modernization

      - name: Upload exact lock proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: mailpack-uv-lock-proof
          path: |
            ${{ runner.temp }}/mailpack-lock/uv.lock
            ${{ runner.temp }}/mailpack-lock/uv-tree.txt
            ${{ runner.temp }}/mailpack-lock/dependencies.cdx.json
            ${{ runner.temp }}/mailpack-lock/proof.json
          if-no-files-found: error
          retention-days: 1
