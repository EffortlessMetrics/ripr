name: Source Swarm Sync Observer

on:
  push:
    branches:
      - agent/source-swarm-sync-observer-2026-07-21

permissions:
  actions: read
  contents: write

jobs:
  observe:
    if: ${{ !contains(github.event.head_commit.message, '[observer-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Record replacement source promotion VS Code failure tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "88761358175"
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error --location "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            > /tmp/job.log
          tail -450 /tmp/job.log > source-promotion-vscode2-failure-tail.txt
          grep -n -E '(^|[^A-Za-z])(Error|ERROR|Failed|FAILED|failure|AssertionError|Timeout|timed out|expected|actual)' /tmp/job.log \
            | tail -160 > source-promotion-vscode2-failure-index.txt || true

          git config user.name "Effortless Metrics Sync Observer"
          git config user.email "actions@users.noreply.github.com"
          git add source-promotion-vscode2-failure-tail.txt source-promotion-vscode2-failure-index.txt
          git commit -m "chore: record replacement promotion VS Code failure [observer-report]"
          git push origin HEAD:agent/source-swarm-sync-observer-2026-07-21
