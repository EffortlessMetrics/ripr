name: Source Swarm Sync Observer

on:
  push:
    branches:
      - agent/source-swarm-sync-observer-2026-07-21

permissions:
  actions: read
  contents: write

jobs:
  observe:
    if: ${{ !contains(github.event.head_commit.message, '[observer-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Record runner workflow status and failure tail
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_BRANCH: agent/source-swarm-sync-runner-2026-07-21
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          runs_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${RUNNER_BRANCH}&per_page=20"
          curl --fail --silent --show-error "${auth[@]}" "$runs_api" > /tmp/runs.json
          jq '{total_count, workflow_runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_sha,head_branch,created_at,updated_at,html_url}]}' /tmp/runs.json > source-swarm-runner-status.json

          run_id="$(jq -r '[.workflow_runs[] | select(.name == "Source Swarm Promotion Runner" and .conclusion == "failure")][0].id // empty' /tmp/runs.json)"
          if [ -n "$run_id" ]; then
            jobs_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"
            curl --fail --silent --show-error "${auth[@]}" "$jobs_api" > /tmp/jobs.json
            job_id="$(jq -r '[.jobs[] | select(.conclusion == "failure")][0].id // empty' /tmp/jobs.json)"
            if [ -n "$job_id" ]; then
              curl --fail --silent --show-error --location "${auth[@]}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
                > /tmp/job.log
              tail -350 /tmp/job.log > source-swarm-runner-failure-tail.txt
            fi
          fi

          git config user.name "Effortless Metrics Sync Observer"
          git config user.email "actions@users.noreply.github.com"
          git add source-swarm-runner-status.json source-swarm-runner-failure-tail.txt
          git commit -m "chore: record source/swarm runner failure [observer-report]"
          git push origin HEAD:agent/source-swarm-sync-observer-2026-07-21
