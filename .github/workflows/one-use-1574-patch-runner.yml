name: One-use #1574 bounded patch runner

on:
  push:
    branches:
      - feat/source-promotion-resolved-tree-validator-1574

permissions: {}

concurrency:
  group: one-use-1574-bounded-patch-runner
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'chore(control): trigger bounded #1574 patch'
    permissions:
      contents: write # Publishes only the exact reviewed branch patch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Install governed formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Execute exact parent-owned transformation
        shell: bash
        env:
          EXPECTED_GRANDPARENT: 64102e6c2a92d11068bd4a8724c810ee192e2a4e
          SOURCE_WORKFLOW_BLOB: 5ceeb5ef330eb2aa4af267aea763408712b361d9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_GRANDPARENT"
          test "$(git show -s --format=%s HEAD^)" = 'chore(control): add bounded #1574 patch runner'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD^)" = '.github/workflows/one-use-1574-patch-runner.yml'
          test "$(git show -s --format=%s HEAD)" = 'chore(control): trigger bounded #1574 patch'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/one-use-1574-finalize-trigger.txt'
          test "$(git rev-parse HEAD^:.github/workflows/one-use-1574-finalize.yml)" = "$SOURCE_WORKFLOW_BLOB"

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-use-1574-finalize.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n          cargo fmt --all"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('source workflow does not contain one exact embedded transformation')
          script = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(script), '<embedded-1574-patch>', 'exec'), {})
          PY

          cargo fmt --all
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            policy/process_allowlist.txt \
            xtask/src/command.rs \
            xtask/src/dispatch.rs \
            xtask/src/reports/mod.rs \
            xtask/src/reports/source_promotion_validate_resolved_tree.rs \
            xtask/tests/source_promotion_resolved_tree.rs | sort)"
          test "$changed" = "$expected"

          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- $changed
          git commit -m 'fix(promotion): close resolved-tree validator review gaps'
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
