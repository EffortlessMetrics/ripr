name: One-use #1574 exact transformer

on:
  pull_request:
    types: [synchronize]

permissions: {}

concurrency:
  group: one-use-1574-exact-transformer
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 1605 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/source-promotion-resolved-tree-validator-1574'
    permissions:
      contents: write # Publishes only the exact hash-verified transformation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install governed formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact reviewed transformation
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: f662088a9faf2132283ba59f88248df69616bebc22ea5f2473eee8f528d2b116
          EXPECTED_SCRIPT_SHA256: b4f13425cca1aa90f705c948479e76038a0b0fcf86a0f076a73817da96a1f526
        run: |
          set -euxo pipefail
          test "$(git show -s --format=%s HEAD)" = 'chore(control): trigger chunked #1574 transformer'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/one-use-1574-finalize-trigger.txt'
          test "$(git show -s --format=%s HEAD^)" = 'chore(control): enable chunked #1574 transformer'

          test "$(sha256sum tools/one_use_1574_patch_parts/part00 | awk '{print $1}')" = a64bdc9da3016c2e3d7399b55a6da4829c7edd46de10d08f52a7fe7360715862
          test "$(sha256sum tools/one_use_1574_patch_parts/part01 | awk '{print $1}')" = c3163d7c7a92cb4d074e33e211631f57b1ce5e6dc57b84ba6700115e88aa93d2
          test "$(sha256sum tools/one_use_1574_patch_parts/part02 | awk '{print $1}')" = bad305c794e6823ff38d0fd787cda3ada235c416fa90e5ea5bff461984c4d01a
          test "$(sha256sum tools/one_use_1574_patch_parts/part03 | awk '{print $1}')" = 8fb2171e9d016597db803c2c4cf0b60675607a0114356aa4bc895e1ced84d506
          test "$(sha256sum tools/one_use_1574_patch_parts/part04 | awk '{print $1}')" = 1182566e60c97b57521f87a78051d0f313470358408aaa9e3925c826021e1e18
          test "$(sha256sum tools/one_use_1574_patch_parts/part05 | awk '{print $1}')" = 05c5fcd70f8d05b13516c2ddb9e82ff02f8944f05467ef2c2e1b5a50e94c1c35
          test "$(sha256sum tools/one_use_1574_patch_parts/part06 | awk '{print $1}')" = 9329ea88b3ac8370cfd03f0846c70f756b79d3310fb30ff9bf098d18c8d27b68
          test "$(sha256sum tools/one_use_1574_patch_parts/part07 | awk '{print $1}')" = 66dcc7845e693ba140e0c1b607a36bef7e0c055ebf3a42e6bdea87c070c745d4

          cat tools/one_use_1574_patch_parts/part{00..07} > /tmp/one_use_1574_patch.py.gz.b64
          test "$(sha256sum /tmp/one_use_1574_patch.py.gz.b64 | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          base64 --decode /tmp/one_use_1574_patch.py.gz.b64 | gzip --decompress > /tmp/one_use_1574_patch.py
          test "$(sha256sum /tmp/one_use_1574_patch.py | awk '{print $1}')" = "$EXPECTED_SCRIPT_SHA256"
          python3 -m py_compile /tmp/one_use_1574_patch.py
          python3 /tmp/one_use_1574_patch.py

          cargo fmt --all
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .ripr/traceability.toml \
            docs/SOURCE_PROMOTION.md \
            docs/specs/RIPR-SPEC-0150-source-promotion-ci-contract.md \
            fixtures/source_promotion_resolved_tree/SPEC.md \
            fixtures/source_promotion_resolved_tree/expected/rejected.json \
            fixtures/source_promotion_resolved_tree/expected/rejected.md \
            fixtures/source_promotion_resolved_tree/expected/validated.json \
            fixtures/source_promotion_resolved_tree/expected/validated.md \
            policy/output_contracts.txt \
            policy/process_allowlist.txt \
            xtask/src/command.rs \
            xtask/src/dispatch.rs \
            xtask/src/reports/mod.rs \
            xtask/src/reports/source_promotion_validate_resolved_tree.rs \
            xtask/tests/source_promotion_resolved_tree.rs | sort)"
          test "$changed" = "$expected"

          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- $changed
          git commit -m 'fix(promotion): close resolved-tree validator review gaps'
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
