name: "Build final #1559 source repair"

on:
  push:
    branches:
      - control/0.11.0-j2-catalog-builder

permissions:
  contents: write

concurrency:
  group: build-1559-final-source-repair
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BASE: a072b7efe80f1a32d7b5ba7342559a114edeb12e
      TRANSPORT_BRANCH: transport/1559-final-source-repair
    steps:
      - name: Check out the control builder exactly
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Build, prove, and transport the source repair
        shell: bash
        run: bash tools/release-control/1559/build.sh
