name: PR Staleness Watchdog

# GitHub sometimes silently drops the `pull_request` event delivery that would
# create the routed-rust.yml run for a pushed PR head SHA (#4937). When that
# happens the PR's only required check (`Ripr Rust Small Result`) never
# appears: no red X and no pending dot — the merge stays blocked with nothing
# to retry. PRs #4528/#4537 sat dark for ~9 hours until someone manually
# dispatched the workflow; PR #4923 waited ~35 minutes for its required check
# to exist at all.
#
# This watchdog is alert-only (#4986; issue #4937 option ii). It used to
# dispatch `routed-rust.yml` on a dark head's branch, but routed-rust.yml now
# admits pull requests only on the native Draft -> Ready transition
# (`pull_request: types: [ready_for_review]`). A non-draft head with no
# required check is therefore either a Ready-triggered run GitHub dropped or a
# push made after Ready, and nothing visible to this sweep tells the two apart.
# A post-Ready push has revoked its own admission and must not be qualified by
# a lighter branch-head dispatch (no `pull_request`-scoped PR evidence): the
# author returns the PR to Draft and marks it Ready again, which re-runs the
# full Ready-triggered qualification and also recovers a dropped delivery.
#
# - Every 30 minutes, list open PRs and, for each head SHA, ask the checks
#   API whether the required `Ripr Rust Small Result` check run exists on
#   that SHA. Run existence alone is not the discriminator: an unrelated
#   same-workflow run can post a non-required result name, so coverage is
#   judged by the presence of the exact check branch protection requires.
# - The required check run is created only when the `result` job starts, after
#   every implementation job finishes (up to 120 minutes). A head with no
#   required check but a queued or in-progress Ready-triggered
#   (`event=pull_request`) routed-rust.yml run is reported as in flight, not
#   dark: re-toggling Draft -> Ready would cancel that run
#   (`cancel-in-progress` for pull_request) and restart the qualification.
# - Dark heads are reported in the step summary with the remedy (Draft ->
#   Ready). The watchdog never dispatches a workflow, so it needs no
#   `actions: write` and cannot create a duplicate or lighter required gate.
# - Drafts are skipped (Draft iteration never carries the required check);
#   fork PRs (head repo != this repository) are skipped, matching
#   routed-rust.yml's own untrusted-PR guard.
#
# No PR comments are posted; each sweep's summary table (PR | head |
# disposition) is the audit trail.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  # Read-only: list routed-rust.yml runs to tell an in-flight qualification
  # from a dark head. Never `actions: write`.
  actions: read

jobs:
  watchdog:
    name: Report dark Ready PR heads
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize overlapping fires. Do not cancel: an in-progress sweep must
    # finish writing its summary.
    concurrency:
      group: pr-staleness-watchdog-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Report open Ready PR heads missing the required check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUIRED_CHECK: Ripr Rust Small Result
        run: |
          set -euo pipefail

          prs="$(gh api "repos/$REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[] | [.number, .head.sha, .head.ref, (.head.repo.full_name // ""), (.draft | tostring)] | @tsv')"

          {
            echo "### PR Staleness Watchdog (alert-only)"
            echo ""
            echo "Dark = no \`$REQUIRED_CHECK\` check run and no queued or in-progress Ready-triggered"
            echo "routed-rust.yml run on a Ready PR head SHA (#4937, #4986). In flight = the run exists"
            echo "but has not reached its result job yet; leave it alone."
            echo "This sweep never dispatches. Remedy for a dark head: convert the PR to Draft,"
            echo "then mark it Ready for review again to run the Ready-triggered qualification."
            echo ""
            echo "| PR | head | disposition |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          scanned=0 dark=0 in_progress=0
          while IFS=$'\t' read -r number head_sha head_ref head_repo draft; do
            [ -n "${number:-}" ] || continue
            scanned=$((scanned + 1))
            if [ "$draft" = "true" ]; then
              disposition="skip: draft"
            elif [ "$head_repo" != "$REPOSITORY" ]; then
              disposition="skip: fork/untrusted head (${head_repo:-deleted})"
            else
              count="$(gh api --paginate "repos/$REPOSITORY/commits/$head_sha/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$REQUIRED_CHECK\")] | length" | awk '{s+=$1} END{print s+0}')"
              if [ "$count" != "0" ]; then
                disposition="covered ($count required check(s) on head)"
              else
                in_flight="$(gh api --paginate "repos/$REPOSITORY/actions/workflows/routed-rust.yml/runs?event=pull_request&head_sha=$head_sha&per_page=100" --jq '[.workflow_runs[] | select(.status != "completed")] | length' | awk '{s+=$1} END{print s+0}')"
                if [ "$in_flight" != "0" ]; then
                  in_progress=$((in_progress + 1))
                  disposition="in flight ($in_flight Ready-triggered run(s) not yet at result; do not re-toggle)"
                else
                  dark=$((dark + 1))
                  disposition="DARK; needs Draft -> Ready (\`$head_ref\`)"
                  echo "::warning title=Dark Ready PR head::PR #$number head ${head_sha:0:8} has no $REQUIRED_CHECK check and no queued or in-progress Ready-triggered run (pushed after Ready, or the Ready event was dropped); convert to Draft and mark Ready again."
                fi
              fi
            fi
            echo "| #$number | \`${head_sha:0:8}\` | $disposition |" >> "$GITHUB_STEP_SUMMARY"
          done <<<"$prs"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open PRs scanned: $scanned; in-flight qualifications: $in_progress; dark Ready heads reported: $dark." >> "$GITHUB_STEP_SUMMARY"
