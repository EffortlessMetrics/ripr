name: Python Wheelhouse Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable candidate commit SHA (40 hexadecimal characters)"
        required: true
        type: string

# Credential-free wheelhouse rehearsal for #4631. No registry write, OIDC,
# secret, tag, or release permission exists on this workflow.
permissions:
  contents: read

concurrency:
  group: python-wheelhouse-qualification-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: local wheelhouse pip and uv rows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Initialize receipt root
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP}/ripr-python-wheelhouse"
          mkdir -p "${base}/receipts/rows" "${base}/wheelhouse" "${base}/consumer" "${base}/decoy"
          echo "QUAL_ROOT=${base}/receipts" >> "$GITHUB_ENV"
          echo "WHEELHOUSE=${base}/wheelhouse" >> "$GITHUB_ENV"
          echo "CONSUMER_ROOT=${base}/consumer" >> "$GITHUB_ENV"
          echo "DECOY_ROOT=${base}/decoy" >> "$GITHUB_ENV"

      - name: Checkout immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA,,}"
          test "$(git rev-parse HEAD^{tree})"
          python3 -c "import json,os,pathlib,subprocess; p=pathlib.Path(os.environ['QUAL_ROOT'])/'candidate-identity.json'; p.write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'limitations':[],'non_claims':['no PyPI publication','no compatibility-floor claim','no support-tier promotion']},indent=2)+'\n')"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0

      - name: Stage local wheelhouse
        run: |
          set -euo pipefail
          shopt -s nullglob
          cp dist/wheels/*.whl "${WHEELHOUSE}/" 2>/dev/null || true
          cp packaging/python/dist/*.whl "${WHEELHOUSE}/" 2>/dev/null || true
          python3 -m pip install --user uv
          printf '%s\n' '#!/bin/sh' 'echo planted-wrong-path' > "${DECOY_ROOT}/ripr"
          chmod +x "${DECOY_ROOT}/ripr"

      - name: Isolated pip and uv wheelhouse installs
        run: |
          set -euo pipefail
          cd "${CONSUMER_ROOT}"
          export PIP_NO_INDEX=1 UV_OFFLINE=1
          if python3 -c "import urllib.request; urllib.request.urlopen('https://pypi.org', timeout=5)"; then network=false; else network=true; fi
          export PATH="${CONSUMER_ROOT}/venv/bin:${CONSUMER_ROOT}/uv/bin:${DECOY_ROOT}:/usr/bin:/bin"
          cargo_ok=false; ambient=false; planted=false; source_ok=false
          if command -v cargo >/dev/null || command -v rustc >/dev/null; then cargo_ok=true; fi
          if [ -x /usr/bin/ripr ] || [ -x /bin/ripr ]; then ambient=true; fi
          if [ "$(command -v ripr 2>/dev/null || true)" = "${DECOY_ROOT}/ripr" ] && [ "$(ripr)" = "planted-wrong-path" ]; then planted=true; fi
          if test -r "${GITHUB_WORKSPACE}/Cargo.toml"; then source_ok=true; fi
          shopt -s nullglob
          wheels=("${WHEELHOUSE}"/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "need exactly one staged wheel; required pip/uv rows stay missing pending #4490" >&2
            exit 0
          fi
          python3 -m venv "${CONSUMER_ROOT}/venv"
          "${CONSUMER_ROOT}/venv/bin/pip" install --no-index --find-links "${WHEELHOUSE}" ripr-rs
          mkdir -p "${CONSUMER_ROOT}/uv/bin"
          PATH="${HOME}/.local/bin:${PATH}" UV_TOOL_BIN_DIR="${CONSUMER_ROOT}/uv/bin" UV_TOOL_DIR="${CONSUMER_ROOT}/uv/tools" UV_FIND_LINKS="${WHEELHOUSE}" HOME="${CONSUMER_ROOT}" uv tool install --offline ripr-rs
          pip_bin="${CONSUMER_ROOT}/venv/bin/ripr"
          uv_bin="${CONSUMER_ROOT}/uv/bin/ripr"
          test -x "${pip_bin}" && test "${pip_bin}" != "${DECOY_ROOT}/ripr"
          test -x "${uv_bin}" && test "${uv_bin}" != "${DECOY_ROOT}/ripr"
          test "$(command -v ripr)" != "${DECOY_ROOT}/ripr"
          python3 - "$pip_bin" "$uv_bin" "$cargo_ok" "$source_ok" "$ambient" "$planted" "$network" "${wheels[0]}" <<'PY'
          import hashlib, json, os, pathlib, sys
          wheel = pathlib.Path(sys.argv[8])
          sha = hashlib.sha256(wheel.read_bytes()).hexdigest()
          root = pathlib.Path(os.environ["QUAL_ROOT"]) / "rows"
          root.mkdir(parents=True, exist_ok=True)
          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          def flag(index):
              return sys.argv[index] == "true"
          def write(client, binary):
              row = {"client": client, "os": "linux", "arch": "x86_64", "status": "failed",
                     "wheel_filename": wheel.name, "wheel_sha256": sha, "payload_sha256": digest(binary),
                     "subject_count": 0, "cargo_reachable": flag(3), "source_checkout_reachable": flag(4),
                     "ambient_ripr_reachable": flag(5), "planted_wrong_path_detected": flag(6),
                     "network_disabled_after_staging": flag(7),
                     "limitations": ["installed-use analysis is owned by #4626; subject_count stays 0 so this row cannot pass"]}
              (root / f"{client}.json").write_text(json.dumps(row, indent=2) + "\n")
          write("pip", sys.argv[1]); write("uv", sys.argv[2])
          PY

      - name: Evaluate wheelhouse aggregate
        if: always()
        run: cargo xtask qualify-python-wheelhouse --receipts "${QUAL_ROOT}"

      - name: Upload Actions-only receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wheelhouse-qualification-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/ripr-python-wheelhouse/receipts
          if-no-files-found: error
          retention-days: 5
