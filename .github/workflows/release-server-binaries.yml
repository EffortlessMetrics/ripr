name: Release ripr Server Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.11.0"
        required: true
      expected_source_sha:
        description: "Exact source SHA for the read-only non-publishing rehearsal"
        required: true
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            executable: ripr.exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            executable: ripr
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            executable: ripr
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            executable: ripr
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            executable: ripr
            archive: tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Build ripr
        run: cargo build -p ripr --release --locked --target ${{ matrix.target }}

      - name: Package server archive
        shell: bash
        env:
          RIPR_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: cargo run --locked -p xtask -- release-server-archive --version "$RIPR_RELEASE_VERSION" --target "${{ matrix.target }}" --executable "${{ matrix.executable }}" --archive "${{ matrix.archive }}"

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-${{ matrix.target }}
          path: dist/*

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: actions/download-artifact@v8
        with:
          pattern: ripr-server-*
          path: dist
          merge-multiple: true

      - name: Generate manifest and checksums
        shell: bash
        env:
          RIPR_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: cargo run --locked -p xtask -- release-server-manifest --version "$RIPR_RELEASE_VERSION" --repository "${{ github.repository }}"

      - name: Inventory exact final server subjects
        shell: bash
        env:
          RIPR_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: cargo run --locked -p xtask -- release-final-server-subjects --version "$RIPR_RELEASE_VERSION" --repository "${{ github.repository }}"

      - name: Retain final server staging packet
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-final-staging
          path: dist/*
          if-no-files-found: error

  rehearsal:
    needs: manifest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: actions/download-artifact@v8
        with:
          name: ripr-server-final-staging
          path: dist

      - name: Emit exact-SHA read-only attestation fixture
        env:
          RIPR_RELEASE_VERSION: ${{ github.event.inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
        shell: bash
        run: cargo run --locked -p xtask -- release-final-server-attestation-fixture --version "$RIPR_RELEASE_VERSION" --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Retain read-only rehearsal packet
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-attestation-fixture
          path: dist/*
          if-no-files-found: error

  attest:
    needs: manifest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: actions/download-artifact@v8
        with:
          name: ripr-server-final-staging
          path: dist

      - name: Attest exact final server subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ripr-server-v*.zip
            dist/ripr-server-v*.tar.gz
            dist/ripr-server-manifest-v*.json
            dist/SHA256SUMS

      - name: Verify every final subject attestation
        shell: bash
        env:
          RIPR_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RIPR_ATTESTATION_ACTION_COMPLETED: "true"
        run: |
          set -euo pipefail
          version="${RIPR_RELEASE_VERSION#v}"
          inventory="dist/ripr-server-final-subjects-v${version}.json"
          verified="${RUNNER_TEMP}/verified-subjects.txt"
          : > "${verified}"
          while IFS=

      - name: Retain verified attestation packet
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-attested
          path: dist/*
          if-no-files-found: error

  release:
    needs: attest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: actions/download-artifact@v8
        with:
          name: ripr-server-attested
          path: dist

      - name: Upload attested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RIPR_RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: cargo run --locked -p xtask -- release-upload-assets --version "$RIPR_RELEASE_VERSION"
\t' read -r sha name; do
            gh attestation verify "dist/${name}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-server-binaries.yml" --signer-digest "${GITHUB_SHA}" --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}"
            printf '%s  %s\n' "${sha}" "${name}" >> "${verified}"
          done < <(jq -r '.subjects[] | [.sha256, .name] | @tsv' "${inventory}")
          cargo run --locked -p xtask -- release-final-server-attestation-receipt --version "${version}" --verified-subjects "${verified}"

      - name: Retain verified attestation packet
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-attested
          path: dist/*
          if-no-files-found: error

  release:
    needs: attest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: actions/download-artifact@v8
        with:
          name: ripr-server-attested
          path: dist

      - name: Upload attested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RIPR_RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: cargo run --locked -p xtask -- release-upload-assets --version "$RIPR_RELEASE_VERSION"
