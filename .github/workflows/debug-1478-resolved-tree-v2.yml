name: Debug 1478 Resolved Tree v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: debug-1478-resolved-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-validate:
    if: github.head_ref == 'debug/1478-preflight-bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_PARENT: 2b45cffe4353cc055ce201070555450f4c85d6ac
      SWARM_PARENT: c86807ecdbf359594ef88c0ff38b10b446139dca
      EXPECTED_TREE: 4146719129a2d657052c1491d2d5262a3138aab9
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preserve and complete resolver outside the parent worktree
        run: |
          cp .github/scripts/debug-1478-resolve.py /tmp/debug-1478-resolve.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/debug-1478-resolve.py')
          text = p.read_text()
          needle = "\ngit('add', '-A')\n"
          insertion = r'''
          # Cross-repository diff-check exposes historical trailing spaces that
          # were not conflicts inside either parent. Normalize only the named
          # imported evidence/fixture files and retire the surviving live goal
          # pointer before validating the resolved tree.
          whitespace_files = [
              'docs/handoffs/2026-07-11-targeted-rerun-benchmark.md',
              'docs/handoffs/2026-07-12-call-presence-evidence-packet.md',
              'docs/status/RUST_ROUTE_QUALITY.md',
              'fixtures/assertion_shaped_control_production_caller/diff.patch',
              'fixtures/evidence-promotion-honesty-corpus/patches/semver-matches-greater.diff',
              'fixtures/rust_transitive_reach_test_helper_chain/diff.patch',
              'fixtures/typescript_adversarial_hoc_wrapped_owner/diff.patch',
              'fixtures/typescript_adversarial_owner_identity_after_insertion/diff.patch',
              'plans/rust-one-shot-evidence-to-repair.md',
          ]
          for name in whitespace_files:
              path = Path(name)
              path.write_text('\n'.join(line.rstrip() for line in path.read_text().splitlines()) + '\n')

          path = Path('plans/rust-one-shot-evidence-to-repair.md')
          plan = path.read_text()
          old = 'Linked goal: `.ripr/goals/active.toml`\n'
          new = 'Live execution: GitHub issues, pull requests, checks, reviews, and PR-local `ImplementationSliceV1` records\n'
          assert plan.count(old) == 1
          path.write_text(plan.replace(old, new, 1))
          '''
          assert text.count(needle) == 1
          p.write_text(text.replace(needle, '\n' + insertion + needle, 1))
          PY

      - name: Fetch and merge exact parents
        run: |
          git remote add swarm https://github.com/EffortlessMetrics/ripr-swarm.git
          git fetch --no-tags swarm "$SWARM_PARENT"
          git branch --force source-parent "$SOURCE_PARENT"
          git branch --force swarm-candidate FETCH_HEAD
          git config user.name "RIPR release preflight"
          git config user.email "release-preflight@example.invalid"
          git switch --detach source-parent
          git merge --no-commit --no-ff swarm-candidate || true
          test "$(git diff --name-only --diff-filter=U | wc -l)" -eq 8

      - name: Apply reviewed resolution and assert tree identity
        run: |
          set -o pipefail
          python3 /tmp/debug-1478-resolve.py 2>&1 | tee /tmp/debug-1478-resolve.log

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Validate contracts and focused behavior
        run: |
          cargo fmt --all -- --check
          cargo test -p ripr subprocess --locked -- --test-threads=1
          cargo test -p ripr review_comments --locked -- --test-threads=1
          cargo xtask check-spec-format
          cargo xtask check-spec-numbering
          cargo xtask check-traceability
          cargo xtask check-doc-artifacts
          cargo xtask check-process-policy
          cargo xtask check-network-policy
          cargo xtask check-output-contracts
          cargo xtask check-workflows
          cargo xtask goldens check

      - name: Validate source integration build
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo package -p ripr --list --locked > target/package-list.txt
          cargo publish -p ripr --dry-run --locked

      - name: Validate editor package
        run: |
          npm --prefix editors/vscode ci
          npm --prefix editors/vscode run compile
          npm --prefix editors/vscode run package

      - name: Export exact resolved tree
        if: always()
        run: |
          mkdir -p target/resolved-tree-v2
          cp /tmp/debug-1478-resolve.log target/resolved-tree-v2/resolver.log 2>/dev/null || true
          git show -s --format='%H%n%P%n%T%n%s' HEAD | tee target/resolved-tree-v2/identity.txt
          git diff --stat "$SOURCE_PARENT" HEAD > target/resolved-tree-v2/source-delta.stat
          git diff --stat "$SWARM_PARENT" HEAD > target/resolved-tree-v2/swarm-delta.stat
          git bundle create target/resolved-tree-v2/ripr-0.11-resolved-tree.bundle source-parent swarm-candidate HEAD
          git bundle verify target/resolved-tree-v2/ripr-0.11-resolved-tree.bundle | tee target/resolved-tree-v2/bundle-verify.txt
          sha256sum target/resolved-tree-v2/ripr-0.11-resolved-tree.bundle | tee target/resolved-tree-v2/bundle.sha256
          cp target/package-list.txt target/resolved-tree-v2/package-list.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ripr-0.11-resolved-tree-validation-v2
          path: target/resolved-tree-v2/
          if-no-files-found: error
