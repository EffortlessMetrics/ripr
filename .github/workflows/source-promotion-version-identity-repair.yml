name: Source Promotion Version Identity Repair

on:
  push:
    branches:
      - fix/source-promotion-version-identity-1531

permissions:
  contents: write

concurrency:
  group: source-promotion-version-identity-1531
  cancel-in-progress: false

jobs:
  repair:
    name: patch and prove verifier contract
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-source-promotion-version-identity

      - name: Apply bounded verifier repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_source_promotion_version_identity.py
          test ! -e .github/scripts/patch_source_promotion_version_identity.py
          test ! -e .github/workflows/source-promotion-version-identity-repair.yml

      - name: Format and focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p xtask source_promotion -- --nocapture
          cargo clippy -p xtask --all-targets -- -D warnings
          git diff --check

      - name: Repository policy proof
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask check-spec-format
          cargo xtask check-traceability
          cargo xtask check-doc-index
          cargo xtask check-doc-artifacts
          cargo xtask check-file-policy

      - name: Commit exact repair candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/source-promotion-version-identity-1531"
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(promotion): verify staged version identity"
          git push origin HEAD:fix/source-promotion-version-identity-1531
