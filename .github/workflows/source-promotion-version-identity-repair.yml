name: Source Promotion Version Identity Repair

on:
  push:
    branches:
      - fix/source-promotion-version-identity-1531

permissions:
  contents: write

concurrency:
  group: source-promotion-version-identity-1531
  cancel-in-progress: false

jobs:
  repair:
    name: patch and prove verifier contract
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-source-promotion-version-identity

      - name: Apply bounded verifier repair
        env:
          PATCH_B64:   i     m cm9vdCwgJls 