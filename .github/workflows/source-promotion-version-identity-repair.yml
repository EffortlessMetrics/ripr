name: Source Promotion Version Identity Repair

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: source-promotion-version-identity-1531
  cancel-in-progress: false

jobs:
  repair:
    name: patch and prove verifier contract
    if: github.head_ref == 'fix/source-promotion-version-identity-1531'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/source-promotion-version-identity-1531
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-source-promotion-version-identity

      - name: Repair patch harness defects found by first run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/patch_source_promotion_version_identity.py')
          text = script.read_text(encoding='utf-8')
          anchor = 'text = text.replace("METADATA_SURFACES", "RELEASE_METADATA_SURFACES")\n'
          replacement = (
              anchor
              + 'text = text.replace("RELEASE_RELEASE_METADATA_SURFACES", "RELEASE_METADATA_SURFACES")\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one constant-renaming anchor, found {text.count(anchor)}')
          script.write_text(text.replace(anchor, replacement), encoding='utf-8')

          manifest = Path('xtask/Cargo.toml')
          manifest_text = manifest.read_text(encoding='utf-8')
          dependency_anchor = 'serde_json = "1"\n'
          if 'toml = "0.9"\n' not in manifest_text:
              if manifest_text.count(dependency_anchor) != 1:
                  raise SystemExit('xtask dependency insertion anchor changed')
              manifest_text = manifest_text.replace(
                  dependency_anchor,
                  dependency_anchor + 'toml = "0.9"\n',
              )
              manifest.write_text(manifest_text, encoding='utf-8')
          PY

      - name: Apply bounded verifier repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_source_promotion_version_identity.py
          test ! -e .github/scripts/patch_source_promotion_version_identity.py
          test ! -e .github/workflows/source-promotion-version-identity-repair.yml

      - name: Format and focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p xtask source_promotion -- --nocapture
          cargo clippy -p xtask --all-targets -- -D warnings
          git diff --check

      - name: Repository policy proof
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask check-spec-format
          cargo xtask check-traceability
          cargo xtask check-doc-index
          cargo xtask check-doc-artifacts
          cargo xtask check-file-policy

      - name: Commit exact repair candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/source-promotion-version-identity-1531"
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(promotion): verify staged version identity"
          git push origin HEAD:fix/source-promotion-version-identity-1531
