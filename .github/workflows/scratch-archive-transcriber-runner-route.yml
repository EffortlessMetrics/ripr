name: Scratch archive-transcriber proof tool ferry

on:
  push:
    branches:
      - scratch/archive-transcriber-runner-route-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify exact public proof tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-tools/downloads proof-tools/bin
          cd proof-tools/downloads
          curl --proto '=https' --tlsv1.2 -LsSfO \
            https://releases.astral.sh/github/ruff/releases/download/0.16.4/ruff-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -LsSfO \
            https://releases.astral.sh/github/ruff/releases/download/0.16.4/ruff-x86_64-unknown-linux-gnu.tar.gz.sha256
          curl --proto '=https' --tlsv1.2 -LsSfO \
            https://releases.astral.sh/github/ty/releases/download/0.0.74/ty-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -LsSfO \
            https://releases.astral.sh/github/ty/releases/download/0.0.74/ty-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum --check ruff-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum --check ty-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf ruff-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf ty-x86_64-unknown-linux-gnu.tar.gz
          install -m 0755 ruff-x86_64-unknown-linux-gnu/ruff ../bin/ruff
          install -m 0755 ty-x86_64-unknown-linux-gnu/ty ../bin/ty
          ../bin/ruff --version
          ../bin/ty --version
          cd ../..
          sha256sum proof-tools/bin/ruff proof-tools/bin/ty > proof-tools/binaries.sha256

      - name: Upload exact proof tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archive-transcriber-proof-tools
          path: |
            proof-tools/bin/
            proof-tools/binaries.sha256
            proof-tools/downloads/*.sha256
          retention-days: 1
