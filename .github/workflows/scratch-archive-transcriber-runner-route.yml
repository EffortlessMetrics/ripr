name: Scratch archive-transcriber runner route

on:
  push:
    branches:
      - scratch/archive-transcriber-runner-route-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Query aggregate organization runner capacity
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate 'orgs/EffortlessMetrics/actions/runners?per_page=100' > runners-pages.json
          jq -s '
            [.[].runners[]?] as $runners
            | def has($runner; $label):
                [$runner.labels[].name | ascii_downcase] | index($label) != null;
              def count($predicate): [$runners[] | select($predicate)] | length;
              def row($label): {
                label: $label,
                total: count(has(.; $label)),
                online: count(.status == "online" and has(.; $label)),
                idle: count(.status == "online" and (.busy | not) and has(.; $label))
              };
              {
                schema: "em-ci-runner-capacity.v1",
                observed_at: (now | todateiso8601),
                total: ($runners | length),
                online: count(.status == "online"),
                idle: count(.status == "online" and (.busy | not)),
                capabilities: [
                  row("ci-control"),
                  row("python-light"),
                  row("python-standard"),
                  row("python-heavy"),
                  row("python-large"),
                  row("cx43"),
                  row("cpx42"),
                  row("cx53"),
                  row("linux"),
                  row("macos"),
                  row("windows")
                ]
              }
          ' runners-pages.json > runner-summary.json
          cat runner-summary.json
          {
            echo '## Aggregate EM CI runner capacity'
            echo
            echo '| capability | total | online | idle |'
            echo '|---|---:|---:|---:|'
            jq -r '.capabilities[] | "| `\(.label)` | \(.total) | \(.online) | \(.idle) |"' runner-summary.json
            echo
            jq -r '"- fleet: `\(.total)` total / `\(.online)` online / `\(.idle)` idle"' runner-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate route receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archive-transcriber-runner-route
          path: runner-summary.json
          retention-days: 1
