name: One-use #1605 fixture-contract repair

on:
  push:
    branches:
      - feat/source-promotion-resolved-tree-validator-1574

permissions:
  contents: write

concurrency:
  group: one-use-1605-fixture-contract
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout live PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Verify bounded transport state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3e26d62d8d34452a147f5d464443233185cb2104 HEAD
          test "$(git branch --show-current)" = feat/source-promotion-resolved-tree-validator-1574
          unexpected="$(git diff --name-only 3e26d62d8d34452a147f5d464443233185cb2104...HEAD | grep -Ev '^(.github/workflows/one-use-1605-fixture-contract.yml|tools/one_use_1605_fixture_contract.py)$' || true)"
          test -z "$unexpected" || { printf 'unexpected pre-repair paths:\n%s\n' "$unexpected"; exit 1; }

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Apply dedicated receipt-corpus contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/one_use_1605_fixture_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    let mut observed = fs::read_dir(&expected_dir)',
              '    let observed = fs::read_dir(&expected_dir)',
              1,
          ).replace('    observed.clear();\n\n', '', 1)
          old = '''        write(&root.join("expected/validated.json"), "{\\n");
        write(&root.join("expected/validated.md"), "invalid\\n");
        write(
            &root.join("expected/rejected.json"),
            r#"{\"schema\":\"wrong\",\"status\":\"validated\"}"#,
        );'''
          new = '''        write(
            &root.join("expected/validated.json"),
            r#"{\"schema\":\"wrong\",\"status\":\"rejected\"}"#,
        );
        write(&root.join("expected/validated.md"), "invalid\\n");
        write(&root.join("expected/rejected.json"), "{\\n");'''
          if text.count(old) != 1:
              raise SystemExit('test fixture fixup marker drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/one_use_1605_fixture_contract.py
          cargo fmt --all

      - name: Prove focused and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check -p xtask --locked
          cargo test -p xtask fixture_contract --locked -- --nocapture
          cargo test -p xtask source_promotion_validate_resolved_tree --locked -- --nocapture
          cargo xtask check-fixture-contracts
          cargo xtask check-spec-format
          cargo xtask check-traceability
          cargo xtask check-pr
          git diff --check

      - name: Remove one-use transport and publish durable commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-use-1605-fixture-contract.yml
          rm tools/one_use_1605_fixture_contract.py
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- \
            xtask/src/main.rs \
            xtask/src/reports/mod.rs \
            xtask/src/reports/source_promotion_validate_resolved_tree/io.rs \
            fixtures/source_promotion_resolved_tree/SPEC.md \
            .github/workflows/one-use-1605-fixture-contract.yml \
            tools/one_use_1605_fixture_contract.py
          python3 - <<'PY'
          import subprocess
          allowed = {
              'xtask/src/main.rs',
              'xtask/src/reports/mod.rs',
              'xtask/src/reports/source_promotion_validate_resolved_tree/io.rs',
              'fixtures/source_promotion_resolved_tree/SPEC.md',
              '.github/workflows/one-use-1605-fixture-contract.yml',
              'tools/one_use_1605_fixture_contract.py',
          }
          observed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = observed - allowed
          missing = {
              'xtask/src/main.rs',
              'xtask/src/reports/mod.rs',
              'xtask/src/reports/source_promotion_validate_resolved_tree/io.rs',
              'fixtures/source_promotion_resolved_tree/SPEC.md',
              '.github/workflows/one-use-1605-fixture-contract.yml',
              'tools/one_use_1605_fixture_contract.py',
          } - observed
          if unexpected or missing:
              raise SystemExit(f'unexpected={sorted(unexpected)} missing={sorted(missing)}')
          PY
          git commit -m 'fix(fixtures): govern resolved-tree receipt snapshots'
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
