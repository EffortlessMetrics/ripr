name: Build exact 0.11.0 J3

on:
  push:
    branches:
      - control/0.11.0-j3-builder

permissions:
  contents: write

concurrency:
  group: build-exact-0.11.0-j3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the J3 control builder exactly
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Build, verify, and publish exact J3 and immutable control inputs
        shell: bash
        run: bash tools/release-control/j3/build.sh

      - name: Upload the exact J3 construction packet
        uses: actions/upload-artifact@v4
        with:
          name: ripr-0.11.0-j3-final
          path: target/j3-final
          if-no-files-found: error
          retention-days: 30
