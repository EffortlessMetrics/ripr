name: Construct exact #1557 integrated J2

on:
  push:
    branches:
      - control/0.11.0-j2-catalog-builder

permissions:
  contents: write

concurrency:
  group: construct-1557-integrated-j2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the ancestry-separated control builder
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Construct, verify, and publish exact J2 and immutable sidecars
        shell: bash
        env:
          SOURCE_PARENT: a072b7efe80f1a32d7b5ba7342559a114edeb12e
          SWARM_PARENT: 83217e97ec6847db41d757f57279a8b1ca433fe6
          INVALID_J: 87cc06cfb7f686248a35f93871d8794bdbe30ba1
          INVALID_TREE: c53a89dcace27f54fdb78df4d16037959dfa2e2a
          OLD_BLOB: 9891a2a8d1f18797affd55cc4ba15ccba5736fd0
          NEW_BLOB: 800ff76ccdf1cf76b6496b2208fbfca8aed0c2d5
          NEW_FILE_SHA256: 7a51ce6cac1be971e2cab978c977f2570bd73ebcbe6434c65a14e6ee8a961776
          CONTROL_BASE: b39644977b60af2ee18c2a4c9d3caf28c739ccd0
          J2_BRANCH: promote/0.11.0-swarm-w7-a072b7-j2-catalog
          CONTROL_BRANCH: release/0.11.0-promotion-control-a072b7-w7-j2
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git fetch --no-tags origin \
            "$SOURCE_PARENT" \
            "$SWARM_PARENT" \
            "$INVALID_J" \
            "$CONTROL_BASE"

          repo="$PWD"
          j2_dir="$RUNNER_TEMP/ripr-j2-tree"
          control_dir="$RUNNER_TEMP/ripr-j2-control"
          source_dir="$RUNNER_TEMP/ripr-j2-trusted-source"
          rm -rf "$j2_dir" "$control_dir" "$source_dir"
          git worktree add --detach "$j2_dir" "$INVALID_J"

          test "$(git -C "$j2_dir" rev-parse HEAD)" = "$INVALID_J"
          test "$(git -C "$j2_dir" rev-parse HEAD^{tree})" = "$INVALID_TREE"
          test "$(git -C "$j2_dir" rev-parse HEAD:xtask/src/command.rs)" = "$OLD_BLOB"

          python - "$j2_dir/xtask/src/command.rs" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          targets = [
              "precommit",
              "check-agent-skills",
              "check-workspace-shape",
              "check-architecture",
              "check-public-api",
              "check-doc-artifacts",
              "check-readme-state",
              "markdown-links",
              "check-pr-shape",
              "check-lint-policy",
              "check-proof-packs",
              "check-release-targets",
          ]
          block_re = re.compile(r"(?ms)^        command_entry\(\n(?P<body>.*?)^        \),\n")
          blocks = list(block_re.finditer(text))
          replacements = []
          for target in targets:
              candidates = []
              for match in blocks:
                  body = match.group("body")
                  first = re.match(r'^            "([^"]+)",\n', body)
                  if first is None:
                      continue
                  specification = first.group(1)
                  if specification == target or specification.startswith(target + " ["):
                      candidates.append((match, body, specification))
              if len(candidates) != 1:
                  raise SystemExit(f"expected one catalog entry for {target!r}, found {len(candidates)}")
              match, body, specification = candidates[0]
              booleans = list(re.finditer(r"(?m)^            (true|false),$", body))
              if len(booleans) < 2 or booleans[1].group(1) != "false":
                  raise SystemExit(f"catalog entry {specification!r} does not have ci_enforced=false")
              flag = booleans[1]
              repaired = body[:flag.start(1)] + "true" + body[flag.end(1):]
              replacements.append((match.start("body"), match.end("body"), repaired))
          if len(replacements) != 12 or len({start for start, _, _ in replacements}) != 12:
              raise SystemExit("repair did not resolve to twelve distinct catalog entries")
          for start, end, repaired in sorted(replacements, reverse=True):
              text = text[:start] + repaired + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          test "$(git -C "$j2_dir" hash-object xtask/src/command.rs)" = "$NEW_BLOB"
          test "$(sha256sum "$j2_dir/xtask/src/command.rs" | awk '{print $1}')" = "$NEW_FILE_SHA256"
          test "$(git -C "$j2_dir" diff --numstat -- xtask/src/command.rs)" = $'12\t12\txtask/src/command.rs'
          git -C "$j2_dir" diff --check
          git -C "$j2_dir" add xtask/src/command.rs
          new_tree=$(git -C "$j2_dir" write-tree)
          changed_paths=$(git -C "$j2_dir" diff-tree --no-commit-id --name-only -r "$INVALID_TREE" "$new_tree")
          test "$changed_paths" = "xtask/src/command.rs"

          export GIT_AUTHOR_NAME=EffortlessSteven
          export GIT_AUTHOR_EMAIL=git@effortlesssteven.com
          export GIT_COMMITTER_NAME=EffortlessSteven
          export GIT_COMMITTER_EMAIL=git@effortlesssteven.com
          export GIT_AUTHOR_DATE=2026-08-16T00:10:00Z
          export GIT_COMMITTER_DATE=2026-08-16T00:10:00Z
          j2=$(printf '%s\n' \
            'promote: integrate exact catalog authority repair for 0.11.0' \
            '' \
            'Preserve the frozen source/W7 parent pair and replace only' \
            'xtask/src/command.rs with the reviewed #1557 repair blob.' \
            | git -C "$j2_dir" commit-tree "$new_tree" -p "$SOURCE_PARENT" -p "$SWARM_PARENT")

          test "$(git -C "$j2_dir" rev-parse "$j2^{tree}")" = "$new_tree"
          mapfile -t parents < <(git -C "$j2_dir" show -s --format='%P' "$j2" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$SOURCE_PARENT"
          test "${parents[1]}" = "$SWARM_PARENT"

          git worktree add --detach "$control_dir" "$CONTROL_BASE"
          preflight="$control_dir/docs/release/source-promotion/preflight.json"
          resolution="$control_dir/docs/release/source-promotion/resolution-manifest.json"
          inputs="$control_dir/docs/release/source-promotion/contract-inputs.json"

          python - "$resolution" "$INVALID_TREE" "$new_tree" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old_tree, new_tree = sys.argv[2:]
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("reviewed_join_tree") != old_tree:
              raise SystemExit("resolution manifest is not bound to the rejected reviewed tree")
          data["reviewed_join_tree"] = new_tree
          repaired_rows = 0
          for row in data.get("dispositions", []):
              if row.get("evidence") == f"JOIN_TREE {old_tree}":
                  row["evidence"] = f"JOIN_TREE {new_tree}"
              if row.get("kind") == "source_survivor" and row.get("key") == "xtask/src/command.rs":
                  repaired_rows += 1
                  row["disposition"] = "integrated"
                  row["rationale"] = (
                      "Integrated-tree correction required because source main has no ci_enforced field; "
                      "the W7 command catalog must agree with blocking joined workflows."
                  )
                  row["evidence"] = (
                      f"JOIN_TREE {new_tree}; #1557 repair artifact 9254525510; "
                      "old blob 9891a2a8d1f18797affd55cc4ba15ccba5736fd0; "
                      "new blob 800ff76ccdf1cf76b6496b2208fbfca8aed0c2d5"
                  )
          if repaired_rows != 1:
              raise SystemExit(f"expected one xtask/src/command.rs source-survivor row, found {repaired_rows}")
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          preflight_sha=$(sha256sum "$preflight" | awk '{print $1}')
          resolution_sha=$(sha256sum "$resolution" | awk '{print $1}')
          python - "$inputs" "$j2" "$preflight_sha" "$resolution_sha" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          join_head, preflight_sha, resolution_sha = sys.argv[2:]
          data = json.loads(path.read_text(encoding="utf-8"))
          data["join_head"] = join_head
          data["preflight_sha256"] = preflight_sha
          data["resolution_manifest_sha256"] = resolution_sha
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          jq -e . "$preflight" >/dev/null
          jq -e . "$resolution" >/dev/null
          jq -e . "$inputs" >/dev/null
          test "$(jq -r .source_main "$inputs")" = "$SOURCE_PARENT"
          test "$(jq -r .join_head "$inputs")" = "$j2"
          test "$(jq -r .reviewed_join_tree "$resolution")" = "$new_tree"
          test "$(jq -r '[.dispositions[] | select(.kind == "source_survivor" and .key == "xtask/src/command.rs" and .disposition == "integrated")] | length' "$resolution")" = 1

          git worktree add --detach "$source_dir" "$SOURCE_PARENT"
          trusted_target="$RUNNER_TEMP/ripr-j2-trusted-target"
          CARGO_TARGET_DIR="$trusted_target" cargo build --locked --manifest-path "$source_dir/Cargo.toml" -p xtask --bin xtask
          verifier="$trusted_target/debug/xtask"
          "$verifier" source-promotion verify \
            --preflight "$preflight" \
            --resolution-manifest "$resolution" \
            --join-head "$j2" \
            --source-main "$SOURCE_PARENT" \
            --out "$RUNNER_TEMP/source-promotion-j2"
          jq -e '.status == "verified" and .join_head == $join and .tree == $tree' \
            --arg join "$j2" --arg tree "$new_tree" \
            "$RUNNER_TEMP/source-promotion-j2/source-promotion-verification.json" >/dev/null

          git -C "$control_dir" add docs/release/source-promotion
          control_tree=$(git -C "$control_dir" write-tree)
          export GIT_AUTHOR_DATE=2026-08-16T00:11:00Z
          export GIT_COMMITTER_DATE=2026-08-16T00:11:00Z
          control_commit=$(printf '%s\n' \
            'release(control): bind exact #1557 integrated J2 inputs' \
            '' \
            'Update only the reviewed tree, xtask command disposition, exact J2,' \
            'and sidecar digests for the unchanged frozen parent pair.' \
            | git -C "$control_dir" commit-tree "$control_tree" -p "$CONTROL_BASE")

          test "$(git -C "$control_dir" rev-parse "$control_commit^{tree}")" = "$control_tree"
          test "$(git -C "$control_dir" merge-base "$control_commit" "$j2" || true)" != "$control_commit"
          test "$(git -C "$control_dir" merge-base "$control_commit" "$j2" || true)" != "$j2"

          git push origin "$j2:refs/heads/$J2_BRANCH"
          git push origin "$control_commit:refs/heads/$CONTROL_BRANCH"

          mkdir -p "$repo/target/j2-receipt"
          cp "$inputs" "$repo/target/j2-receipt/contract-inputs.json"
          cp "$preflight" "$repo/target/j2-receipt/preflight.json"
          cp "$resolution" "$repo/target/j2-receipt/resolution-manifest.json"
          cp "$RUNNER_TEMP/source-promotion-j2/source-promotion-verification.json" "$repo/target/j2-receipt/verification.json"
          jq -n \
            --arg schema ripr.integrated_j2_builder.v1 \
            --arg source_parent "$SOURCE_PARENT" \
            --arg swarm_parent "$SWARM_PARENT" \
            --arg invalid_j "$INVALID_J" \
            --arg invalid_tree "$INVALID_TREE" \
            --arg old_blob "$OLD_BLOB" \
            --arg new_blob "$NEW_BLOB" \
            --arg new_file_sha256 "$NEW_FILE_SHA256" \
            --arg j2 "$j2" \
            --arg tree "$new_tree" \
            --arg control_base "$CONTROL_BASE" \
            --arg control_commit "$control_commit" \
            --arg preflight_sha256 "$preflight_sha" \
            --arg resolution_sha256 "$resolution_sha" \
            --arg j2_branch "$J2_BRANCH" \
            --arg control_branch "$CONTROL_BRANCH" \
            '{schema:$schema,source_parent:$source_parent,swarm_parent:$swarm_parent,rejected:{join:$invalid_j,tree:$invalid_tree},repair:{path:"xtask/src/command.rs",old_blob:$old_blob,new_blob:$new_blob,file_sha256:$new_file_sha256,line_delta:{added:12,deleted:12}},j2:{commit:$j2,tree:$tree,branch:$j2_branch,parents:[$source_parent,$swarm_parent]},control:{base:$control_base,commit:$control_commit,branch:$control_branch,preflight_sha256:$preflight_sha256,resolution_sha256:$resolution_sha256},verification:"verified",non_claims:["no merge","no version change","no tag","no publication","no signing","no marketplace mutation","no secret use","no back-sync"]}' \
            > "$repo/target/j2-receipt/receipt.json"

          {
            echo "J2=$j2"
            echo "J2_TREE=$new_tree"
            echo "CONTROL_COMMIT=$control_commit"
            echo "PREFLIGHT_SHA256=$preflight_sha"
            echo "RESOLUTION_SHA256=$resolution_sha"
          } | tee "$repo/target/j2-receipt/identities.env"

      - name: Upload the exact J2 construction and verifier packet
        uses: actions/upload-artifact@v4
        with:
          name: ripr-1557-integrated-j2
          path: target/j2-receipt
          if-no-files-found: error
          retention-days: 30
