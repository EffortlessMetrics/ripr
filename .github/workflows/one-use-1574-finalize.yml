fn run_git(root: &Path, args: &[&str]) -> Result<(), String> {
    let output = run_command(root, Path::new("git"), args, "Git fixture command")?;
    if output.status.success() {
        return Ok(());
    }
    Err(format!(
        "Git fixture command failed: {}",
        combined_output(&output)
    ))
}

