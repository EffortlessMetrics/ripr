    #[test]
    fn git_object_view_ignores_replacement_refs() -> Result<(), String> {
        let root = create_exclusive_temp_dir("ripr-no-replace-test", "object-view")?;
        let result = (|| {
            git(&root, &["init", "--quiet"], &[])?;
            fs::write(root.join("value.txt"), "original\\n")
                .map_err(|error| format!("write original fixture: {error}"))?;
            git(&root, &["add", "value.txt"], &[])?;
            git(
                &root,
                &["commit", "--quiet", "-m", "original"],
                &[
                    ("GIT_AUTHOR_NAME", "ripr test"),
                    ("GIT_AUTHOR_EMAIL", "ripr-test@invalid"),
                    ("GIT_COMMITTER_NAME", "ripr test"),
                    ("GIT_COMMITTER_EMAIL", "ripr-test@invalid"),
                ],
            )?;
            let original = git(&root, &["rev-parse", "HEAD"], &[])?;
            fs::write(root.join("value.txt"), "replacement\\n")
                .map_err(|error| format!("write replacement fixture: {error}"))?;
            git(&root, &["add", "value.txt"], &[])?;
            git(
                &root,
                &["commit", "--quiet", "-m", "replacement"],
                &[
                    ("GIT_AUTHOR_NAME", "ripr test"),
                    ("GIT_AUTHOR_EMAIL", "ripr-test@invalid"),
                    ("GIT_COMMITTER_NAME", "ripr test"),
                    ("GIT_COMMITTER_EMAIL", "ripr-test@invalid"),
                ],
            )?;
            let replacement = git(&root, &["rev-parse", "HEAD"], &[])?;
            git(
                &root,
                &["replace", original.trim(), replacement.trim()],
                &[],
            )?;
            let observed = git(
                &root,
                &["show", &format!("{}:value.txt", original.trim())],
                &[],
            )?;
            if observed != "original\\n" {
                return Err(format!(
                    "replacement ref changed the hardened Git object view: {observed:?}"
                ));
            }
            Ok(())
        })();
        let cleanup = fs::remove_dir_all(&root)
            .map_err(|error| format!("remove replacement-ref fixture: {error}"));
        result?;
        cleanup
    }

