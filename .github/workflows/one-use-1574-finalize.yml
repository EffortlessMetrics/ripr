name: One-use #1574 exact patch

on:
  push:
    branches:
      - feat/source-promotion-resolved-tree-validator-1574

permissions: {}

concurrency:
  group: one-use-1574-exact-patch
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'chore(control): apply #1574 review and CI fixes'
    permissions:
      contents: write # Required only to publish this exact bounded branch patch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact live candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Install governed formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact reviewed transformations
        shell: bash
        env:
          EXPECTED_PARENT: ca29640fb30749357931cf405e3f3004a84161cb
