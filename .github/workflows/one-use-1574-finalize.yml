          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git show -s --format=%s HEAD)" = 'chore(control): apply #1574 review and CI fixes'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/one-use-1574-finalize.yml'

