name: Source Swarm Sync Runner

on:
  push:
    branches:
      - agent/source-swarm-sync-runner-2026-07-21

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-swarm-sync-runner-2026-07-21
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_PARENT: ec7dc6beaec8ad2efca4abd502f9253cdb4f939c
      SWARM_CANDIDATE: b026c4841d31df2b31c880c03684c905bf9f1f9c
    steps:
      - name: Check out runner branch with full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch frozen source and swarm commits
        shell: bash
        run: |
          set -euo pipefail
          git remote add swarm https://github.com/EffortlessMetrics/ripr-swarm.git
          git fetch origin "$SOURCE_PARENT"
          git fetch swarm "$SWARM_CANDIDATE"
          git cat-file -e "$SOURCE_PARENT^{commit}"
          git cat-file -e "$SWARM_CANDIDATE^{commit}"
          printf 'source_parent=%s\n' "$SOURCE_PARENT"
          printf 'swarm_candidate=%s\n' "$SWARM_CANDIDATE"
          printf 'merge_base=%s\n' "$(git merge-base "$SOURCE_PARENT" "$SWARM_CANDIDATE")"
          printf 'swarm_commits_since_base=%s\n' "$(git rev-list --count "$(git merge-base "$SOURCE_PARENT" "$SWARM_CANDIDATE")..$SWARM_CANDIDATE")"

      - name: Run non-committing merge preflight
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "Effortless Metrics Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --detach "$SOURCE_PARENT"
          set +e
          git merge --no-ff --no-commit "$SWARM_CANDIDATE"
          merge_status=$?
          set -e
          printf 'merge_status=%s\n' "$merge_status"
          echo '--- unresolved paths ---'
          git diff --name-only --diff-filter=U || true
          echo '--- working tree summary ---'
          git status --short
          echo '--- unmerged index entries ---'
          git ls-files -u || true
          git merge --abort || true
          exit 0
