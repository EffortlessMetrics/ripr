name: Source Swarm Sync Runner

on:
  push:
    branches:
      - agent/source-swarm-sync-runner-2026-07-21

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-swarm-sync-runner-2026-07-21
  cancel-in-progress: true

jobs:
  resolve-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[sync-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_PARENT: ec7dc6beaec8ad2efca4abd502f9253cdb4f939c
      SWARM_CANDIDATE: b026c4841d31df2b31c880c03684c905bf9f1f9c
      RUNNER_BRANCH: agent/source-swarm-sync-runner-2026-07-21
    steps:
      - name: Check out runner branch with full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve the join and run targeted proof
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "Effortless Metrics Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add swarm https://github.com/EffortlessMetrics/ripr-swarm.git
          git fetch origin "$SOURCE_PARENT"
          git fetch swarm "$SWARM_CANDIDATE"
          merge_base="$(git merge-base "$SOURCE_PARENT" "$SWARM_CANDIDATE")"
          swarm_count="$(git rev-list --count "$merge_base..$SWARM_CANDIDATE")"
          git switch --detach "$SOURCE_PARENT"
          set +e
          git merge --no-ff --no-commit "$SWARM_CANDIDATE"
          merge_status=$?
          set -e

          unresolved_before="$(git diff --name-only --diff-filter=U | sort)"
          expected_unresolved="$(cat <<'EOF'
          CHANGELOG.md
          crates/ripr/src/analysis/probes/diff.rs
          crates/ripr/src/output/review_comments.rs
          docs/specs/README.md
          editors/vscode/package-lock.json
          editors/vscode/package.json
          fixtures/boundary_gap/expected/pr-guidance/configured-off/comments.json
          policy/process_allowlist.txt
          EOF
          )"
          expected_unresolved="$(printf '%s\n' "$expected_unresolved" | sed 's/^          //' | sed '/^$/d' | sort)"
          conflict_set_status=0
          if [ "$unresolved_before" != "$expected_unresolved" ]; then
            conflict_set_status=1
          fi

          git checkout --theirs -- \
            CHANGELOG.md \
            crates/ripr/src/analysis/probes/diff.rs \
            crates/ripr/src/output/review_comments.rs \
            docs/specs/README.md \
            editors/vscode/package-lock.json \
            editors/vscode/package.json \
            fixtures/boundary_gap/expected/pr-guidance/configured-off/comments.json \
            policy/process_allowlist.txt
          git checkout "$SOURCE_PARENT" -- .github/settings.yml

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          # Keep current swarm probe construction and insert the bounded adapter
          # authority before parser/lexical fallback classification.
          path = "crates/ripr/src/analysis/probes/diff.rs"
          text = read(path)
          import_line = "use super::subprocess::bounded_subprocess_family;\n"
          if import_line not in text:
              text = text.replace(
                  "use super::lexical::classify_changed_line;\n",
                  "use super::lexical::classify_changed_line;\n" + import_line,
                  1,
              )
          needle = """        if changed_line_owned_by_test(index, &changed.path, added.new_side_line) {\n            continue;\n        }\n        let parser_shapes =\n"""
          replacement = """        if changed_line_owned_by_test(index, &changed.path, added.new_side_line) {\n            continue;\n        }\n        if let Some(family) =\n            bounded_subprocess_family(index, &changed.path, added.new_side_line, text)\n        {\n            probes.push(build_probe(\n                &build_context,\n                added,\n                family,\n                nearby_removed_line(added.new_side_line, text, changed),\n                Some(text.to_string()),\n            ));\n            continue;\n        }\n        let parser_shapes =\n"""
          if needle not in text:
              raise SystemExit("bounded subprocess insertion point not found")
          text = text.replace(needle, replacement, 1)
          write(path, text)

          mod_path = "crates/ripr/src/analysis/probes/mod.rs"
          text = read(mod_path)
          if "mod subprocess;\n" not in text:
              text = text.replace("mod repo;\n", "mod repo;\nmod subprocess;\n", 1)
          write(mod_path, text)

          # Allocate a collision-free spec identity from the merged registry.
          old_spec = Path("docs/specs/RIPR-SPEC-0112-bounded-subprocess-adapter-boundary.md")
          ids = []
          for candidate in Path("docs/specs").glob("RIPR-SPEC-*.md"):
              if candidate == old_spec:
                  continue
              match = re.match(r"RIPR-SPEC-(\d{4})-", candidate.name)
              if match:
                  ids.append(int(match.group(1)))
          new_num = max(ids) + 1
          new_id = f"RIPR-SPEC-{new_num:04d}"
          new_spec = old_spec.with_name(
              f"{new_id}-bounded-subprocess-adapter-boundary.md"
          )
          old_spec.rename(new_spec)
          text = read(str(new_spec)).replace("RIPR-SPEC-0112", new_id)
          write(str(new_spec), text)
          Path("/tmp/new-spec-id.txt").write_text(new_id, encoding="utf-8")

          trace_path = ".ripr/traceability.toml"
          text = read(trace_path)
          text = text.replace(
              'id = "RIPR-SPEC-0112"\nname = "bounded subprocess adapter boundary"',
              f'id = "{new_id}"\nname = "bounded subprocess adapter boundary"',
              1,
          )
          text = text.replace(
              "RIPR-SPEC-0112-bounded-subprocess-adapter-boundary.md",
              f"{new_id}-bounded-subprocess-adapter-boundary.md",
          )
          write(trace_path, text)

          # Preserve the complete swarm spec registry and append the source-only
          # bounded subprocess contract under its newly allocated identity.
          specs_index = "docs/specs/README.md"
          text = read(specs_index).rstrip() + "\n"
          row = (
              f"| [{new_id}]({new_id}-bounded-subprocess-adapter-boundary.md) | accepted | "
              "Bounded literal allowlisted subprocess adapters with argument, timeout, "
              "captured-output, and cleanup evidence use the existing side_effect probe "
              "family; dynamic, shell, and unbounded commands retain strict exposure "
              "behavior; closes #1454 |\n"
          )
          if row not in text:
              text += row
          write(specs_index, text)

          process_path = "policy/process_allowlist.txt"
          text = read(process_path)
          process_row = (
              "crates/ripr/src/analysis/probes/subprocess.rs|Command::new|7|"
              f"analysis/probes|{new_id}: bounded subprocess adapter recognizer inspects "
              "source text and fixture bodies for one literal allowlisted command; it does "
              "not execute a subprocess or broaden the runtime command surface.\n"
          )
          if process_row not in text:
              anchor = "crates/ripr/src/analysis/diff/load.rs|use std::process::Command"
              position = text.find(anchor)
              if position < 0:
                  raise SystemExit("process allowlist insertion anchor not found")
              text = text[:position] + process_row + text[position:]
          write(process_path, text)

          network_path = "policy/network_allowlist.txt"
          text = read(network_path)
          text = text.replace(
              "crates/ripr/src/analysis/probes/subprocess.rs|curl|6|analysis/probes|RIPR-SPEC-0112:",
              f"crates/ripr/src/analysis/probes/subprocess.rs|curl|6|analysis/probes|{new_id}:",
          )
          network_row = (
              "crates/ripr/src/analysis/probes/subprocess.rs|curl|6|analysis/probes|"
              f"{new_id}: bounded subprocess adapter recognizer and fixture corpus inspect "
              "an allowlisted literal command; this source does not execute networking or "
              "add a network client.\n"
          )
          if network_row not in text:
              anchor = "crates/ripr/src/output/typescript_packet_projection.rs|curl"
              position = text.find(anchor)
              if position < 0:
                  raise SystemExit("network allowlist insertion anchor not found")
              text = text[:position] + network_row + text[position:]
          write(network_path, text)

          # Preserve swarm's accumulated Unreleased and historical corrections,
          # then insert source's staged 0.10.1 section.
          changelog_path = "CHANGELOG.md"
          text = read(changelog_path)
          section = f"""## 0.10.1 - Bounded subprocess adapter analysis\n\nRelease date: staged (unreleased).\n\nRIPR 0.10.1 adds a narrow, deny-by-default boundary for recognizing bounded\nallowlisted subprocess adapters as observable side effects during static\nanalysis. The boundary preserves strict exposure behavior for dynamic, shell,\nunbounded, or otherwise unsupported subprocess shapes.\n\n### Fixed\n\n- **Bounded subprocess adapter classification** ({new_id}, #1454):\n  receipt-producing adapters with a literal allowlisted command, arguments,\n  timeout, captured output, cleanup, and explicit error handling can use the\n  existing `side_effect` probe family. Dynamic command names and shell-shaped\n  dispatch remain unclassified and continue through the conservative exposure\n  path.\n\n### Non-claims\n\n- RIPR remains static mutation-exposure analysis; this release does not execute\n  subprocesses, prove runtime subprocess safety, run mutation testing, or add a\n  network client.\n\n"""
          marker = "## 0.10.0 - Honest-by-construction evidence and downstream gate adoption"
          if section not in text:
              if marker not in text:
                  raise SystemExit("0.10.0 changelog marker not found")
              text = text.replace(marker, section + marker, 1)
          write(changelog_path, text)

          # Keep source release/distribution version authority while retaining
          # the newer swarm dependency graph and product surface.
          cargo_toml = "crates/ripr/Cargo.toml"
          text = read(cargo_toml)
          text, count = re.subn(
              r'(\[package\]\nname = "ripr"\nversion = ")[^"]+("\n)',
              r'\g<1>0.10.1\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("crate version replacement failed")
          write(cargo_toml, text)

          cargo_lock = "Cargo.lock"
          text = read(cargo_lock)
          text, count = re.subn(
              r'(\[\[package\]\]\nname = "ripr"\nversion = ")[^"]+("\n)',
              r'\g<1>0.10.1\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Cargo.lock ripr version replacement failed")
          write(cargo_lock, text)

          package_json = "editors/vscode/package.json"
          text = read(package_json)
          text, count = re.subn(
              r'("version": ")[^"]+("[,])',
              r'\g<1>0.10.1\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("VS Code package version replacement failed")
          write(package_json, text)

          package_lock = "editors/vscode/package-lock.json"
          text = read(package_lock)
          text, count = re.subn(
              r'("version": ")[^"]+("[,])',
              r'\g<1>0.10.1\2',
              text,
              count=2,
          )
          if count != 2:
              raise SystemExit("VS Code lock versions replacement failed")
          write(package_lock, text)
          PY

          git add -A
          unresolved_after="$(git diff --name-only --diff-filter=U | sort)"

          report=/tmp/source-swarm-resolution-report.txt
          {
            printf 'source_parent=%s\n' "$SOURCE_PARENT"
            printf 'swarm_candidate=%s\n' "$SWARM_CANDIDATE"
            printf 'merge_base=%s\n' "$merge_base"
            printf 'swarm_commits_since_base=%s\n' "$swarm_count"
            printf 'merge_status=%s\n' "$merge_status"
            printf 'conflict_set_status=%s\n' "$conflict_set_status"
            printf 'new_spec_id=%s\n' "$(cat /tmp/new-spec-id.txt)"
            echo '--- unresolved before ---'
            printf '%s\n' "$unresolved_before"
            echo '--- unresolved after ---'
            printf '%s\n' "$unresolved_after"
            echo '--- staged diff stat ---'
            git diff --cached --stat
            echo '--- source authority assertions ---'
            grep -n 'allow_merge_commit' .github/settings.yml || true
            grep -n '^version = "0.10.1"' crates/ripr/Cargo.toml || true
            grep -n '"version": "0.10.1"' editors/vscode/package.json | head -1 || true
            grep -n 'bounded subprocess adapter boundary' .ripr/traceability.toml || true
            echo '--- bounded subprocess integration diff ---'
            git diff --cached -- crates/ripr/src/analysis/probes/diff.rs crates/ripr/src/analysis/probes/mod.rs || true
          } > "$report"

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            {
              printf '\n--- check %s status=%s ---\n' "$name" "$status"
              tail -120 "$log"
            } >> "$report"
          }

          run_check no_unmerged bash -lc 'test -z "$(git diff --name-only --diff-filter=U)"'
          run_check diff_check git diff --cached --check
          run_check fmt cargo fmt --all -- --check
          run_check subprocess_tests cargo test -p ripr subprocess --locked
          run_check bounded_probe_test cargo test -p ripr probes_for_file_emits_side_effect_for_bounded_adapter_line --locked
          run_check spec_format cargo xtask check-spec-format
          run_check spec_numbering cargo xtask check-spec-numbering
          run_check traceability cargo xtask check-traceability
          run_check process_policy cargo xtask check-process-policy
          run_check network_policy cargo xtask check-network-policy
          run_check cargo_check cargo check -p ripr --all-targets --all-features --locked

          git merge --abort || true
          git switch "$RUNNER_BRANCH"
          cp "$report" source-swarm-resolution-report.txt
          git add source-swarm-resolution-report.txt
          git commit -m "chore: record source/swarm resolution proof [sync-report]"
          git push origin "HEAD:$RUNNER_BRANCH"
