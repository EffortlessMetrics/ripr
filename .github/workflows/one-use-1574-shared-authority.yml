name: One-use #1574 shared validation authority

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: one-use-1574-shared-authority
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/source-promotion-resolved-tree-validator-1574' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Narrow one-use insertion marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/one_use_1574_shared_authority.py')
          text = path.read_text(encoding='utf-8')
          old = '        text = replace_once(text, known, new_known, "known command")\n'
          new = '''        position = text.find(known)
        if position < 0:
            raise SystemExit("known-command insertion point drifted")
        text = text[:position] + new_known + text[position + len(known):]
'''
          if text.count(old) != 1:
              raise SystemExit('one-use script marker drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply shared-authority transformation
        shell: bash
        run: python scripts/one_use_1574_shared_authority.py

      - name: Format and run focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p xtask --locked
          cargo test -p xtask manifest_rejects_duplicate_rows --locked -- --nocapture
          cargo test -p xtask run::tests --locked -- --nocapture
          cargo xtask check-command-catalog
          git diff --check

      - name: Remove one-use controls and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-use-1574-shared-authority.yml
          rm scripts/one_use_1574_shared_authority.py
          rm -f .github/one-use-1574-trigger.txt
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- \
            xtask/src/run.rs \
            xtask/src/reports/source_promotion_verify.rs \
            xtask/src/command.rs \
            policy/process_allowlist.txt \
            .github/workflows/one-use-1574-shared-authority.yml \
            scripts/one_use_1574_shared_authority.py \
            .github/one-use-1574-trigger.txt
          git commit -m 'refactor(promotion): reuse bounded source validation authorities'
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
