name: One-use #1574 receipt compile repair

on:
  push:
    branches:
      - feat/source-promotion-resolved-tree-validator-1574

permissions:
  contents: write

concurrency:
  group: one-use-1574-receipt-compile
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Repair receipt projection and policy ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('xtask/src/reports/source_promotion_validate_resolved_tree.rs')
          text = path.read_text(encoding='utf-8')

          old = '''fn command_receipt(
    command: &str,
    state: &str,
    exit_code: Option<i32>,
    duration_ms: u64,
    stdout_truncated: bool,
    stderr_truncated: bool,
    failure_reason: Option<&str>,
) -> Value {
    serde_json::json!({
'''
          new = '''fn command_receipt(
    command: &str,
    state: &str,
    exit_code: Option<i32>,
    duration_ms: u64,
    stdout_truncated: bool,
    stderr_truncated: bool,
    failure_reason: Option<&str>,
) -> Value {
    let evidence_index = REQUIRED_COMMANDS
        .iter()
        .position(|candidate| *candidate == command)
        .map_or(1, |index| index + 1);
    serde_json::json!({
'''
          if text.count(old) != 1:
              raise SystemExit('command receipt marker drifted')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"stdout_path": format!("commands/{command}.stdout.log"),',
              '"stdout_path": format!("commands/{evidence_index:02}-{command}.stdout.log"),',
              1,
          )
          text = text.replace(
              '"stderr_path": format!("commands/{command}.stderr.log"),',
              '"stderr_path": format!("commands/{evidence_index:02}-{command}.stderr.log"),',
              1,
          )

          old_find = '.find(|pair| pair[0] == key && !pair[1].trim().is_empty())'
          new_find = '''.find(|pair| {
            pair[0] == key && !pair[1].trim().is_empty() && !pair[1].starts_with("--")
        })'''
          if text.count(old_find) != 1:
              raise SystemExit('value_after marker drifted')
          text = text.replace(old_find, new_find, 1)
          text = text.replace(
              'fn option_value_that_is_another_flag_is_not_echoed_as_a_value()',
              'fn option_value_that_is_another_flag_is_rejected_as_a_value()',
              1,
          )
          text = text.replace(
              'assert_eq!(echo.source_parent.as_deref(), Some("--swarm-parent"));',
              'assert_eq!(echo.source_parent, None);',
              1,
          )

          start = text.index('fn report_value(')
          end = text.index('\nfn write_report(', start)
          segment = text[start:end]
          references = [
              'state.inputs.source_parent',
              'state.inputs.swarm_parent',
              'state.inputs.reviewed_tree',
              'state.inputs.preflight_path',
              'state.inputs.preflight_sha256',
              'state.inputs.resolution_path',
              'state.inputs.resolution_sha256',
              'state.trusted_checker_source_sha',
              'state.trusted_checker_executable_sha256',
              'state.materialized_tree',
              'state.disposable_commit',
              'state.cleanup_failure_reason',
              'state.commands',
              'state.refs_before_sha256',
              'state.refs_after_sha256',
              'state.worktrees_before_sha256',
              'state.worktrees_after_sha256',
              'state.failure_reasons',
          ]
          for expression in references:
              segment = segment.replace(expression, f'&{expression}')
          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding='utf-8')

          policy = Path('policy/process_allowlist.txt')
          lines = policy.read_text(encoding='utf-8').splitlines()
          lines = [
              line for line in lines
              if not line.startswith('xtask/src/reports/source_promotion_validate_resolved_tree.rs|')
          ]
          policy.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Format and prove focused compile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p xtask --locked
          cargo test -p xtask source_promotion_validate_resolved_tree --locked -- --nocapture
          cargo xtask check-process-policy
          cargo xtask check-command-catalog
          git diff --check

      - name: Remove one-use control and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-use-1574-receipt-compile.yml
          rm -f .github/one-use-1574-receipt-trigger.txt
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- \
            xtask/src/reports/source_promotion_validate_resolved_tree.rs \
            policy/process_allowlist.txt \
            .github/workflows/one-use-1574-receipt-compile.yml \
            .github/one-use-1574-receipt-trigger.txt
          git commit -m 'fix(promotion): stabilize resolved-tree validation receipts'
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
