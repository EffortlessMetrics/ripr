name: Live Swarm History Sync Control

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: live-swarm-history-sync-20260811
  cancel-in-progress: false

jobs:
  construct:
    name: construct and prove exact two-parent sync candidate
    if: github.head_ref == 'sync/live-swarm-history-control-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_PARENT: 0b6073f88696ab70832dc7ea6410a0c285dc0f53
      SWARM_HEAD: 335ae8a119872555e83e1f8dfcd23744d9e2a602
      MERGE_BASE: 36909460db013ed3a3238ee8b2fc3ccda1135c15
      CANDIDATE_BRANCH: sync/live-swarm-history-335ae8a1

    steps:
      - name: Checkout source control branch
        uses: actions/checkout@v6
        with:
          ref: sync/live-swarm-history-control-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - name: Reuse compiler cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-live-history-sync

      - name: Fetch and bind exact live histories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$SOURCE_PARENT"
          cp .github/scripts/resolve_live_swarm_history_sync.py /tmp/resolve_live_swarm_history_sync.py
          cp .github/scripts/reconcile_live_sync_command.py /tmp/reconcile_live_sync_command.py
          cp .github/scripts/reconcile_live_sync_spec_identities.py /tmp/reconcile_live_sync_spec_identities.py
          cp .github/scripts/reconcile_live_sync_traceability.py /tmp/reconcile_live_sync_traceability.py
          git remote add swarm https://github.com/EffortlessMetrics/ripr-swarm.git
          git fetch --no-tags swarm "$SWARM_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$SWARM_HEAD"
          test "$(git merge-base "$SOURCE_PARENT" "$SWARM_HEAD")" = "$MERGE_BASE"
          git cat-file -e "$SOURCE_PARENT^{commit}"
          git cat-file -e "$SWARM_HEAD^{commit}"
          printf '%s\n' "$SOURCE_PARENT" > /tmp/source-parent.sha
          printf '%s\n' "$SWARM_HEAD" > /tmp/swarm-head.sha
          printf '%s\n' "$MERGE_BASE" > /tmp/merge-base.sha

      - name: Construct reviewed integration tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git checkout --detach "$SOURCE_PARENT"
          git merge --no-commit --no-ff -X theirs "$SWARM_HEAD"
          test -f .git/MERGE_HEAD
          test "$(cat .git/MERGE_HEAD)" = "$SWARM_HEAD"
          test -z "$(git diff --name-only --diff-filter=U)"

          # Release authority and release copy remain source-owned.
          git checkout "$SOURCE_PARENT" -- CHANGELOG.md

          # Product/runtime and current command-authority conflict surfaces are
          # taken exactly from current swarm. Version fields are normalized to
          # source and source's v2 verifier is re-exposed by the resolvers.
          git checkout "$SWARM_HEAD" -- \
            Cargo.lock \
            crates/ripr/Cargo.toml \
            crates/ripr/src/analysis/probes/diff.rs \
            crates/ripr/src/analysis/probes/mod.rs \
            crates/ripr/src/output/review_comments.rs \
            editors/vscode/package-lock.json \
            editors/vscode/package.json \
            fixtures/boundary_gap/expected/pr-guidance/configured-off/comments.json \
            docs/specs/RIPR-SPEC-0148-source-promotion-preflight.md \
            docs/swarm-development.md \
            docs/specs/README.md \
            policy/doc-artifacts.toml \
            policy/network_allowlist.txt \
            policy/process_allowlist.txt \
            xtask/Cargo.toml \
            xtask/src/command.rs \
            xtask/src/dispatch.rs \
            xtask/src/reports/mod.rs
          python /tmp/resolve_live_swarm_history_sync.py
          python /tmp/reconcile_live_sync_command.py
          python /tmp/reconcile_live_sync_spec_identities.py
          python /tmp/reconcile_live_sync_traceability.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Reconcile lock graph and format integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features
          cargo fmt --all
          cargo fmt --all -- --check
          git add Cargo.lock crates/ripr/Cargo.toml xtask/Cargo.toml xtask/src/command.rs xtask/src/dispatch.rs xtask/src/reports/mod.rs
          git diff --cached --check -- \
            .ripr/traceability.toml \
            Cargo.toml \
            Cargo.lock \
            crates/ripr/Cargo.toml \
            crates/ripr/src/analysis/probes/diff.rs \
            crates/ripr/src/analysis/probes/mod.rs \
            crates/ripr/src/output/review_comments.rs \
            editors/vscode/package-lock.json \
            editors/vscode/package.json \
            fixtures/boundary_gap/expected/pr-guidance/configured-off/comments.json \
            fixtures/source_promotion_verification/SPEC.md \
            docs/DOCUMENTATION.md \
            docs/specs/RIPR-SPEC-0148-source-promotion-preflight.md \
            docs/specs/RIPR-SPEC-0151-bounded-subprocess-adapter-boundary.md \
            docs/specs/RIPR-SPEC-0152-source-promotion-verifier.md \
            docs/specs/README.md \
            policy/doc-artifacts.toml \
            policy/network_allowlist.txt \
            policy/process_allowlist.txt \
            xtask/Cargo.toml \
            xtask/src/command.rs \
            xtask/src/dispatch.rs \
            xtask/src/reports/mod.rs

      - name: Focused integration proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask source_promotion -- --nocapture
          cargo xtask check-spec-format
          cargo xtask check-traceability
          cargo xtask check-doc-index
          cargo xtask check-doc-artifacts
          cargo xtask check-file-policy
          cargo xtask check-process-policy
          cargo xtask check-network-policy
          git diff --cached --check -- \
            .ripr/traceability.toml \
            Cargo.toml \
            Cargo.lock \
            crates/ripr/Cargo.toml \
            crates/ripr/src/analysis/probes/diff.rs \
            crates/ripr/src/analysis/probes/mod.rs \
            crates/ripr/src/output/review_comments.rs \
            editors/vscode/package-lock.json \
            editors/vscode/package.json \
            fixtures/boundary_gap/expected/pr-guidance/configured-off/comments.json \
            fixtures/source_promotion_verification/SPEC.md \
            docs/DOCUMENTATION.md \
            docs/specs/RIPR-SPEC-0148-source-promotion-preflight.md \
            docs/specs/RIPR-SPEC-0151-bounded-subprocess-adapter-boundary.md \
            docs/specs/RIPR-SPEC-0152-source-promotion-verifier.md \
            docs/specs/README.md \
            policy/doc-artifacts.toml \
            policy/network_allowlist.txt \
            policy/process_allowlist.txt \
            xtask/Cargo.toml \
            xtask/src/command.rs \
            xtask/src/dispatch.rs \
            xtask/src/reports/mod.rs

      - name: Commit exact history-preserving candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .git/MERGE_HEAD)" = "$SWARM_HEAD"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "sync(history): merge current ripr-swarm history into source"
          candidate="$(git rev-parse HEAD)"
          parents="$(git show -s --format='%P' HEAD)"
          test "$parents" = "$SOURCE_PARENT $SWARM_HEAD"
          git merge-base --is-ancestor "$SOURCE_PARENT" "$candidate"
          git merge-base --is-ancestor "$SWARM_HEAD" "$candidate"
          printf '%s\n' "$candidate" > /tmp/candidate.sha
          printf '%s\n' "$parents" > /tmp/candidate.parents
          git rev-parse "$candidate^{tree}" > /tmp/candidate.tree

      - name: Push exact candidate branch
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat /tmp/candidate.sha)"
          git push origin "$candidate:refs/heads/$CANDIDATE_BRANCH"
          remote="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$remote" = "$candidate"

      - name: Upload construction receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-swarm-history-sync-construction
          path: |
            /tmp/source-parent.sha
            /tmp/swarm-head.sha
            /tmp/merge-base.sha
            /tmp/candidate.sha
            /tmp/candidate.parents
            /tmp/candidate.tree
          if-no-files-found: warn
          retention-days: 30
