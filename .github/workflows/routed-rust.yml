name: Routed Rust Small

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Concurrency contract (ripr#1446).
#
# A shared group with `cancel-in-progress: false` keeps at most one running and
# one pending run: a newer arrival supersedes the older *pending* run without
# touching the one already executing. That is the behaviour we want:
#
#   - the useful in-progress proof completes rather than being discarded;
#   - at most one newer head waits;
#   - a newer queued head supersedes the older pending head;
#   - no in-progress hosted compute is thrown away;
#   - every completed run remains evidence for the exact head it names.
#
# Cancelling on `synchronize` would destroy a nearly finished proof every time a
# branch is pushed, which is the opposite of the repository's CI economics rule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  route:
    name: Route Ripr Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      route: ${{ steps.plan.outputs.route }}
      route_reason: ${{ steps.plan.outputs.route_reason }}
      repo: ${{ steps.plan.outputs.repo }}
      workflow: ${{ steps.plan.outputs.workflow }}
      run_id: ${{ steps.plan.outputs.run_id }}
      self_hosted_selection_attempted: ${{ steps.plan.outputs.self_hosted_selection_attempted }}
      private_runner_secret_requested: ${{ steps.plan.outputs.private_runner_secret_requested }}
      org_runner_query_attempted: ${{ steps.plan.outputs.org_runner_query_attempted }}
      plan_version: ${{ steps.plan.outputs.plan_version }}
      subject_event: ${{ steps.plan.outputs.subject_event }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      pr_head_sha: ${{ steps.plan.outputs.pr_head_sha }}
      subject_sha: ${{ steps.plan.outputs.subject_sha }}
      subject_trust_class: ${{ steps.plan.outputs.subject_trust_class }}
    steps:
      # The source repository proves its own pull requests on GitHub-hosted
      # runners. Self-hosted capacity is swarm-owned authority, so this route
      # performs no org runner discovery, requests no private runner secret, and
      # does not treat GitHub-hosted execution as a degraded fallback. The plan
      # is a property of the subject, not of another organisation's capacity.
      - name: Plan the source route
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          # The pull-request branch head, which is proposed but not what a
          # default checkout compiles.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          # The object a default `actions/checkout` materializes. On
          # `pull_request` this is GitHub's synthetic merge commit, not the
          # branch head, and it is the subject the product proof actually tests.
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          route=github_hosted_rust
          trust_class=internal
          case "$EVENT_NAME" in
            pull_request)
              if [ "$HEAD_REPO" = "$REPOSITORY" ]; then
                route_reason=maintainer_pull_request
              else
                route_reason=fork_pull_request
                trust_class=untrusted_fork
              fi
              ;;
            push) route_reason=protected_branch_push ;;
            merge_group) route_reason=merge_group_subject ;;
            *) route_reason=supported_subject ;;
          esac
          {
            echo "route=$route"
            echo "route_reason=$route_reason"
            echo "repo=$REPOSITORY"
            echo "workflow=routed-rust"
            echo "run_id=$RUN_ID"
            echo "self_hosted_selection_attempted=false"
            echo "private_runner_secret_requested=false"
            echo "org_runner_query_attempted=false"
            echo "plan_version=1"
            echo "subject_event=$EVENT_NAME"
            echo "base_sha=$BASE_SHA"
            echo "pr_head_sha=$PR_HEAD_SHA"
            echo "subject_sha=$SUBJECT_SHA"
            echo "subject_trust_class=$trust_class"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Ripr Rust Small Route"
            echo ""
            echo "- repo: \`$REPOSITORY\`"
            echo "- workflow: \`routed-rust\`"
            echo "- run: \`$RUN_ID\`"
            echo "- route: \`$route\`"
            echo "- reason: \`$route_reason\`"
            echo "- self-hosted selection attempted: \`false\`"
            echo "- private runner secret requested: \`false\`"
            echo "- org runner query attempted: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  detect-docs-only:
    name: Detect Docs-Only Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Cheap conservative scheduler. This job has no toolchain and no Rust
      # cache, so building xtask here would add a cold Rust build (measured
      # 135-186s in this repository) to every pull request merely to decide
      # which job to start.
      #
      # It therefore only schedules, and is deliberately stricter than the
      # authority: it accepts only `docs/**.md`, so it may route a documentation
      # change to the full proof, but it cannot route a source change to the
      # docs-only lane. The selected job re-decides with the typed rule
      # (`cargo xtask ci-docs-only --expect ...`) and fails if this scheduling
      # decision was wrong, so the cheap path is never the authority.
      - name: Schedule docs-only or full proof
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          if [ -n "${BASE_SHA:-}" ]; then
            changed="$(git diff --name-only -z "$BASE_SHA...HEAD" | tr '\0' '\n')"
            if [ -n "$changed" ]; then
              suspicious="$(printf '%s\n' "$changed" | grep -Ev '^docs/[^[:cntrl:]]*[.]md$' || true)"
              reserved="$(printf '%s\n' "$changed" | grep -E '^(CHANGELOG[.]md|docs/OUTPUT_SCHEMA[.]md)$' || true)"
              if [ -z "$suspicious" ] && [ -z "$reserved" ]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "### Docs-Only Scheduling"
            echo ""
            echo "- scheduled docs_only: \`$docs_only\`"
            echo "- authority: the selected job re-decides with \`cargo xtask ci-docs-only\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-github:
    name: Ripr Rust Small on GitHub Hosted
    needs: [route, detect-docs-only]
    # The source repository's only Rust proof route. It is first-class, not a
    # fallback: nothing upstream can select a self-hosted lane instead.
    if: always() && needs.route.result == 'success' &&
      needs.route.outputs.route == 'github_hosted_rust' &&
      needs.detect-docs-only.result == 'success' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      observed_subject_sha: ${{ steps.subject.outputs.observed_subject_sha }}
      observed_subject_tree: ${{ steps.subject.outputs.observed_subject_tree }}
    steps:
      # Candidate-controlled code is compiled and executed in this job, so the
      # repository credential is not persisted into the working tree. `v6` still
      # persists it by default, now via $RUNNER_TEMP, so later git commands would
      # otherwise keep authenticating. The workflow is read-only, but a
      # read-only persisted credential is still a credential.
      #
      # `ref` pins the tested subject explicitly rather than relying on the
      # default, so the object under proof is a stated input.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.route.outputs.subject_sha }}
          fetch-depth: 0
          persist-credentials: false
      # Prove which object this job actually materialized. The plan names a
      # subject; only the checkout can say what was compiled, and a proof run
      # against a different subject establishes nothing about this one.
      - name: Bind the tested subject
        id: subject
        env:
          PLANNED_SUBJECT_SHA: ${{ needs.route.outputs.subject_sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$observed_sha" != "$PLANNED_SUBJECT_SHA" ]; then
            echo "planned subject $PLANNED_SUBJECT_SHA but checked out $observed_sha" >&2
            exit 1
          fi
          {
            echo "observed_subject_sha=$observed_sha"
            echo "observed_subject_tree=$observed_tree"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-swarm-rust-small-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Required Rust gates
        run: |
          cargo fmt --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo nextest run --workspace
          cargo xtask precommit
          cargo xtask check-evidence-promotion-honesty
          cargo xtask check-agent-skills
          cargo xtask check-dependencies
          cargo xtask check-process-policy
          cargo xtask check-network-policy
          cargo xtask goldens check
          cargo xtask fixtures
      - name: Advisory reports
        if: always()
        run: |
          cargo xtask test-efficiency-report || true
          cargo xtask badge-artifacts || true
          cargo xtask pr-summary || true
          cargo xtask receipts || true
          cargo xtask reports index || true
      - name: PR evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RIPR_REVIEW_COMMENTS_TIMEOUT_SECS: "60"
        run: |
          cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA"
          cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA" --check
          cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA"
          cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check
          cargo xtask impacted-evidence
          cargo xtask impacted-evidence --check
          cargo xtask ripr-pr-summary
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations
          cargo xtask ripr-annotations --check
      - name: Proof route dry-run (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo xtask proof route --base "$BASE_SHA" --head "$HEAD_SHA" || true
          { echo "### Proof Route (dry-run, advisory)"; echo ""; cat target/ripr/reports/proof-route.md; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Remove RIPR analysis cache before artifact upload
        if: always()
        run: rm -rf target/ripr/cache
      - name: Upload ripr reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-rust-small-github
          path: |
            target/ripr/reports/
            target/ripr/receipts/
            target/ripr/pr/
            target/ripr/review/
            target/xtask/impacted-evidence/
          if-no-files-found: ignore

  docs-gate:
    name: Ripr Docs Gate
    needs: [detect-docs-only]
    if: github.event_name == 'pull_request' && needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-docs-gate
      # Authority: the cheap scheduler decided this is documentation; the typed
      # rule re-decides and fails if that decision was wrong, so a mis-schedule
      # cannot silently skip the Rust proof.
      - name: Confirm the docs-only classification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask ci-docs-only --base "$BASE_SHA" --expect docs_only
      - name: Doc/spec gates (full precommit table)
        run: |
          cargo xtask precommit
          cargo xtask check-agent-skills
      - name: Upload docs-gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-docs-gate
          path: target/ripr/reports/
          if-no-files-found: ignore

  result:
    name: Ripr Rust Small Result
    needs: [route, detect-docs-only, rust-github, docs-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every planned proposition resolves to an explicit state. The aggregate
      # goes green only for `passed` or an applicability that was planned as
      # `not_applicable`; it never goes green because a child check vanished or
      # because GitHub reported it as `skipped`.
      - name: Summarize routed result
        env:
          ROUTE: ${{ needs.route.outputs.route }}
          ROUTE_REASON: ${{ needs.route.outputs.route_reason }}
          ROUTE_RESULT: ${{ needs.route.result }}
          SELF_HOSTED_ATTEMPTED: ${{ needs.route.outputs.self_hosted_selection_attempted }}
          PRIVATE_SECRET_REQUESTED: ${{ needs.route.outputs.private_runner_secret_requested }}
          ORG_QUERY_ATTEMPTED: ${{ needs.route.outputs.org_runner_query_attempted }}
          GITHUB_RESULT: ${{ needs.rust-github.result }}
          PLAN_SUBJECT: ${{ needs.route.outputs.subject_sha }}
          PLAN_VERSION: ${{ needs.route.outputs.plan_version }}
          LIVE_SUBJECT: ${{ github.sha }}
          OBSERVED_SUBJECT: ${{ needs.rust-github.outputs.observed_subject_sha }}
          OBSERVED_TREE: ${{ needs.rust-github.outputs.observed_subject_tree }}
          EVENT_NAME: ${{ github.event_name }}
          DOCS_DETECT_RESULT: ${{ needs.detect-docs-only.result }}
          DOCS_ONLY: ${{ needs.detect-docs-only.outputs.docs_only }}
          DOCS_GATE_RESULT: ${{ needs.docs-gate.result }}
        run: |
          set -uo pipefail
          status=passed
          rust_state=not_run
          docs_state=not_run
          message="github-hosted rust proof succeeded"

          classify() {
            case "$1" in
              success) printf 'passed' ;;
              failure) printf 'failed' ;;
              cancelled) printf 'cancelled' ;;
              skipped) printf 'not_run' ;;
              *) printf 'unavailable' ;;
            esac
          }

          if [ "$DOCS_DETECT_RESULT" != "success" ]; then
            status=failed
            message="docs-surface detection resolved to $(classify "$DOCS_DETECT_RESULT")"
          elif [ "$DOCS_ONLY" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            rust_state=not_applicable
            docs_state="$(classify "$DOCS_GATE_RESULT")"
            if [ "$docs_state" = "passed" ]; then
              message="docs-only subject; rust proof not applicable; docs gate passed"
            else
              status=failed
              message="docs-only subject but docs gate resolved to $docs_state"
            fi
          elif [ "$ROUTE_RESULT" != "success" ]; then
            status=failed
            message="route job resolved to $(classify "$ROUTE_RESULT")"
          elif [ "$ROUTE" != "github_hosted_rust" ]; then
            status=failed
            message="unsupported source route: $ROUTE"
          else
            docs_state=not_applicable
            rust_state="$(classify "$GITHUB_RESULT")"
            if [ "$rust_state" != "passed" ]; then
              status=failed
              message="github-hosted rust proof resolved to $rust_state"
            fi
          fi

          # The plan must describe this exact head. A receipt produced for a
          # different head proves nothing about the subject being merged, so a
          # stale or missing binding fails closed rather than inheriting the
          # conclusion of whatever job graph happened to run.
          if [ -z "$PLAN_SUBJECT" ] || [ -z "$PLAN_VERSION" ]; then
            status=failed
            message="route plan published no subject identity; cannot bind the result to a subject"
          elif [ "$PLAN_SUBJECT" != "$LIVE_SUBJECT" ]; then
            status=failed
            message="route plan bound subject $PLAN_SUBJECT but this run proves $LIVE_SUBJECT"
          elif [ "$rust_state" = "passed" ] && [ "$OBSERVED_SUBJECT" != "$PLAN_SUBJECT" ]; then
            status=failed
            message="stale_or_wrong_subject: rust proof observed $OBSERVED_SUBJECT, plan named $PLAN_SUBJECT"
          fi

          # The source route must never silently acquire swarm runner authority.
          for guard in "self_hosted_selection_attempted:$SELF_HOSTED_ATTEMPTED" \
                       "private_runner_secret_requested:$PRIVATE_SECRET_REQUESTED" \
                       "org_runner_query_attempted:$ORG_QUERY_ATTEMPTED"; do
            name="${guard%%:*}"
            value="${guard#*:}"
            if [ "$value" != "false" ]; then
              status=failed
              message="source route reported $name=$value; self-hosted authority belongs to ripr-swarm"
            fi
          done

          {
            echo "### Ripr Rust Small Result"
            echo ""
            for row in "route:$ROUTE" "reason:$ROUTE_REASON" "status:$status" "message:$message" \
                       "rust proof:$rust_state" "docs gate:$docs_state" \
                       "docs_detect:$DOCS_DETECT_RESULT" "docs_only:$DOCS_ONLY" \
                       "route job:$ROUTE_RESULT" "github job:$GITHUB_RESULT" \
                       "self-hosted selection attempted:$SELF_HOSTED_ATTEMPTED" \
                       "private runner secret requested:$PRIVATE_SECRET_REQUESTED" \
                       "org runner query attempted:$ORG_QUERY_ATTEMPTED"; do
              echo "- ${row%%:*}: \`${row#*:}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$status" = "passed" ]
