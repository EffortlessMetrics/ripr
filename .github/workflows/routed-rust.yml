name: Routed Rust Small

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Concurrency contract (ripr#1446).
#
# A shared group with `cancel-in-progress: false` keeps at most one running and
# one pending run: a newer arrival supersedes the older *pending* run without
# touching the one already executing. That is the behaviour we want:
#
#   - the useful in-progress proof completes rather than being discarded;
#   - at most one newer head waits;
#   - a newer queued head supersedes the older pending head;
#   - no in-progress hosted compute is thrown away;
#   - every completed run remains evidence for the exact head it names.
#
# Cancelling on `synchronize` would destroy a nearly finished proof every time a
# branch is pushed, which is the opposite of the repository's CI economics rule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  route:
    name: Route Ripr Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      route: ${{ steps.plan.outputs.route }}
      route_reason: ${{ steps.plan.outputs.route_reason }}
      repo: ${{ steps.plan.outputs.repo }}
      workflow: ${{ steps.plan.outputs.workflow }}
      run_id: ${{ steps.plan.outputs.run_id }}
      self_hosted_selection_attempted: ${{ steps.plan.outputs.self_hosted_selection_attempted }}
      private_runner_secret_requested: ${{ steps.plan.outputs.private_runner_secret_requested }}
      org_runner_query_attempted: ${{ steps.plan.outputs.org_runner_query_attempted }}
      plan_version: ${{ steps.plan.outputs.plan_version }}
      subject_event: ${{ steps.plan.outputs.subject_event }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      pr_head_sha: ${{ steps.plan.outputs.pr_head_sha }}
      subject_sha: ${{ steps.plan.outputs.subject_sha }}
      subject_trust_class: ${{ steps.plan.outputs.subject_trust_class }}
    steps:
      # The source repository proves its own pull requests on GitHub-hosted
      # runners. Self-hosted capacity is swarm-owned authority, so this route
      # performs no org runner discovery, requests no private runner secret, and
      # does not treat GitHub-hosted execution as a degraded fallback. The plan
      # is a property of the subject, not of another organisation's capacity.
      - name: Plan the source route
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          # The pull-request branch head, which is proposed but not what a
          # default checkout compiles.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          # The object a default `actions/checkout` materializes. On
          # `pull_request` this is GitHub's synthetic merge commit, not the
          # branch head, and it is the subject the product proof actually tests.
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          route=github_hosted_rust
          trust_class=manual_subject
          case "$EVENT_NAME" in
            pull_request)
              if [ "$HEAD_REPO" = "$REPOSITORY" ]; then
                route_reason=maintainer_pull_request; trust_class=maintainer_candidate
              else
                route_reason=fork_pull_request; trust_class=untrusted_fork
              fi
              ;;
            push) route_reason=protected_branch_push; trust_class=protected_branch ;;
            merge_group) route_reason=merge_group_subject; trust_class=merge_group ;;
            *) route_reason=supported_subject ;;
          esac
          {
            echo "route=$route"
            echo "route_reason=$route_reason"
            echo "repo=$REPOSITORY"
            echo "workflow=routed-rust"
            echo "run_id=$RUN_ID"
            echo "self_hosted_selection_attempted=false"
            echo "private_runner_secret_requested=false"
            echo "org_runner_query_attempted=false"
            echo "plan_version=1"
            echo "subject_event=$EVENT_NAME"
            echo "base_sha=$BASE_SHA"
            echo "pr_head_sha=$PR_HEAD_SHA"
            echo "subject_sha=$SUBJECT_SHA"
            echo "subject_trust_class=$trust_class"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Ripr Rust Small Route"
            echo ""
            echo "- repo: \`$REPOSITORY\`"
            echo "- workflow: \`routed-rust\`"
            echo "- run: \`$RUN_ID\`"
            echo "- route: \`$route\`"
            echo "- reason: \`$route_reason\`"
            echo "- self-hosted selection attempted: \`false\`"
            echo "- private runner secret requested: \`false\`"
            echo "- org runner query attempted: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  detect-docs-only:
    name: Detect Docs-Only Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Cheap conservative scheduler. This job has no toolchain and no Rust
      # cache, so building xtask here would add a cold Rust build (measured
      # 135-186s in this repository) to every pull request merely to decide
      # which job to start.
      #
      # It therefore only schedules, and is deliberately stricter than the
      # authority: it accepts only `docs/**.md`, so it may route a documentation
      # change to the full proof, but it cannot route a source change to the
      # docs-only lane. The selected job re-decides with the typed rule
      # (`cargo xtask ci-docs-only --expect ...`) and fails if this scheduling
      # decision was wrong, so the cheap path is never the authority.
      - name: Schedule docs-only or full proof
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          if [ -n "${BASE_SHA:-}" ]; then
            changed_file="$RUNNER_TEMP/ripr-changed-paths.z"
            if git diff --name-only -z "$BASE_SHA...HEAD" > "$changed_file"; then
              changed_count=0
              rejected=false
              while IFS= read -r -d '' path; do
                changed_count=$((changed_count + 1))
                if [[ ! "$path" =~ ^docs/[^[:cntrl:]]*[.]md$ ]] || \
                   [[ "$path" =~ ^(CHANGELOG[.]md|docs/OUTPUT_SCHEMA[.]md)$ ]]; then
                  rejected=true
                fi
              done < "$changed_file"
              if [ "$changed_count" -gt 0 ] && [ "$rejected" = false ]; then
                docs_only=true
              fi
            fi
            rm -f "$changed_file"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "### Docs-Only Scheduling"
            echo ""
            echo "- scheduled docs_only: \`$docs_only\`"
            echo "- authority: the selected job re-decides with \`cargo xtask ci-docs-only\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-github:
    name: Ripr Rust Small on GitHub Hosted
    needs: [route, detect-docs-only]
    # The source repository's only Rust proof route. It is first-class, not a
    # fallback: nothing upstream can select a self-hosted lane instead.
    if: always() && needs.route.result == 'success' &&
      needs.route.outputs.route == 'github_hosted_rust' &&
      needs.detect-docs-only.result == 'success' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      observed_subject_sha: ${{ steps.subject.outputs.observed_subject_sha }}
      observed_subject_tree: ${{ steps.subject.outputs.observed_subject_tree }}
      child_receipt_state: ${{ steps.child_receipt.outputs.child_receipt_state }}
      cache_hit: ${{ steps.rust_cache.outputs.cache-hit }}
      cache_matched_key: ${{ steps.rust_cache.outputs.cache-matched-key }}
      runner_os: ${{ steps.runner_identity.outputs.os }}
      runner_arch: ${{ steps.runner_identity.outputs.arch }}
      runner_image_os: ${{ steps.runner_identity.outputs.image_os }}
      runner_image_version: ${{ steps.runner_identity.outputs.image_version }}
    steps:
      # Candidate-controlled code is compiled and executed in this job, so the
      # repository credential is not persisted into the working tree. `v6` still
      # persists it by default, now via $RUNNER_TEMP, so later git commands would
      # otherwise keep authenticating. The workflow is read-only, but a
      # read-only persisted credential is still a credential.
      #
      # `ref` pins the tested subject explicitly rather than relying on the
      # default, so the object under proof is a stated input.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.route.outputs.subject_sha }}
          fetch-depth: 0
          persist-credentials: false
      # Prove which object this job actually materialized. The plan names a
      # subject; only the checkout can say what was compiled, and a proof run
      # against a different subject establishes nothing about this one.
      - name: Bind the tested subject
        id: subject
        env:
          PLANNED_SUBJECT_SHA: ${{ needs.route.outputs.subject_sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "observed_subject_sha=$observed_sha"
            echo "observed_subject_tree=$observed_tree"
          } >> "$GITHUB_OUTPUT"
          if [ "$observed_sha" != "$PLANNED_SUBJECT_SHA" ]; then
            echo "planned subject $PLANNED_SUBJECT_SHA but checked out $observed_sha" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      # Restore-only is safe for candidate-controlled subjects: this action has
      # no cache write path. Cache population is owned outside this candidate
      # workflow by a separately protected producer.
      - id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/ripr/**
          key: ripr-routed-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Observe the child runner identity
        id: runner_identity
        run: |
          echo "os=$RUNNER_OS" >> "$GITHUB_OUTPUT"
          echo "arch=$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
          echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "image_version=$ImageVersion" >> "$GITHUB_OUTPUT"
      # Job outputs schedule work; this packet proves it. Written here because the
      # route job has no toolchain, and this job already builds Rust. It
      # rederives the subject and changed-path identity rather than restating the
      # scheduler's claims, and refuses a mis-scheduled reduced lane.
      - name: Emit the routed Rust plan packet
        env:
          SCHEDULED_ROUTE: github_hosted_rust
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.route.outputs.pr_head_sha }}
          SUBJECT_SHA: ${{ needs.route.outputs.subject_sha }}
          EVENT: ${{ needs.route.outputs.subject_event }}
          TRUST_CLASS: ${{ needs.route.outputs.subject_trust_class }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
          CACHE_PRIMARY_KEY: ${{ steps.rust_cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.rust_cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
        run: |
          cargo run --locked -p xtask -- ci-routed-rust-plan \
            --scheduled-route "$SCHEDULED_ROUTE" \
            --base "$BASE_SHA" \
            --pr-head "$PR_HEAD_SHA" \
            --subject "$SUBJECT_SHA" \
            --event "$EVENT" \
            --trust-class "$TRUST_CLASS" \
            --repository "$REPOSITORY" \
            --workflow "$WORKFLOW"
      - name: Install nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: nextest
      # Each planned command records its own terminal state before its exit code
      # propagates, so an interrupted job still leaves evidence for the commands
      # that did complete. Without per-command evidence the aggregate could only
      # repeat GitHub's tick and could never contradict it.
      - name: Required Rust gates
        run: |
          set -euo pipefail
          R="cargo run --locked -p xtask -- ci-record-command --id"
          $R cargo_fmt -- cargo fmt --check
          $R cargo_check -- cargo check --workspace --all-targets
          $R cargo_clippy -- cargo clippy --workspace --all-targets -- -D warnings
          $R cargo_nextest -- cargo nextest run --workspace
          $R precommit -- cargo xtask precommit
          $R check_evidence_promotion_honesty -- cargo xtask check-evidence-promotion-honesty
          $R check_agent_skills -- cargo xtask check-agent-skills
          $R check_dependencies -- cargo xtask check-dependencies
          $R check_process_policy -- cargo xtask check-process-policy
          $R check_network_policy -- cargo xtask check-network-policy
          $R goldens_check -- cargo xtask goldens check
          $R fixtures -- cargo xtask fixtures
      - name: Required PR evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RIPR_REVIEW_COMMENTS_TIMEOUT_SECS: "60"
          RIPR_MAX_DIFF_CHANGED_RUST_LINES: "5000"
          RIPR_PARTIAL_DIFF_LINE_BUDGET: "5000"
        run: |
          set -euo pipefail
          R="cargo run --locked -p xtask -- ci-record-command --id"
          $R ripr_pr -- cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA"
          $R ripr_pr_check -- cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA" --check
          $R ripr_review_comments -- cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check-output target/ripr/pr/check.json
          $R ripr_review_comments_check -- cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check-output target/ripr/pr/check.json --check
          $R impacted_evidence -- cargo xtask impacted-evidence
          $R impacted_evidence_check -- cargo xtask impacted-evidence --check
          $R ripr_pr_summary -- cargo xtask ripr-pr-summary
          $R ripr_pr_summary_check -- cargo xtask ripr-pr-summary --check
          $R ripr_annotations -- cargo xtask ripr-annotations
          $R ripr_annotations_check -- cargo xtask ripr-annotations --check
      # Runs even when a gate failed or the job was interrupted, so the receipt
      # distinguishes failed, not_run and cancelled rather than
      # collapsing everything into one red tick.
      - name: Finalize the child execution receipt
        id: child_receipt
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
          SUBJECT_SHA: ${{ steps.subject.outputs.observed_subject_sha }}
          SUBJECT_TREE: ${{ steps.subject.outputs.observed_subject_tree }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          plan="cargo_fmt,cargo_check,cargo_clippy,cargo_nextest,precommit,check_evidence_promotion_honesty,check_agent_skills,check_dependencies,check_process_policy,check_network_policy,goldens_check,fixtures"
          if [ "$EVENT" = "pull_request" ]; then
            plan="$plan,ripr_pr,ripr_pr_check,ripr_review_comments,ripr_review_comments_check,impacted_evidence,impacted_evidence_check,ripr_pr_summary,ripr_pr_summary_check,ripr_annotations,ripr_annotations_check"
          fi
          cargo run --locked -p xtask -- ci-child-receipt \
            --plan "$plan" \
            --plan-path "target/ripr/reports/routed-rust-plan.json" \
            --job-outcome "$JOB_OUTCOME" \
            --subject-sha "$SUBJECT_SHA" \
            --subject-tree "$SUBJECT_TREE" >> "$GITHUB_OUTPUT"
      - name: Upload child execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-routed-rust-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ripr/reports/routed-rust-plan.json
            target/ripr/reports/routed-rust-plan.md
            target/ripr/reports/routed-rust-execution.json
            target/ripr/reports/routed-rust-command-*.log
          if-no-files-found: warn
      - name: Advisory reports
        if: always()
        run: |
          cargo xtask test-efficiency-report || true
          cargo xtask badge-artifacts || true
          cargo xtask pr-summary || true
          cargo xtask receipts || true
          cargo xtask reports index || true
      - name: Proof route dry-run (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo xtask proof route --base "$BASE_SHA" --head "$HEAD_SHA" || true
          { echo "### Proof Route (dry-run, advisory)"; echo ""; cat target/ripr/reports/proof-route.md; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Remove RIPR analysis cache before artifact upload
        if: always()
        run: rm -rf target/ripr/cache
      - name: Upload ripr reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-rust-small-github
          path: |
            target/ripr/reports/
            target/ripr/receipts/
            target/ripr/pr/
            target/ripr/review/
            target/xtask/impacted-evidence/
          if-no-files-found: ignore

  docs-gate:
    name: Ripr Docs Gate
    needs: [route, detect-docs-only]
    if: github.event_name == 'pull_request' && needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      observed_subject_sha: ${{ steps.subject.outputs.observed_subject_sha }}
      observed_subject_tree: ${{ steps.subject.outputs.observed_subject_tree }}
      child_receipt_state: ${{ steps.child_receipt.outputs.child_receipt_state }}
      cache_hit: ${{ steps.docs_cache.outputs.cache-hit }}
      cache_matched_key: ${{ steps.docs_cache.outputs.cache-matched-key }}
      runner_os: ${{ steps.runner_identity.outputs.os }}
      runner_arch: ${{ steps.runner_identity.outputs.arch }}
      runner_image_os: ${{ steps.runner_identity.outputs.image_os }}
      runner_image_version: ${{ steps.runner_identity.outputs.image_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.route.outputs.subject_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the tested subject
        id: subject
        env:
          PLANNED_SUBJECT_SHA: ${{ needs.route.outputs.subject_sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "observed_subject_sha=$observed_sha"
            echo "observed_subject_tree=$observed_tree"
          } >> "$GITHUB_OUTPUT"
          if [ "$observed_sha" != "$PLANNED_SUBJECT_SHA" ]; then
            echo "planned subject $PLANNED_SUBJECT_SHA but checked out $observed_sha" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - id: docs_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/ripr/**
          key: ripr-routed-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Observe the child runner identity
        id: runner_identity
        run: |
          echo "os=$RUNNER_OS" >> "$GITHUB_OUTPUT"
          echo "arch=$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
          echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "image_version=$ImageVersion" >> "$GITHUB_OUTPUT"
      # Job outputs schedule work; this packet proves it. Written here because the
      # route job has no toolchain, and this job already builds Rust. It
      # rederives the subject and changed-path identity rather than restating the
      # scheduler's claims, and refuses a mis-scheduled reduced lane.
      - name: Emit the routed Rust plan packet
        env:
          SCHEDULED_ROUTE: docs_only
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.route.outputs.pr_head_sha }}
          SUBJECT_SHA: ${{ needs.route.outputs.subject_sha }}
          EVENT: ${{ needs.route.outputs.subject_event }}
          TRUST_CLASS: ${{ needs.route.outputs.subject_trust_class }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
          CACHE_PRIMARY_KEY: ${{ steps.docs_cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.docs_cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.docs_cache.outputs.cache-hit }}
        run: |
          cargo run --locked -p xtask -- ci-routed-rust-plan \
            --scheduled-route "$SCHEDULED_ROUTE" \
            --base "$BASE_SHA" \
            --pr-head "$PR_HEAD_SHA" \
            --subject "$SUBJECT_SHA" \
            --event "$EVENT" \
            --trust-class "$TRUST_CLASS" \
            --repository "$REPOSITORY" \
            --workflow "$WORKFLOW"
      # Authority: the cheap scheduler decided this is documentation; the typed
      # rule re-decides and fails if that decision was wrong, so a mis-schedule
      # cannot silently skip the Rust proof.
      - name: Confirm the docs-only classification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask ci-docs-only --base "$BASE_SHA" --head "$HEAD_SHA" --expect docs_only
      - name: Doc/spec gates (full precommit table)
        run: |
          set -euo pipefail
          R="cargo run --locked -p xtask -- ci-record-command --id"
          $R precommit -- cargo xtask precommit
          $R check_agent_skills -- cargo xtask check-agent-skills
      - name: Required PR evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RIPR_REVIEW_COMMENTS_TIMEOUT_SECS: "60"
          RIPR_MAX_DIFF_CHANGED_RUST_LINES: "5000"
          RIPR_PARTIAL_DIFF_LINE_BUDGET: "5000"
        run: |
          set -euo pipefail
          R="cargo run --locked -p xtask -- ci-record-command --id"
          $R ripr_pr -- cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA"
          $R ripr_pr_check -- cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA" --check
          $R ripr_review_comments -- cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check-output target/ripr/pr/check.json
          $R ripr_review_comments_check -- cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check-output target/ripr/pr/check.json --check
          $R impacted_evidence -- cargo xtask impacted-evidence
          $R impacted_evidence_check -- cargo xtask impacted-evidence --check
          $R ripr_pr_summary -- cargo xtask ripr-pr-summary
          $R ripr_pr_summary_check -- cargo xtask ripr-pr-summary --check
          $R ripr_annotations -- cargo xtask ripr-annotations
          $R ripr_annotations_check -- cargo xtask ripr-annotations --check
      - name: Finalize the docs execution receipt
        id: child_receipt
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
          SUBJECT_SHA: ${{ steps.subject.outputs.observed_subject_sha }}
          SUBJECT_TREE: ${{ steps.subject.outputs.observed_subject_tree }}
        run: |
          set -uo pipefail
          cargo run --locked -p xtask -- ci-child-receipt \
            --plan "precommit,check_agent_skills,ripr_pr,ripr_pr_check,ripr_review_comments,ripr_review_comments_check,impacted_evidence,impacted_evidence_check,ripr_pr_summary,ripr_pr_summary_check,ripr_annotations,ripr_annotations_check" \
            --plan-path "target/ripr/reports/routed-rust-plan.json" \
            --job-outcome "$JOB_OUTCOME" \
            --subject-sha "$SUBJECT_SHA" \
            --subject-tree "$SUBJECT_TREE" >> "$GITHUB_OUTPUT"
      - name: Upload docs-gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-routed-rust-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ripr/reports/routed-rust-plan.json
            target/ripr/reports/routed-rust-plan.md
            target/ripr/reports/routed-rust-execution.json
            target/ripr/reports/routed-rust-command-*.log
          if-no-files-found: warn

  result:
    name: Ripr Rust Small Result
    needs: [route, detect-docs-only, rust-github, docs-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - if: always()
        id: result_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/ripr/**
          key: ripr-routed-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Observe the result subject and changed-path inventory
        id: result_identity
        env:
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.route.outputs.pr_head_sha }}
          SCHEDULED_SUBJECT_SHA: ${{ needs.route.outputs.subject_sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$observed_sha" != "$SCHEDULED_SUBJECT_SHA" ]; then
            echo "scheduled subject $SCHEDULED_SUBJECT_SHA but result checked out $observed_sha" >&2
            exit 1
          fi
          pr_head_tree=""
          if [ -n "$PR_HEAD_SHA" ]; then
            pr_head_tree="$(git rev-parse "$PR_HEAD_SHA^{tree}")"
          fi
          {
            echo "subject_sha=$observed_sha"
            echo "subject_tree=$observed_tree"
            echo "pr_head_tree=$pr_head_tree"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
            echo "rustc_identity=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)"
            echo "cargo_identity=$(cargo -Vv | sha256sum | cut -d ' ' -f 1)"
            echo "artifact_identity=ripr-routed-rust-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
      - name: Observe authoritative applicability
        id: result_applicability
        env:
          BASE_SHA: ${{ needs.route.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.route.outputs.pr_head_sha }}
        run: cargo run --locked -p xtask -- ci-docs-only --base "$BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Clear any non-artifact routed evidence
        if: always()
        run: |
          rm -f \
            target/ripr/reports/routed-rust-plan.json \
            target/ripr/reports/routed-rust-plan.md \
            target/ripr/reports/routed-rust-execution.json \
            target/ripr/reports/routed-rust-result.json
      - name: Download the selected child evidence
        id: evidence_download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ripr-routed-rust-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ripr/reports/
      - name: Quarantine evidence after an artifact integrity failure
        if: always() && steps.evidence_download.outcome != 'success'
        run: |
          rm -f \
            target/ripr/reports/routed-rust-plan.json \
            target/ripr/reports/routed-rust-plan.md \
            target/ripr/reports/routed-rust-execution.json
      # The verdict lives in Rust, where `routed_rust_aggregate_transition_matrix`
      # exercises every transition. Deciding here in shell would leave the
      # tested table describing something other than what actually runs.
      #
      # Planned propositions and child receipts decide the outcome; GitHub's
      # scheduling artefacts are inputs, not the answer. A required lane that was
      # skipped is `not_proven`, never a pass, and a green tick that disagrees
      # with its own receipt is a failed result.
      - name: Publish the normalized routed result
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.evidence_download.outcome }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW: ${{ github.workflow_ref }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_BASE: ${{ needs.route.outputs.base_sha }}
          EXPECTED_PR_HEAD: ${{ needs.route.outputs.pr_head_sha }}
          EXPECTED_PR_HEAD_TREE: ${{ steps.result_identity.outputs.pr_head_tree }}
          EXPECTED_TRUST_CLASS: ${{ needs.route.outputs.subject_trust_class }}
          EXPECTED_APPLICABILITY: ${{ steps.result_applicability.outputs.docs_only == 'true' && 'docs_only' || steps.result_applicability.outputs.docs_only == 'false' && 'github_hosted_rust' || '' }}
          EXPECTED_ROUTE: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && 'docs_only' || needs.route.outputs.route }}
          EXPECTED_SUBJECT: ${{ steps.result_identity.outputs.subject_sha }}
          EXPECTED_SUBJECT_TREE: ${{ steps.result_identity.outputs.subject_tree }}
          EXPECTED_CHANGED_PATHS_SHA256: ${{ steps.result_applicability.outputs.changed_paths_sha256 }}
          EXPECTED_CHANGED_PATH_COUNT: ${{ steps.result_applicability.outputs.changed_path_count }}
          EXPECTED_CHANGED_PATHS_UTF8: ${{ steps.result_applicability.outputs.changed_paths_utf8 }}
          EXPECTED_TOOLCHAIN_IDENTITY: ${{ steps.result_identity.outputs.rustc_identity }}
          EXPECTED_CARGO_IDENTITY: ${{ steps.result_identity.outputs.cargo_identity }}
          EXPECTED_CARGO_LOCK_SHA256: ${{ steps.result_identity.outputs.cargo_lock_sha256 }}
          EXPECTED_CACHE_IDENTITY: ${{ steps.result_cache.outputs.cache-primary-key }}
          EXPECTED_CACHE_HIT: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.outputs.cache_hit || needs.rust-github.outputs.cache_hit }}
          EXPECTED_CACHE_MATCHED_IDENTITY: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.outputs.cache_matched_key || needs.rust-github.outputs.cache_matched_key }}
          EXPECTED_RUNNER_OS: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.outputs.runner_os || needs.rust-github.outputs.runner_os }}
          EXPECTED_RUNNER_ARCH: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.outputs.runner_arch || needs.rust-github.outputs.runner_arch }}
          EXPECTED_RUNNER_IMAGE_OS: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.outputs.runner_image_os || needs.rust-github.outputs.runner_image_os }}
          EXPECTED_RUNNER_IMAGE_VERSION: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.outputs.runner_image_version || needs.rust-github.outputs.runner_image_version }}
          EXPECTED_ARTIFACT_IDENTITY: ${{ steps.result_identity.outputs.artifact_identity }}
          CHILD_CONCLUSION: ${{ needs.detect-docs-only.outputs.docs_only == 'true' && needs.docs-gate.result || needs.rust-github.result }}
          SELF_HOSTED_SELECTION_ATTEMPTED: ${{ needs.route.outputs.self_hosted_selection_attempted }}
          PRIVATE_RUNNER_SECRET_REQUESTED: ${{ needs.route.outputs.private_runner_secret_requested }}
          ORG_RUNNER_QUERY_ATTEMPTED: ${{ needs.route.outputs.org_runner_query_attempted }}
        run: |
          set -uo pipefail
          cargo run --locked -p xtask -- ci-routed-rust-result \
            --plan-path "target/ripr/reports/routed-rust-plan.json" \
            --execution-path "target/ripr/reports/routed-rust-execution.json" \
            --download-outcome "$DOWNLOAD_OUTCOME" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-workflow "$EXPECTED_WORKFLOW" \
            --expected-event "$EXPECTED_EVENT" \
            --expected-base "$EXPECTED_BASE" \
            --expected-pr-head "$EXPECTED_PR_HEAD" \
            --expected-pr-head-tree "$EXPECTED_PR_HEAD_TREE" \
            --expected-trust-class "$EXPECTED_TRUST_CLASS" \
            --expected-authoritative-applicability "$EXPECTED_APPLICABILITY" \
            --expected-route "$EXPECTED_ROUTE" \
            --expected-subject "$EXPECTED_SUBJECT" \
            --expected-subject-tree "$EXPECTED_SUBJECT_TREE" \
            --expected-changed-paths-sha256 "$EXPECTED_CHANGED_PATHS_SHA256" \
            --expected-changed-path-count "$EXPECTED_CHANGED_PATH_COUNT" \
            --expected-changed-paths-utf8 "$EXPECTED_CHANGED_PATHS_UTF8" \
            --expected-toolchain-identity "$EXPECTED_TOOLCHAIN_IDENTITY" \
            --expected-cargo-identity "$EXPECTED_CARGO_IDENTITY" \
            --expected-cargo-lock-sha256 "$EXPECTED_CARGO_LOCK_SHA256" \
            --expected-cache-identity "$EXPECTED_CACHE_IDENTITY" \
            --expected-cache-hit "$EXPECTED_CACHE_HIT" \
            --expected-cache-matched-identity "$EXPECTED_CACHE_MATCHED_IDENTITY" \
            --expected-runner-os "$EXPECTED_RUNNER_OS" \
            --expected-runner-arch "$EXPECTED_RUNNER_ARCH" \
            --expected-runner-image-os "$EXPECTED_RUNNER_IMAGE_OS" \
            --expected-runner-image-version "$EXPECTED_RUNNER_IMAGE_VERSION" \
            --expected-artifact-identity "$EXPECTED_ARTIFACT_IDENTITY" \
            --child-conclusion "$CHILD_CONCLUSION" \
            --self-hosted-selection-attempted "$SELF_HOSTED_SELECTION_ATTEMPTED" \
            --private-runner-secret-requested "$PRIVATE_RUNNER_SECRET_REQUESTED" \
            --org-runner-query-attempted "$ORG_RUNNER_QUERY_ATTEMPTED"
      - name: Upload the normalized result evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-routed-rust-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ripr/reports/routed-rust-result.json
          if-no-files-found: error
