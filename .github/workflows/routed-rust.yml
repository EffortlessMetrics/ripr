name: Routed Rust Small

on:
  pull_request:
    # `unlabeled` is omitted on purpose (#4380): a windows-ci (or other
    # unrelated) label removal must not start this required workflow, occupy
    # the per-PR concurrency group, or replace Ripr Rust Small Result.
    # `labeled` stays so `full-ci` can still refresh advisory reports.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci' && '-label-ignore' || '' }}
  # Product decision: cancel only on new commits. Do not flip this globally
  # for label events (#4380). Unrelated labeled runs use the `-label-ignore`
  # suffix so they cannot replace a pending synchronize proof in the
  # per-PR group. Unrelated label events must not launch the gate instead of
  # changing cancellation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  route:
    name: Route Ripr Rust Small
    # Launch the required gate on opened/synchronize/reopened, main pushes,
    # workflow_dispatch, and `full-ci` labeled. Other labeled events (including
    # windows-ci) stay in this workflow only long enough for the result job to
    # post a non-required ignore check and leave the previous exact-head
    # Ripr Rust Small Result untouched.
    if: github.event_name != 'pull_request' || contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      router_target: ${{ steps.route.outputs.router_target }}
      router_reason: ${{ steps.route.outputs.router_reason }}
      repo: ${{ steps.route.outputs.repo }}
      workflow: ${{ steps.route.outputs.workflow }}
      run_id: ${{ steps.route.outputs.run_id }}
      runner_query: ${{ steps.route.outputs.runner_query }}
      runner_total: ${{ steps.route.outputs.runner_total }}
      cx43_online: ${{ steps.route.outputs.cx43_online }}
      cx43_idle_ready: ${{ steps.route.outputs.cx43_idle_ready }}
      cpx42_online: ${{ steps.route.outputs.cpx42_online }}
      cpx42_idle_ready: ${{ steps.route.outputs.cpx42_idle_ready }}
      cx53_online: ${{ steps.route.outputs.cx53_online }}
      cx53_idle_ready: ${{ steps.route.outputs.cx53_idle_ready }}
    steps:
      - name: Select runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          target=github reason=runner_api_failed runner_query=not_attempted runner_total=not_available
          cx43_online=not_available cx43_idle_ready=not_available cpx42_online=not_available cpx42_idle_ready=not_available cx53_online=not_available cx53_idle_ready=not_available
          count() { printf '%s' "$runners" | jq -s "$1"; }
          idle() { printf '%s' "$runners" | jq -s -e --arg model "$1" --arg cap "$2" '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index($model) and index($cap)))] | length > 0' >/dev/null; }
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            reason=fork_or_untrusted_pr runner_query=skipped_untrusted_pr
          elif runners="$(gh api --paginate 'orgs/EffortlessMetrics/actions/runners?per_page=100' 2>/tmp/runners.err)"; then
            runner_query=ok
            runner_total="$(count '[.[].runners[]?] | length')"
            cx43_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43")))] | length')"
            cx43_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43") and index("rust-medium")))] | length')"
            cpx42_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42")))] | length')"
            cpx42_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42") and index("rust-16gb")))] | length')"
            cx53_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53")))] | length')"
            cx53_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53") and index("rust-large")))] | length')"
            if idle cx43 rust-medium; then target=cx43 reason=cx43_idle
            elif idle cpx42 rust-16gb; then target=cpx42 reason=cpx42_idle
            elif idle cx53 rust-large; then target=cx53 reason=cx53_idle
            elif [ "$cx43_online$cx43_idle_ready$cpx42_online$cpx42_idle_ready$cx53_online$cx53_idle_ready" != "000000" ]; then reason=runner_capacity_unavailable
            else reason=no_idle_runner
            fi
          else
            runner_query=failed reason=runner_api_failed
          fi
          { echo "router_target=$target"; echo "router_reason=$reason"; repo=$REPOSITORY workflow=routed-rust run_id=$RUN_ID; for name in repo workflow run_id runner_query runner_total cx43_online cx43_idle_ready cpx42_online cpx42_idle_ready cx53_online cx53_idle_ready; do echo "$name=${!name}"; done; } >> "$GITHUB_OUTPUT"
          { echo "### Ripr Rust Small Router"; echo ""; echo "- repo: \`$REPOSITORY\`"; echo "- workflow: \`routed-rust\`"; echo "- run: \`$RUN_ID\`"; echo "- target: \`$target\`"; echo "- reason: \`$reason\`"; for row in "runner query:$runner_query" "visible runners:$runner_total" "cx43 online:$cx43_online" "cx43 idle ready:$cx43_idle_ready" "cpx42 online:$cpx42_online" "cpx42 idle ready:$cpx42_idle_ready" "cx53 online:$cx53_online" "cx53 idle ready:$cx53_idle_ready"; do echo "- ${row%%:*}: \`${row#*:}\`"; done; } >> "$GITHUB_STEP_SUMMARY"

  detect-docs-only:
    name: Detect Docs-Only Surface
    if: github.event_name != 'pull_request' || contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether every changed file is docs/spec/markdown
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            changed="$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null || true)"
            if [ -n "$changed" ]; then
              non_docs="$(printf '%s\n' "$changed" | grep -Ev '(^docs/specs/|^docs/handoffs/|\.md$)' || true)"
              release_surface="$(printf '%s\n' "$changed" | grep -E '^(CHANGELOG\.md|Cargo\.toml|Cargo\.lock|crates/ripr/Cargo\.toml|docs/OUTPUT_SCHEMA\.md)$' || true)"
              if [ -z "$non_docs" ] && [ -z "$release_surface" ]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          { echo "### Docs-Only Surface Detection"; echo ""; echo "- docs_only: \`$docs_only\`"; } >> "$GITHUB_STEP_SUMMARY"

  rust-cx43:
    name: Ripr Rust Small on CX43
    needs: [route, detect-docs-only]
    if: needs.route.outputs.router_target == 'cx43' && needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx43","rust-medium","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 35
      use-scratch: true
      artifact-name: ripr-rust-small-cx43
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  rust-cpx42:
    name: Ripr Rust Small on CPX42
    needs: [route, detect-docs-only]
    if: needs.route.outputs.router_target == 'cpx42' && needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cpx42","rust-medium","rust-16gb","trusted-pr"]}'
      cargo-build-jobs: "8"
      disk-guard-threshold: 35
      use-scratch: true
      artifact-name: ripr-rust-small-cpx42
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  rust-cx53:
    name: Ripr Rust Small on CX53
    needs: [route, detect-docs-only]
    if: needs.route.outputs.router_target == 'cx53' && needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx53","rust-large","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 50
      use-scratch: true
      artifact-name: ripr-rust-small-cx53
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  rust-github:
    name: Ripr Rust Small on GitHub Hosted
    needs: [route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53]
    if: >-
      always() &&
      needs.detect-docs-only.result == 'success' &&
      needs.detect-docs-only.outputs.docs_only != 'true' &&
      (needs.route.outputs.router_target == 'github' ||
      (needs.route.outputs.router_target == 'cx43' && needs.rust-cx43.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cpx42' && needs.rust-cpx42.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cx53' && needs.rust-cx53.outputs.scratch_status == 'tempfail'))
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '"ubuntu-latest"'
      cargo-build-jobs: "8"
      disk-guard-threshold: 0
      use-scratch: false
      artifact-name: ripr-rust-small-github
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  docs-gate:
    name: Ripr Docs Gate
    needs: [detect-docs-only]
    if: github.event_name == 'pull_request' && needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-docs-gate
      - name: Doc/spec gates (full precommit table)
        run: |
          cargo xtask precommit
          cargo xtask check-agent-skills
      - name: Upload docs-gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-docs-gate
          path: target/ripr/reports/
          if-no-files-found: ignore
          retention-days: 5

  result:
    name: ${{ github.event_name == 'pull_request' && (github.event.action == 'unlabeled' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) && 'Ripr Rust Small Ignored Label Event' || 'Ripr Rust Small Result' }}
    needs: [route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53, rust-github, docs-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize routed result
        env:
          TARGET: ${{ needs.route.outputs.router_target }}
          REASON: ${{ needs.route.outputs.router_reason }}
          ROUTE_RESULT: ${{ needs.route.result }}
          CX43_RESULT: ${{ needs.rust-cx43.result }}
          CPX42_RESULT: ${{ needs.rust-cpx42.result }}
          CX53_RESULT: ${{ needs.rust-cx53.result }}
          GITHUB_RESULT: ${{ needs.rust-github.result }}
          CX43_SCRATCH_STATUS: ${{ needs.rust-cx43.outputs.scratch_status }}
          CPX42_SCRATCH_STATUS: ${{ needs.rust-cpx42.outputs.scratch_status }}
          CX53_SCRATCH_STATUS: ${{ needs.rust-cx53.outputs.scratch_status }}
          CX43_SCRATCH_MESSAGE: ${{ needs.rust-cx43.outputs.scratch_message }}
          CPX42_SCRATCH_MESSAGE: ${{ needs.rust-cpx42.outputs.scratch_message }}
          CX53_SCRATCH_MESSAGE: ${{ needs.rust-cx53.outputs.scratch_message }}
          RUNNER_QUERY: ${{ needs.route.outputs.runner_query }}
          RUNNER_TOTAL: ${{ needs.route.outputs.runner_total }}
          CX43_ONLINE: ${{ needs.route.outputs.cx43_online }}
          CX43_IDLE_READY: ${{ needs.route.outputs.cx43_idle_ready }}
          CPX42_ONLINE: ${{ needs.route.outputs.cpx42_online }}
          CPX42_IDLE_READY: ${{ needs.route.outputs.cpx42_idle_ready }}
          CX53_ONLINE: ${{ needs.route.outputs.cx53_online }}
          CX53_IDLE_READY: ${{ needs.route.outputs.cx53_idle_ready }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          DOCS_DETECT_RESULT: ${{ needs.detect-docs-only.result }}
          DOCS_ONLY: ${{ needs.detect-docs-only.outputs.docs_only }}
          DOCS_GATE_RESULT: ${{ needs.docs-gate.result }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && { [ "$EVENT_ACTION" = "unlabeled" ] || { [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" != "full-ci" ]; }; }; then
            { echo "### Ripr Rust Small Ignored Label Event"; echo ""; echo "- action: \`$EVENT_ACTION\`"; echo "- label: \`${LABEL_NAME:-none}\`"; echo "- full gate: \`false\`"; echo "- required result: \`not posted\`"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=pass
          message="selected implementation job succeeded"
          if [ "$DOCS_DETECT_RESULT" != "success" ]; then
            status=fail
            message="docs-surface detection result was $DOCS_DETECT_RESULT"
          elif [ "$DOCS_ONLY" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$DOCS_GATE_RESULT" = "success" ]; then
              message="docs-only surface; heavy lanes skipped; docs-gate passed"
            else
              status=fail
              message="docs-gate result was $DOCS_GATE_RESULT on a docs-only PR"
            fi
          elif [ "$ROUTE_RESULT" != "success" ]; then
            status=fail
            message="route job result was $ROUTE_RESULT"
          else
            case "$TARGET" in
              cx43)
                if [ "$CX43_RESULT" = "success" ]; then
                  message="CX43 job succeeded"
                elif [ "$CX43_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ]; then
                  message="CX43 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CX43 job result was $CX43_RESULT"
                fi
                ;;
              cpx42)
                if [ "$CPX42_RESULT" = "success" ]; then
                  message="CPX42 job succeeded"
                elif [ "$CPX42_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ]; then
                  message="CPX42 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CPX42 job result was $CPX42_RESULT"
                fi
                ;;
              cx53)
                if [ "$CX53_RESULT" = "success" ]; then
                  message="CX53 job succeeded"
                elif [ "$CX53_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ]; then
                  message="CX53 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CX53 job result was $CX53_RESULT"
                fi
                ;;
              github) [ "$GITHUB_RESULT" = "success" ] || { status=fail; message="GitHub-hosted job result was $GITHUB_RESULT"; } ;;
              *) status=fail; message="unknown routed target: $TARGET" ;;
            esac
          fi
          echo "### Ripr Rust Small Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for row in "target:$TARGET" "reason:$REASON" "docs_detect:$DOCS_DETECT_RESULT" "docs_only:$DOCS_ONLY" "docs_gate:$DOCS_GATE_RESULT" "status:$status" "message:$message" "route:$ROUTE_RESULT" "cx43:$CX43_RESULT" "cpx42:$CPX42_RESULT" "cx53:$CX53_RESULT" "github:$GITHUB_RESULT" "cx43 scratch:$CX43_SCRATCH_STATUS" "cpx42 scratch:$CPX42_SCRATCH_STATUS" "cx53 scratch:$CX53_SCRATCH_STATUS" "cx43 scratch message:$CX43_SCRATCH_MESSAGE" "cpx42 scratch message:$CPX42_SCRATCH_MESSAGE" "cx53 scratch message:$CX53_SCRATCH_MESSAGE" "runner query:$RUNNER_QUERY" "visible runners:$RUNNER_TOTAL" "cx43 online:$CX43_ONLINE" "cx43 idle ready:$CX43_IDLE_READY" "cpx42 online:$CPX42_ONLINE" "cpx42 idle ready:$CPX42_IDLE_READY" "cx53 online:$CX53_ONLINE" "cx53 idle ready:$CX53_IDLE_READY"; do
            echo "- ${row%%:*}: \`${row#*:}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$status" = "pass" ]
