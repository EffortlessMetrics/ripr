name: Qualify source ripr-rs Python wheel (read-only)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mcp_evidence_pair:
        description: "Run the pinned #5407 evidence pair (advisory; no wheel qualification)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/python-wheel-qualification.yml"
      - ".github/workflows/publish-pypi.yml"
      - ".github/scripts/pypi_admission.py"
      - ".github/scripts/test_pypi_admission.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/ripr/**"
      - "fixtures/python/**"
      - "packaging/python/**"
      - "policy/dependency_allowlist.txt"
      - "policy/distribution.toml"
      - "policy/non-rust-allowlist.toml"
      - "policy/workflow_allowlist.txt"
      - "rust-toolchain.toml"
      - "xtask/**"

# This workflow builds and consumes local artifacts only. It cannot publish,
# mint an OIDC token, create a release, mutate a tag, or write repository data.
permissions:
  contents: read

concurrency:
  group: python-wheel-qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUST_TARGET: x86_64-unknown-linux-gnu
  MATURIN_VERSION: "1.14.1"
  TWINE_VERSION: "7.0.0"
  UV_VERSION: "0.12.19"
  PIP_VERSION: "26.2.1"
  PACKAGING_VERSION: "26.3"
  AUDITWHEEL_VERSION: "6.8.2"
  PATCHELF_VERSION: "0.19.1.0"
  TOMLI_VERSION: "2.2.1"

jobs:
  build-wheel:
    if: >-
      github.repository == 'EffortlessMetrics/ripr' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      !(github.event_name == 'workflow_dispatch' && inputs.mcp_evidence_pair)
    name: build and inspect Linux x64 wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      qualification_attempt: ${{ github.run_attempt }}
      native_version: ${{ steps.candidate.outputs.native_version }}
      python_version: ${{ steps.python_version.outputs.python_version }}
      payload_sha256: ${{ steps.validate.outputs.payload_sha256 }}
      wheel_sha256: ${{ steps.validate.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Test source publisher admission
        run: python3 -m unittest discover -s .github/scripts -p 'test_pypi_admission.py'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ env.RUST_TARGET }}

      - name: Bind exact source candidate and native version
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "EffortlessMetrics/ripr"
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA,,}"
          native_version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ripr") | .version')"
          test -n "${native_version}"
          echo "native_version=${native_version}" >> "${GITHUB_OUTPUT}"
          echo "RIPR_NATIVE_VERSION=${native_version}" >> "${GITHUB_ENV}"

      - name: Install pinned package tooling
        shell: bash
        run: |
          set -euo pipefail
          venv="${GITHUB_WORKSPACE}/target/ripr/python-build/venv"
          evidence="${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check --upgrade "pip==${PIP_VERSION}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check \
            "maturin==${MATURIN_VERSION}" \
            "twine==${TWINE_VERSION}" \
            "uv==${UV_VERSION}" \
            "packaging==${PACKAGING_VERSION}" \
            "auditwheel==${AUDITWHEEL_VERSION}" \
            "patchelf==${PATCHELF_VERSION}" \
            "tomli==${TOMLI_VERSION}"
          mkdir -p \
            "${evidence}/wheelhouse" \
            "${evidence}/broken/missing-script" \
            "${evidence}/broken/stale-record" \
            "${evidence}/tooling"
          "${venv}/bin/python" -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --dest "${evidence}/tooling" \
            "pip==${PIP_VERSION}" \
            "uv==${UV_VERSION}"
          "${venv}/bin/python" -VV
          "${venv}/bin/python" -m pip --version
          "${venv}/bin/python" -m maturin --version
          "${venv}/bin/python" -m twine --version
          "${venv}/bin/python" -m uv --version
          "${venv}/bin/python" -c 'import packaging; print(f"packaging {packaging.__version__}")'


      - name: Validate the binary adapter and notices
        shell: bash
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/target/ripr/python-build/venv/bin/python" - <<'PYCONTRACT'
          from pathlib import Path
          import tomli as tomllib
          root = Path.cwd()
          manifest = tomllib.loads((root / "packaging/python/pyproject.toml").read_text())
          project = manifest["project"]
          build = manifest["build-system"]
          adapter = manifest["tool"]["maturin"]
          assert project["name"] == "ripr-rs"
          assert project["dynamic"] == ["version"] and "version" not in project
          assert not project.get("dependencies") and not project.get("optional-dependencies")
          assert build == {"requires": ["maturin==1.14.1"], "build-backend": "maturin"}
          assert adapter["bindings"] == "bin"
          assert adapter["targets"] == [{"name": "ripr", "kind": "bin"}]
          assert adapter["manifest-path"] == "../../crates/ripr/Cargo.toml"
          assert adapter["locked"] is True and adapter["strip"] is True
          assert sorted(adapter["features"]) == ["lang-python", "lang-rust", "lang-typescript"]
          for license_name in ("LICENSE-MIT", "LICENSE-APACHE"):
              assert (root / license_name).read_bytes() == (root / "packaging/python" / license_name).read_bytes()
          PYCONTRACT

      - name: Resolve and cross-check Python distribution version
        id: python_version
        shell: bash
        run: |
          set -euo pipefail
          python="${GITHUB_WORKSPACE}/target/ripr/python-build/venv/bin/python"
          python_version="$(RIPR_NATIVE_VERSION="${RIPR_NATIVE_VERSION}" "${python}" - <<'PY'
          import os
          from packaging.version import Version

          cases = {
              "0.11.0": "0.11.0",
              "0.11.0-alpha.1": "0.11.0a1",
              "0.11.0-beta.2": "0.11.0b2",
              "0.11.0-rc.1": "0.11.0rc1",
          }
          for native, expected in cases.items():
              actual = Version(native).public
              assert actual == expected, (native, actual, expected)

          print(Version(os.environ["RIPR_NATIVE_VERSION"]).public)
          PY
          )"
          test -n "${python_version}"
          echo "python_version=${python_version}" >> "${GITHUB_OUTPUT}"
          echo "RIPR_PYTHON_VERSION=${python_version}" >> "${GITHUB_ENV}"

      - name: Build and audit the selected Linux x64 wheel
        shell: bash
        run: |
          set -euo pipefail
          python="${GITHUB_WORKSPACE}/target/ripr/python-build/venv/bin/python"
          cd packaging/python
          "${python}" -m maturin build \
            --release \
            --target "${RUST_TARGET}" \
            --compatibility linux \
            --out "${GITHUB_WORKSPACE}/target/ripr/python-unrepaired-wheelhouse"
          PATH="$(dirname "${python}"):${PATH}" "${python}" -m auditwheel repair \
            --plat manylinux_2_34_x86_64 \
            --wheel-dir "${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence/wheelhouse" \
            "${GITHUB_WORKSPACE}/target/ripr/python-unrepaired-wheelhouse/ripr_rs-${RIPR_PYTHON_VERSION}-py3-none-linux_x86_64.whl"
          "${python}" -m auditwheel show \
            "${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence/wheelhouse/ripr_rs-${RIPR_PYTHON_VERSION}-py3-none-manylinux_2_34_x86_64.whl" \
            | tee "${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence/auditwheel.txt"
          mapfile -t wheels < <(find "${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence/wheelhouse" -maxdepth 1 -type f -name '*.whl' -print | sort)
          test "${#wheels[@]}" = "1"
          test "$(basename "${wheels[0]}")" = "ripr_rs-${RIPR_PYTHON_VERSION}-py3-none-manylinux_2_34_x86_64.whl"
          test -z "$(find "${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence/wheelhouse" -maxdepth 1 -type f ! -name '*.whl' -print -quit)"

      - name: Validate metadata, RECORD, payload, and negative controls
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python="${GITHUB_WORKSPACE}/target/ripr/python-build/venv/bin/python"
          evidence="${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence"
          wheel="$(find "${evidence}/wheelhouse" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          "${python}" -m twine check --strict "${wheel}" | tee "${evidence}/twine-check.txt"

          export TOOL_PYTHON_VERSION
          export TOOL_PIP_VERSION
          export TOOL_MATURIN_VERSION
          export TOOL_TWINE_VERSION
          export TOOL_UV_VERSION
          export TOOL_PACKAGING_VERSION
          export CANDIDATE_TREE
          export CARGO_LOCK_SHA256
          export RUSTC_VERBOSE_VERSION
          export CARGO_VERBOSE_VERSION
          TOOL_PYTHON_VERSION="$("${python}" -VV 2>&1 | tr '\n' ' ')"
          TOOL_PIP_VERSION="$("${python}" -m pip --version)"
          TOOL_MATURIN_VERSION="$("${python}" -m maturin --version)"
          TOOL_TWINE_VERSION="$("${python}" -m twine --version | head -n 1)"
          TOOL_UV_VERSION="$("${python}" -m uv --version)"
          TOOL_PACKAGING_VERSION="$("${python}" -c 'import packaging; print(packaging.__version__)')"
          CANDIDATE_TREE="$(git rev-parse 'HEAD^{tree}')"
          CARGO_LOCK_SHA256="$(sha256sum Cargo.lock | awk '{print $1}')"
          RUSTC_VERBOSE_VERSION="$(rustc -vV)"
          CARGO_VERBOSE_VERSION="$(cargo -vV)"

          "${python}" - "${wheel}" "${evidence}" <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import json
          import os
          from email.parser import Parser
          from pathlib import Path, PurePosixPath
          import sys
          import zipfile

          wheel = Path(sys.argv[1])
          evidence = Path(sys.argv[2])
          expected_native_version = os.environ["RIPR_NATIVE_VERSION"]
          expected_python_version = os.environ["RIPR_PYTHON_VERSION"]
          expected_filename = f"ripr_rs-{expected_python_version}-py3-none-manylinux_2_34_x86_64.whl"

          def digest_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def validate(path: Path) -> dict[str, str]:
              assert path.name == expected_filename, f"unexpected wheel filename: {path.name}"
              with zipfile.ZipFile(path) as archive:
                  names = [info.filename for info in archive.infolist() if not info.is_dir()]
                  assert names, "wheel is empty"
                  for name in names:
                      pure = PurePosixPath(name)
                      assert not pure.is_absolute(), f"absolute wheel member: {name}"
                      assert ".." not in pure.parts, f"traversal wheel member: {name}"

                  scripts = [name for name in names if name.endswith(".data/scripts/ripr")]
                  assert len(scripts) == 1, f"expected exactly one ripr script, got {scripts}"
                  script = scripts[0]
                  script_info = archive.getinfo(script)
                  script_mode = script_info.external_attr >> 16
                  assert script_mode & 0o111, f"ripr script is not executable: mode={oct(script_mode)}"
                  script_bytes = archive.read(script)
                  assert script_bytes, "ripr script is empty"

                  metadata_paths = [name for name in names if name.endswith(".dist-info/METADATA")]
                  wheel_paths = [name for name in names if name.endswith(".dist-info/WHEEL")]
                  record_paths = [name for name in names if name.endswith(".dist-info/RECORD")]
                  assert len(metadata_paths) == len(wheel_paths) == len(record_paths) == 1
                  metadata_path = metadata_paths[0]
                  wheel_path = wheel_paths[0]
                  record_path = record_paths[0]

                  metadata = Parser().parsestr(archive.read(metadata_path).decode("utf-8"))
                  assert metadata["Name"] == "ripr-rs"
                  assert metadata["Version"] == expected_python_version
                  assert metadata["Requires-Python"] == ">=3.10"
                  assert metadata["License-Expression"] == "MIT OR Apache-2.0"
                  assert not metadata.get_all("Requires-Dist"), "native wheel acquired runtime dependencies"

                  wheel_metadata = archive.read(wheel_path).decode("utf-8")
                  tags = [
                      line.removeprefix("Tag: ")
                      for line in wheel_metadata.splitlines()
                      if line.startswith("Tag: ")
                  ]
                  assert tags == ["py3-none-manylinux_2_34_x86_64"], f"unexpected wheel tags: {tags}"
                  assert not any(tag.endswith("-any") for tag in tags)

                  license_mit = [name for name in names if PurePosixPath(name).name == "LICENSE-MIT"]
                  license_apache = [
                      name for name in names if PurePosixPath(name).name == "LICENSE-APACHE"
                  ]
                  assert len(license_mit) == len(license_apache) == 1
                  assert archive.read(license_mit[0]) == Path("LICENSE-MIT").read_bytes()
                  assert archive.read(license_apache[0]) == Path("LICENSE-APACHE").read_bytes()

                  record_rows = list(csv.reader(io.StringIO(archive.read(record_path).decode("utf-8"))))
                  record = {row[0]: row[1:] for row in record_rows}
                  assert set(names) == set(record), "RECORD inventory does not equal archive inventory"
                  for name in names:
                      digest, size = record[name]
                      if name == record_path:
                          assert digest == size == ""
                          continue
                      payload = archive.read(name)
                      expected_digest = (
                          base64.urlsafe_b64encode(hashlib.sha256(payload).digest())
                          .rstrip(b"=")
                          .decode("ascii")
                      )
                      assert digest == f"sha256={expected_digest}", f"RECORD digest mismatch for {name}"
                      assert size == str(len(payload)), f"RECORD size mismatch for {name}"

                  return {
                      "script_path": script,
                      "script_sha256": digest_bytes(script_bytes),
                      "wheel_tag": tags[0],
                  }

          positive = validate(wheel)

          missing_script = evidence / "broken" / "missing-script" / wheel.name
          with zipfile.ZipFile(wheel) as source, zipfile.ZipFile(missing_script, "w") as destination:
              for info in source.infolist():
                  if info.filename == positive["script_path"]:
                      continue
                  destination.writestr(info, source.read(info.filename))
          try:
              validate(missing_script)
          except AssertionError as error:
              missing_script_result = str(error)
              assert "exactly one ripr script" in missing_script_result
          else:
              raise AssertionError("wheel validator accepted a wheel with its ripr executable removed")

          stale_record = evidence / "broken" / "stale-record" / wheel.name
          with zipfile.ZipFile(wheel) as source, zipfile.ZipFile(stale_record, "w") as destination:
              for info in source.infolist():
                  payload = source.read(info.filename)
                  if info.filename == positive["script_path"]:
                      payload += b"\nrecord-negative-control\n"
                  destination.writestr(info, payload)
          try:
              validate(stale_record)
          except AssertionError as error:
              stale_record_result = str(error)
              assert "RECORD digest mismatch" in stale_record_result
          else:
              raise AssertionError("wheel validator accepted payload bytes with a stale RECORD")

          receipt = {
              "schema_version": 2,
              "channel": "pypi-source-wheelhouse",
              "source_repository": "EffortlessMetrics/ripr",
              "producer_run_id": os.environ["GITHUB_RUN_ID"],
              "producer_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "publication_attempted": False,
              "candidate_sha": os.environ["CANDIDATE_SHA"].lower(),
              "candidate_tree": os.environ["CANDIDATE_TREE"],
              "cargo_lock_sha256": os.environ["CARGO_LOCK_SHA256"],
              "native_version": expected_native_version,
              "python_version": expected_python_version,
              "distribution": "ripr-rs",
              "executable": "ripr",
              "rust_target": os.environ["RUST_TARGET"],
              "compatibility_state": "auditwheel_manylinux_2_34",
              "native_execution": "ubuntu-22.04-x64",
              "scope": "linux-x64-glibc-only",
              "features": ["lang-python", "lang-rust", "lang-typescript"],
              "wheel": {
                  "filename": wheel.name,
                  "sha256": digest_bytes(wheel.read_bytes()),
                  "tag": positive["wheel_tag"],
                  "installed_payload_sha256": positive["script_sha256"],
              },
              "negative_controls": [
                  {
                      "mutation": "removed .data/scripts/ripr",
                      "result": missing_script_result,
                  },
                  {
                      "mutation": "mutated .data/scripts/ripr without updating RECORD",
                      "result": stale_record_result,
                  },
              ],
              "toolchain": {
                  "rustc": os.environ["RUSTC_VERBOSE_VERSION"],
                  "cargo": os.environ["CARGO_VERBOSE_VERSION"],
                  "python": os.environ["TOOL_PYTHON_VERSION"],
                  "pip": os.environ["TOOL_PIP_VERSION"],
                  "maturin": os.environ["TOOL_MATURIN_VERSION"],
                  "twine": os.environ["TOOL_TWINE_VERSION"],
                  "uv": os.environ["TOOL_UV_VERSION"],
                  "packaging": os.environ["TOOL_PACKAGING_VERSION"],
                  "auditwheel": os.environ["AUDITWHEEL_VERSION"],
                  "patchelf": os.environ["PATCHELF_VERSION"],
              },
              "runner": {
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
                  "image_os": os.environ.get("ImageOS"),
                  "image_version": os.environ.get("ImageVersion"),
              },
          }
          (evidence / "wheel-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          qualification = {
              "schema_version": 1,
              "source_sha": receipt["candidate_sha"],
              "source_tree": receipt["candidate_tree"],
              "version": expected_python_version,
              "native_version": expected_native_version,
              "wheel_filename": wheel.name,
              "wheel_sha256": receipt["wheel"]["sha256"],
              "repository": "EffortlessMetrics/ripr",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "target": "x86_64-unknown-linux-gnu",
              "platform_tag": "py3-none-manylinux_2_34_x86_64",
          }
          (evidence / "qualification.json").write_text(
              json.dumps(qualification, indent=2) + "\n", encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2))
          PY

          {
            echo "payload_sha256=$(jq -er '.wheel.installed_payload_sha256' "${evidence}/wheel-receipt.json")"
            echo "wheel_sha256=$(jq -er '.wheel.sha256' "${evidence}/wheel-receipt.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Package independent Python consumer fixture
        shell: bash
        run: |
          set -euo pipefail
          evidence="${GITHUB_WORKSPACE}/target/ripr/python-wheel-evidence"
          tar -czf "${evidence}/python-basic-fixture.tar.gz" \
            -C "${GITHUB_WORKSPACE}" \
            fixtures/python/basic
          tar -tzf "${evidence}/python-basic-fixture.tar.gz" \
            | grep -Fx 'fixtures/python/basic/diff.patch'

      - name: Upload no-publish wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-qualified-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ripr/python-wheel-evidence/
          if-no-files-found: error
          retention-days: 5

      - name: Retain bounded native input for npm qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-native-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ripr/python-wheel-evidence/qualification.json
            target/ripr/python-wheel-evidence/wheel-receipt.json
            target/ripr/python-wheel-evidence/wheelhouse/
          if-no-files-found: error
          retention-days: 5

  consume:
    name: clean ${{ matrix.client }} install and useful Python journey
    needs: build-wheel
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        client: [pip, uv]
    env:
      RIPR_NATIVE_VERSION: ${{ needs.build-wheel.outputs.native_version }}
      RIPR_PYTHON_VERSION: ${{ needs.build-wheel.outputs.python_version }}
      EXPECTED_PAYLOAD_SHA256: ${{ needs.build-wheel.outputs.payload_sha256 }}
      EXPECTED_WHEEL_SHA256: ${{ needs.build-wheel.outputs.wheel_sha256 }}
    steps:
      - name: Require full qualification rerun
        env:
          BUILT_ATTEMPT: ${{ needs.build-wheel.outputs.qualification_attempt }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          if test -z "$BUILT_ATTEMPT" || test -z "$CURRENT_ATTEMPT" || test "$BUILT_ATTEMPT" != "$CURRENT_ATTEMPT"; then
            echo "::error::Qualification cannot reuse a build from another attempt. Select Re-run all jobs, not Re-run failed jobs."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-qualified-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Install from the local wheelhouse without Rust or source checkout
        shell: bash
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          base_path="/usr/bin:/bin"
          wheel="$(find evidence/wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          test "$(sha256sum "${wheel}" | awk '{print $1}')" = "${EXPECTED_WHEEL_SHA256}"
          if env -i HOME="${HOME}" PATH="${base_path}" bash -c \
            'command -v cargo >/dev/null || command -v rustc >/dev/null || command -v ripr >/dev/null'; then
            echo "::error::clean consumer inherited Cargo, rustc, or ripr" >&2
            exit 1
          fi

          planted="${RUNNER_TEMP}/planted-${CLIENT}"
          planted_marker="${RUNNER_TEMP}/planted-${CLIENT}-executed"
          mkdir -p "${planted}"
          cat > "${planted}/ripr" <<SH
          #!/usr/bin/env bash
          printf 'planted PATH ripr was executed\n' > "${planted_marker}"
          exit 97
          SH
          chmod +x "${planted}/ripr"

          if [ "${CLIENT}" = pip ]; then
            venv="${RUNNER_TEMP}/pip-consumer"
            python3 -m venv "${venv}"
            "${venv}/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-index \
              --find-links evidence/tooling \
              "pip==${PIP_VERSION}"
            "${venv}/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-index \
              --find-links evidence/wheelhouse \
              "ripr-rs==${RIPR_PYTHON_VERSION}"
            executable="${venv}/bin/ripr"
            consumer_path="${venv}/bin:${planted}:${base_path}"
            consumer_python="${venv}/bin/python"
          else
            bootstrap="${RUNNER_TEMP}/uv-bootstrap"
            tool_dir="${RUNNER_TEMP}/uv-tools"
            tool_bin="${RUNNER_TEMP}/uv-bin"
            cache_dir="${RUNNER_TEMP}/uv-cache"
            python3 -m venv "${bootstrap}"
            "${bootstrap}/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-index \
              --find-links evidence/tooling \
              "pip==${PIP_VERSION}" \
              "uv==${UV_VERSION}"
            uv_version="$("${bootstrap}/bin/python" -m uv --version)"
            [[ "${uv_version}" == "uv ${UV_VERSION}"* ]]
            mkdir -p "${tool_bin}"
            UV_OFFLINE=1 \
            UV_TOOL_DIR="${tool_dir}" \
            UV_TOOL_BIN_DIR="${tool_bin}" \
            UV_CACHE_DIR="${cache_dir}" \
              "${bootstrap}/bin/python" -m uv tool install "${wheel}"
            executable="${tool_bin}/ripr"
            consumer_path="${tool_bin}:${planted}:${bootstrap}/bin:${base_path}"
            consumer_python="${bootstrap}/bin/python"
            {
              echo "UV_TOOL_DIR=${tool_dir}"
              echo "UV_TOOL_BIN_DIR=${tool_bin}"
              echo "UV_CACHE_DIR=${cache_dir}"
            } >> "${GITHUB_ENV}"
          fi

          printf 'post-install[%s] check=installed-path\n' "${CLIENT}"
          resolve_status=0
          resolved="$(env -i HOME="${HOME}" PATH="${consumer_path}" bash -c 'command -v ripr')" \
            || resolve_status=$?
          printf 'post-install[%s] installed-path status=%s expected=<%s> actual=<%s>\n' \
            "${CLIENT}" "${resolve_status}" "${executable}" "${resolved}"
          # The original assignment under errexit required command resolution to succeed.
          test "${resolve_status}" -eq 0
          test "${resolved}" = "${executable}"

          printf 'post-install[%s] check=installed-payload-sha256\n' "${CLIENT}"
          if installed_payload_sha="$(sha256sum "${resolved}" | awk '{print $1}')"; then
            digest_status=0
          else
            digest_status=$?
          fi
          printf 'post-install[%s] installed-payload-sha256 status=%s expected=<%s> actual=<%s>\n' \
            "${CLIENT}" "${digest_status}" "${EXPECTED_PAYLOAD_SHA256}" "${installed_payload_sha}"
          test "${installed_payload_sha}" = "${EXPECTED_PAYLOAD_SHA256}"

          printf 'post-install[%s] check=installed-native-version\n' "${CLIENT}"
          version_stdout="${RUNNER_TEMP}/${CLIENT}-installed-native-version.stdout"
          version_stderr="${RUNNER_TEMP}/${CLIENT}-installed-native-version.stderr"
          if env -i HOME="${HOME}" PATH="${consumer_path}" ripr --version \
            > "${version_stdout}" 2> "${version_stderr}"; then
            version_status=0
          else
            version_status=$?
          fi
          installed_native_version="$(cat "${version_stdout}")"
          printf 'post-install[%s] installed-native-version status=%s expected=<%s> actual=<%s>\n' \
            "${CLIENT}" "${version_status}" "ripr ${RIPR_NATIVE_VERSION} (${CANDIDATE_SHA,,})" "${installed_native_version}"
          printf 'post-install[%s] installed-native-version stderr follows\n' "${CLIENT}" >&2
          cat "${version_stderr}" >&2
          test "${installed_native_version}" = "ripr ${RIPR_NATIVE_VERSION} (${CANDIDATE_SHA,,})"

          printf 'post-install[%s] check=planted-executable-not-run path=<%s>\n' \
            "${CLIENT}" "${planted_marker}"
          if test -e "${planted_marker}"; then
            printf 'post-install[%s] planted-marker present\n' "${CLIENT}"
          else
            printf 'post-install[%s] planted-marker absent\n' "${CLIENT}"
          fi
          test ! -e "${planted_marker}"
          {
            echo "CLIENT=${CLIENT}"
            echo "CONSUMER_EXECUTABLE=${executable}"
            echo "CONSUMER_PATH=${consumer_path}"
            echo "CONSUMER_PYTHON=${consumer_python}"
            echo "PLANTED_DIR=${planted}"
            echo "PLANTED_MARKER=${planted_marker}"
            echo "WHEEL_PATH=${wheel}"
          } >> "${GITHUB_ENV}"

      - name: Run no-config Python preview, fresh-shell follow-up, and disable control
        shell: bash
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/${CLIENT} consumer ü"
          fixture="${project}/fixtures/python/basic"
          check_json="${RUNNER_TEMP}/${CLIENT}-python-check.json"
          disabled_json="${RUNNER_TEMP}/${CLIENT}-python-disabled.json"
          explain_text="${RUNNER_TEMP}/${CLIENT}-python-explain.txt"
          project_marker="${RUNNER_TEMP}/${CLIENT}-project-python-executed"
          mkdir -p "${project}"
          tar -xzf evidence/python-basic-fixture.tar.gz -C "${project}"
          mkdir -p "${fixture}/.venv/bin"
          cat > "${fixture}/.venv/bin/python" <<SH
          #!/usr/bin/env bash
          printf 'project virtualenv was executed\n' > "${project_marker}"
          exit 98
          SH
          chmod +x "${fixture}/.venv/bin/python"

          env -i \
            HOME="${HOME}" \
            PATH="${CONSUMER_PATH}" \
            HTTP_PROXY="http://127.0.0.1:9" \
            HTTPS_PROXY="http://127.0.0.1:9" \
            NO_PROXY="" \
            ripr check \
              --root "${fixture}" \
              --diff "${fixture}/diff.patch" \
              --mode fast \
              --json > "${check_json}"
          jq -e '
            .summary.changed_rust_files == 0
            and .summary.probes > 0
            and .summary.findings > 0
            and (.findings | length) > 0
            and any(.summary.changed_files_by_language[]?;
              .language == "python" and .files == 1)
            and any(.preview_languages[]?;
              .language == "python"
              and .enabled == true
              and .analyzed == true
              and .category == "preview_language_advisory")
            and .findings[0].language == "python"
            and .findings[0].language_status == "preview"
          ' "${check_json}" >/dev/null
          finding_id="$(jq -er '.findings[0].id' "${check_json}")"
          env -i \
            HOME="${HOME}" \
            PATH="${CONSUMER_PATH}" \
            PROJECT="${fixture}" \
            FINDING_ID="${finding_id}" \
            EXPLAIN_TEXT="${explain_text}" \
            bash --noprofile --norc -c '
              cd "${PROJECT}"
              ripr explain \
                --root . \
                --diff diff.patch \
                --mode fast \
                "${FINDING_ID}" > "${EXPLAIN_TEXT}"
            '
          test -s "${explain_text}"
          grep -F "${finding_id}" "${explain_text}"
          test ! -e "${project_marker}"
          test ! -e "${PLANTED_MARKER}"

          cat > "${fixture}/ripr.toml" <<'EOF'
          [languages]
          enabled = ["rust"]
          EOF
          env -i HOME="${HOME}" PATH="${CONSUMER_PATH}" \
            ripr check \
              --root "${fixture}" \
              --diff "${fixture}/diff.patch" \
              --mode fast \
              --json > "${disabled_json}"
          jq -e '
            .summary.probes == 0
            and .summary.findings == 0
            and .analysis_outcome.analysis_complete == false
            and any(.analysis_outcome.outcome.limitations[]?;
              .kind == "language_adapter_unavailable")
            and any(.preview_languages[]?;
              .language == "python"
              and .enabled == false
              and .analyzed == false
              and (.why | contains("empty result is not Rust-grade clean")))
          ' "${disabled_json}" >/dev/null
          echo "PROJECT_FIXTURE=${fixture}" >> "${GITHUB_ENV}"

      - name: Reinstall and uninstall cleanly
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CLIENT}" = pip ]; then
            "${CONSUMER_PYTHON}" -m pip install \
              --disable-pip-version-check \
              --force-reinstall \
              --no-index \
              --find-links evidence/wheelhouse \
              "ripr-rs==${RIPR_PYTHON_VERSION}"
            test "$(sha256sum "${CONSUMER_EXECUTABLE}" | awk '{print $1}')" = \
              "${EXPECTED_PAYLOAD_SHA256}"
            "${CONSUMER_PYTHON}" -m pip uninstall -y ripr-rs
            if "${CONSUMER_PYTHON}" -m pip show ripr-rs >/dev/null 2>&1; then
              echo "::error::ripr-rs remained installed after uninstall" >&2
              exit 1
            fi
          else
            UV_OFFLINE=1 \
            UV_TOOL_DIR="${UV_TOOL_DIR}" \
            UV_TOOL_BIN_DIR="${UV_TOOL_BIN_DIR}" \
            UV_CACHE_DIR="${UV_CACHE_DIR}" \
              "${CONSUMER_PYTHON}" -m uv tool install --force "${WHEEL_PATH}"
            test "$(sha256sum "${CONSUMER_EXECUTABLE}" | awk '{print $1}')" = \
              "${EXPECTED_PAYLOAD_SHA256}"
            UV_OFFLINE=1 \
            UV_TOOL_DIR="${UV_TOOL_DIR}" \
            UV_TOOL_BIN_DIR="${UV_TOOL_BIN_DIR}" \
            UV_CACHE_DIR="${UV_CACHE_DIR}" \
              "${CONSUMER_PYTHON}" -m uv tool uninstall ripr-rs
          fi
          test ! -e "${CONSUMER_EXECUTABLE}"
          test "$(env -i HOME="${HOME}" PATH="${CONSUMER_PATH}" bash -c 'command -v ripr')" = \
            "${PLANTED_DIR}/ripr"
          test -f "${PROJECT_FIXTURE}/src/pricing.py"
          test ! -e "${PLANTED_MARKER}"

  # #5301 item 3: a pinned proof run, not another benchmark policy owner.
  # Both release subjects are built sequentially on this existing hosted runner.
  # Runtime data describes this runner; it is never 5700X or release qualification.
  mcp-evidence-pair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mcp_evidence_pair }}
    name: pinned MCP evidence before and after (advisory)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BASELINE_SHA: 9acf0b6630fc21101baa0bbf52cc872dfe3b08a2
      BASELINE_TREE: 46b1bb84c70628cc7a64e79484c0c37f9a7c47c6
      PAIR_CANDIDATE_SHA: fab7fd03b478c30faa13db432eccbf0c0a76575f
      PAIR_CANDIDATE_TREE: 1762a35e687e29f7eaa4dc458d0476b68b876c29
      CORPUS_SHA: e621bd35ddddcd8b2f39d80b9f5938583571a87d
      CORPUS_TREE: 7e4a98f93d3d68aa41a10c22ee88ec90317e28dc
      CORPUS_BASE: 917a16932009c1957f53c2ea325663948add2153
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: pair-source/baseline
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PAIR_CANDIDATE_SHA }}
          path: pair-source/candidate
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dtolnay/anyhow
          ref: ${{ env.CORPUS_SHA }}
          fetch-depth: 2
          path: pair/anyhow
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ env.RUST_TARGET }}

      - name: Verify exact subjects and build two release executables sequentially
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "EffortlessMetrics/ripr-swarm"
          command -v python3
          test -x /usr/bin/time
          command -v strip
          test -r /proc/self/stat
          test -r /proc/self/status
          test "$(git -C pair/anyhow rev-parse HEAD)" = "${CORPUS_SHA}"
          test "$(git -C pair/anyhow rev-parse 'HEAD^{tree}')" = "${CORPUS_TREE}"
          test "$(git -C pair/anyhow rev-parse HEAD^)" = "${CORPUS_BASE}"
          git -C pair/anyhow update-ref refs/remotes/origin/main "${CORPUS_BASE}"
          test -z "$(git -C pair/anyhow status --porcelain)"
          for kind in baseline candidate; do
            if test "${kind}" = baseline; then
              expected_sha="${BASELINE_SHA}"
              expected_tree="${BASELINE_TREE}"
            else
              expected_sha="${PAIR_CANDIDATE_SHA}"
              expected_tree="${PAIR_CANDIDATE_TREE}"
            fi
            source="${GITHUB_WORKSPACE}/pair-source/${kind}"
            test "$(git -C "${source}" rev-parse HEAD)" = "${expected_sha}"
            test "$(git -C "${source}" rev-parse 'HEAD^{tree}')" = "${expected_tree}"
            test "$(sha256sum "${source}/Cargo.lock" | awk '{print $1}')" = 5d89ada8888aa3a1ee0982548261adcec98d7c44a49b4ab1c45d4b56b9c018e5
            target="${RUNNER_TEMP}/mcp-evidence-pair/${kind}"
            mkdir -p "${GITHUB_WORKSPACE}/pair/${kind}"
            (cd "${source}" && CARGO_TARGET_DIR="${target}" cargo build \
              --locked --release --target "${RUST_TARGET}" -p ripr --bin ripr \
              --features lang-python,lang-rust,lang-typescript)
            cp "${target}/${RUST_TARGET}/release/ripr" "${GITHUB_WORKSPACE}/pair/${kind}/ripr"
            strip "${GITHUB_WORKSPACE}/pair/${kind}/ripr"
          done
          for path in rust-toolchain.toml packaging/python/pyproject.toml Cargo.lock Cargo.toml crates/ripr/Cargo.toml; do
            cmp "pair-source/baseline/${path}" "pair-source/candidate/${path}"
          done
          rustc -vV > pair/rustc-version.txt
          cargo -vV > pair/cargo-version.txt
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          root = Path('pair')
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          bindings = {
              'schema_version': 'mcp-evidence-pair-v1',
              'workflow_sha': os.environ['GITHUB_SHA'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'runner': {'os': os.environ['RUNNER_OS'], 'arch': os.environ['RUNNER_ARCH'],
                         'image': os.environ.get('ImageVersion'), 'platform': platform.platform(),
                         'cpu_model': next((l.split(':',1)[1].strip() for l in Path('/proc/cpuinfo').read_text().splitlines() if l.startswith('model name')), 'unavailable')},
              'corpus': {'source': os.environ['CORPUS_SHA'], 'tree': os.environ['CORPUS_TREE'],
                         'base': os.environ['CORPUS_BASE']},
              'build': {'rustc': (root/'rustc-version.txt').read_text(),
                        'cargo': (root/'cargo-version.txt').read_text(),
                        'target': os.environ['RUST_TARGET'], 'profile': 'release',
                        'features': ['lang-python','lang-rust','lang-typescript'],
                        'locked': True, 'stripped': True, 'jobs': 2},
              'allocation': 'unavailable: no qualified observer',
              'cache': 'explicit shared app cache, no OS cache flush; first refresh is application-new only',
          }
          for kind, prefix in [('baseline','BASELINE'),('candidate','PAIR_CANDIDATE')]:
              source = Path('pair-source')/kind
              bindings[kind] = {'source': os.environ[prefix+'_SHA'], 'tree': os.environ[prefix+'_TREE'],
                  'payload_sha256': digest(root/kind/'ripr'),
                  'payload_bytes': (root/kind/'ripr').stat().st_size,
                  'inputs_sha256': {str(p): digest(source/p) for p in [Path('Cargo.lock'),
                      Path('Cargo.toml'),Path('crates/ripr/Cargo.toml'),
                      Path('rust-toolchain.toml'),Path('packaging/python/pyproject.toml')]}}
          (root/'bindings.json').write_text(json.dumps(bindings,indent=2)+'\n')
          PY

      - name: Prepare bounded paired observer definitions
        shell: bash
        run: |
          set -euo pipefail
          cat > pair/measure.py <<'PY'
          import os,json,time,threading,queue,subprocess,hashlib,resource,copy,signal
          from pathlib import Path
          ROOT=Path(__file__).resolve().parent;CORPUS=ROOT/'anyhow';OUT=ROOT/'measurement';OUT.mkdir(exist_ok=True)
          HZ=os.sysconf('SC_CLK_TCK');COUNT=3;DEADLINE=float('inf');FIRST_SAMPLE=None;GROUPS=set()
          def terminated(signum,frame):raise TimeoutError('outer measurement deadline')
          signal.signal(signal.SIGTERM,terminated)
          RSS_LIMIT=4*1024**3
          def clear_group(p):
              try:os.killpg(p.pid,signal.SIGKILL)
              except ProcessLookupError:pass
              p.wait(timeout=5)
          def live_groups():
              live=[]
              for group in GROUPS:
                  try:os.killpg(group,0)
                  except ProcessLookupError:continue
                  live.append(group)
              return live
          def host_guard():
              if time.monotonic()>DEADLINE:raise RuntimeError('20min measurement deadline')
              heavy=[]
              for pid in os.listdir('/proc'):
                  if not pid.isdigit():continue
                  try:comm=Path('/proc',pid,'comm').read_text().strip()
                  except OSError:continue
                  if comm in ['cargo','rustc','clippy-driver','cc1','cc1plus','ld'] or comm.startswith(('ripr','perl-lsp','perl_lsp')):
                      heavy.append({'pid':int(pid),'comm':comm})
              available=next(int(l.split()[1])*1024 for l in Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:'))
              fs=os.statvfs(ROOT)
              h={'available_ram_bytes':available,'disk_free_bytes':fs.f_bavail*fs.f_frsize,'heavy':heavy,'load_average':os.getloadavg()}
              if available<2*1024**3 or h['disk_free_bytes']<2*1024**3 or heavy:raise RuntimeError('host fence failed: '+json.dumps(h))
              return h

          def retain(path,data,append=False,critical=False):
              if isinstance(data,str):data=data.encode('utf-8')
              used=sum(p.stat().st_size for p in OUT.rglob('*') if p.is_file())
              replaced=0 if append or not path.exists() else path.stat().st_size
              cap=(64*1024**2-65536) if critical else 60*1024**2
              if used-replaced+len(data)>cap:raise RuntimeError('projected evidence cap exceeded')
              with path.open('ab' if append else 'wb') as f:f.write(data)
          def emit(x):
              encoded=json.dumps(x)
              retain(OUT/'raw.jsonl',encoded+'\n',True,x['type'] in ['block_result','terminal_release'])
              print(encoded,flush=True)

          def begin_sample():
              global FIRST_SAMPLE,DEADLINE
              if FIRST_SAMPLE is None:
                  FIRST_SAMPLE=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
                  DEADLINE=time.monotonic()+1200
                  emit({'type':'first_sample','utc':FIRST_SAMPLE,'max_block_seconds':1200})
          def limit():
              os.setsid()
              resource.setrlimit(resource.RLIMIT_AS,(RSS_LIMIT,RSS_LIMIT))
          def stat(pid):
              raw=Path('/proc',str(pid),'stat').read_text(); f=raw[raw.rfind(')')+2:].split()
              st=Path('/proc',str(pid),'status').read_text()
              hwm=next(int(l.split()[1])*1024 for l in st.splitlines() if l.startswith('VmHWM:'))
              if hwm>RSS_LIMIT:raise RuntimeError('RSS admission exceeded')
              return {'pid':pid,'start_ticks':int(f[19]),'user_ticks':int(f[11]),'system_ticks':int(f[12]),'peak_rss_bytes':hwm,'tick_hz':HZ}
          def canon(x):return json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          def capture(p):
              buffers=[bytearray(),bytearray()];failures=[];error=None
              def read(stream,index,cap):
                  for chunk in iter(lambda:stream.read(4096),b''):
                      room=cap-len(buffers[index]);buffers[index].extend(chunk[:room])
                      if len(chunk)>room:
                          failures.append('stdout' if index==0 else 'stderr');clear_group(p);break
              threads=[threading.Thread(target=read,args=(stream,index,cap),daemon=True) for stream,index,cap in [(p.stdout,0,16*1024**2),(p.stderr,1,1024**2)]]
              for thread in threads:thread.start()
              try:p.wait(timeout=30)
              except BaseException as e:
                  error=e;clear_group(p)
              finally:
                  for thread in threads:thread.join(timeout=2)
              if any(thread.is_alive() for thread in threads):failures.append('unfinished capture reader');clear_group(p)
              return bytes(buffers[0]),bytes(buffers[1]),failures,error
          def cli(kind,args,label):
              host_guard();t=ROOT/(label+'-'+kind+'-time.json')
              cmd=['/usr/bin/time','-q','-f','{"user_seconds":%U,"system_seconds":%S,"max_rss_kib":%M}','-o',str(t),str(ROOT/kind/'ripr')]+args
              begin_sample();start=time.monotonic_ns()
              p=subprocess.Popen(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,cwd=CORPUS,env=os.environ|{'RIPR_CACHE_DIR':str(ROOT/'cache'),'RIPR_REPO_EXPOSURE_SEAM_LIMIT':'10000'},preexec_fn=limit)
              GROUPS.add(p.pid)
              stdout,stderr,overflow,error=capture(p)
              wall=time.monotonic_ns()-start
              retain(OUT/(label+'-'+kind+'-stdout'),stdout);retain(OUT/(label+'-'+kind+'-stderr'),stderr)
              try:
                  envelope=json.loads(stdout);output_valid=envelope['analysis_outcome']['analysis_complete'] is True and len(envelope['findings'])==6
              except (ValueError,UnicodeError,KeyError,TypeError):output_valid=False
              raw=t.read_bytes() if t.exists() else b'';retain(OUT/t.name,raw)
              try:metrics={'state':'observed','values':json.loads(raw)}
              except (ValueError,UnicodeError):metrics={'state':'unavailable','reason':'GNU time did not emit valid JSON'}
              emit({'type':'cli','kind':kind,'label':label,'performance_eligible':metrics['state']=='observed' and output_valid and not overflow and error is None and p.returncode==0,'wall_ns':wall,'exit_code':p.returncode,'output_valid':output_valid,'lifetime':metrics,'capture_overflow':overflow,'capture_error':repr(error) if error else None,'stdout_sha256':hashlib.sha256(stdout).hexdigest(),'stderr_sha256':hashlib.sha256(stderr).hexdigest()})
              if error:raise error
              if not output_valid or overflow or p.returncode:raise RuntimeError('invalid CLI sample: '+str((p.returncode,overflow,output_valid)))
              host_guard();return stdout,stderr,p.returncode
          class Session:
              def __init__(self,kind,label):
                  host_guard()
                  begin_sample()
                  self.kind=kind;self.label=label;self.id=0;self.q=queue.Queue(maxsize=128);self.err=bytearray();self.responses=[]
                  env=os.environ.copy()
                  env['RIPR_CACHE_DIR']=str(ROOT/'cache')
                  env['RIPR_REPO_EXPOSURE_SEAM_LIMIT']='10000'
                  self.p=subprocess.Popen([str(ROOT/kind/'ripr'),'mcp','--stdio','--root',str(CORPUS)],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,preexec_fn=limit)
                  self.case_deadline=time.monotonic()+30;self.failed=False
                  GROUPS.add(self.p.pid)
                  self.pid=self.p.pid
                  try:self.bound=stat(self.pid)['start_ticks']
                  except BaseException:
                      clear_group(self.p);raise
                  def readout():
                      while True:
                          line=self.p.stdout.readline(128*1024+1)
                          if not line:break
                          if len(line)>128*1024:
                              self.q.put(RuntimeError('MCP response exceeds 128KiB wire bound'));break
                          try:self.q.put(json.loads(line))
                          except Exception as e:self.q.put(e)
                  def readerr():
                      for b in iter(lambda:self.p.stderr.read(4096),b''):
                          room=1048576-len(self.err);self.err.extend(b[:room])
                          if len(b)>room:
                              clear_group(self.p);break
                  self.threads=[threading.Thread(target=readout,daemon=True),threading.Thread(target=readerr,daemon=True)]
                  for t in self.threads:t.start()
              def call(self,method,params={},label=None,allow_error=False):
                  if time.monotonic()>DEADLINE:raise RuntimeError('block deadline')
                  if time.monotonic()>=self.case_deadline:
                      clear_group(self.p);raise TimeoutError('30s subject case deadline')
                  self.id+=1;req={'jsonrpc':'2.0','id':self.id,'method':method,'params':params}
                  before=stat(self.pid);start=time.monotonic_ns()
                  self.p.stdin.write((json.dumps(req,separators=(',',':'))+'\n').encode());self.p.stdin.flush()
                  end=min(time.monotonic()+30,self.case_deadline)
                  while True:
                      remaining=end-time.monotonic()
                      if remaining<=0:raise TimeoutError('absolute 30s matching-response deadline')
                      x=self.q.get(timeout=remaining)
                      if isinstance(x,Exception):raise x
                      if x.get('id')==self.id:break
                  wall=time.monotonic_ns()-start;after=stat(self.pid)
                  if after['start_ticks']!=self.bound:raise RuntimeError('PID rebound')
                  self.responses.append(req|{'response':x})
                  emit({'type':'rpc','kind':self.kind,'session':self.label,'method':method,'label':label or method,'performance_eligible':not allow_error,'wall_ns':wall,'wall_scope':'before-request-write-through-matching-parsed-response','user_ticks':after['user_ticks']-before['user_ticks'],'system_ticks':after['system_ticks']-before['system_ticks'],'peak_rss_bytes':after['peak_rss_bytes'],'rss_scope':'self-process-lifetime-high-water','pid':self.pid,'start_ticks':self.bound,'tick_hz':HZ,'response_sha256':hashlib.sha256(canon(x).encode()).hexdigest()})
                  if not allow_error and ('error' in x or x.get('result',{}).get('isError',False)):raise RuntimeError('RPC/tool rejection: '+canon(x))
                  return x
              def tool(self,name,args={},label=None):return self.call('tools/call',{'name':name,'arguments':args},label or name)
              def close(self):
                  failure=None
                  if self.p.poll() is None and time.monotonic()>=self.case_deadline:clear_group(self.p)
                  if self.p.poll() is None:self.p.stdin.close()
                  try:self.p.wait(timeout=max(0.001,min(10,self.case_deadline-time.monotonic())))
                  except subprocess.TimeoutExpired as e:clear_group(self.p);failure=e
                  for t in self.threads:t.join(timeout=2)
                  retain(OUT/(self.label+'-'+self.kind+'-transcript.json'),json.dumps(self.responses,ensure_ascii=False,indent=2))
                  retain(OUT/(self.label+'-'+self.kind+'-stderr'),self.err)
                  if failure:raise failure
                  if self.p.returncode and not self.failed:raise RuntimeError('subject exit '+str(self.p.returncode))
          PY

      - name: Matched protocol controls and paired CPU wall-time peak-RSS observations
        shell: bash
        timeout-minutes: 21
        run: |
          set -euo pipefail
          cat >> pair/measure.py <<'PY'
          def document(response):
              r=response['result']
              if 'structuredContent' in r:return r['structuredContent']
              if 'contents' in r:return json.loads(next(c['text'] for c in r['contents'] if 'text' in c))
              return json.loads(next(c['text'] for c in r['content'] if c.get('type')=='text'))
          def run(kind,label,count=20):
              s=Session(kind,label)
              try:
                  init=s.call('initialize',{'protocolVersion':'2025-11-25','capabilities':{},'clientInfo':{'name':'efficiency-5301','version':'1'}})
                  s.p.stdin.write(b'{"jsonrpc":"2.0","method":"notifications/initialized"}\n');s.p.stdin.flush()
                  first=document(s.tool('ripr_refresh',label='first_refresh'))
                  assert first['attempt']['state']=='completed',first
                  assert first['snapshot']['finding_count']>0,first
                  sid=first['snapshot']['snapshot_id']
                  listing=document(s.tool('ripr_list_gaps',{'snapshot_id':sid}))
                  assert listing['total']>0,listing
                  assert listing['snapshot_id']==sid and listing['selected']>0,listing
                  gap_id=listing['items'][0]['canonical_id']
                  detail=document(s.tool('ripr_get_gap',{'snapshot_id':sid,'gap_id':gap_id}))
                  assert detail['snapshot_id']==sid and detail['item']['canonical_id']==gap_id,detail
                  start=time.monotonic_ns();before=stat(s.pid)
                  for i in range(count):
                      r=document(s.tool('ripr_refresh',label='warm_refresh'))
                      assert r['attempt']['state']=='completed',r
                      assert r['snapshot']['snapshot_id']==sid
                  after=stat(s.pid)
                  emit({'type':'rpc_batch','kind':kind,'session':label,'label':'warm_refresh','count':count,'performance_eligible':True,'wall_ns':time.monotonic_ns()-start,'wall_scope':'batch including wrapper observation/logging overhead','user_ticks':after['user_ticks']-before['user_ticks'],'system_ticks':after['system_ticks']-before['system_ticks'],'tick_hz':HZ,'peak_rss_bytes':after['peak_rss_bytes']})
                  for i in range(20):
                      result=document(s.tool('ripr_list_gaps',{'snapshot_id':sid},label='warm_list'))
                      assert result['snapshot_id']==sid and result['selected']>0,result
                  snapshot=document(s.call('resources/read',{'uri':'ripr://snapshot/'+sid},label='snapshot_resource'))
                  assert snapshot['snapshot_id']==sid,snapshot
                  wrong=s.call('tools/call',{'name':'ripr_list_gaps','arguments':{'snapshot_id':'snapshot:sha256:deliberately-wrong'}},label='wrong_snapshot_rejected',allow_error=True)
                  assert wrong.get('result',{}).get('isError') is True,wrong
                  rejection=document(wrong)
                  assert rejection['failure']['code']=='stale_snapshot',rejection
                  assert rejection['failure']['data']['current_snapshot_id']==sid,rejection
                  current=document(s.tool('ripr_list_gaps',{'snapshot_id':sid},label='correct_snapshot_after_rejection'))
                  assert current['snapshot_id']==sid and current['selected']>0,current
                  emit({'type':'product_negative_control','kind':kind,'passed':True,'name':'wrong-snapshot-rejected-and-current-retained'})
                  return s.responses
              except BaseException:
                  s.failed=True;clear_group(s.p);raise
              finally:
                  s.close()
                  host_guard()
          def equivalent(a,b):
              if canon(a)!=canon(b):
                  retain(OUT/'parity-diff.json',json.dumps({'baseline':a,'candidate':b},indent=2))
                  raise RuntimeError('complete transcript parity failed')
          emit({'type':'bindings','value':json.loads((ROOT/'bindings.json').read_text())})
          emit({'type':'block_start','utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'baseline':'9acf0b6630fc21101baa0bbf52cc872dfe3b08a2','candidate':'fab7fd03b478c30faa13db432eccbf0c0a76575f','corpus':'anyhow/e621bd35ddddcd8b2f39d80b9f5938583571a87d','scope':'GitHub-hosted Ubuntu22; application-new sessions and persistent warm refresh/list; explicit shared cache; OS cache not dropped'} )
          try:
              a=cli('baseline',['check','--format','json'],'control')
              b=cli('candidate',['check','--format','json'],'control')
              assert a==b,'CLI complete byte parity failed'
              for i in range(3):
                  emit({'type':'pair_start','population':'A/A','pair':i,'host_fence':host_guard()})
                  first=run('baseline','control'+str(i)+'a',COUNT)
                  second=run('baseline','control'+str(i)+'b',COUNT)
                  equivalent(first,second)
              # Deliberately corrupt retained bytes: the full parity oracle must reject.
              wrong=copy.deepcopy(first);wrong[-1]['response']['result']['_negative']='wrong-digest-or-length'
              try:equivalent(first,wrong)
              except RuntimeError:pass
              else:raise AssertionError('wrong transcript escaped full parity oracle')
              emit({'type':'negative_control','name':'changed-response-rejected','passed':True,'scope':'parity-oracle only; not fused Rust implementation mutation'})
              for pair in range(3):
                  emit({'type':'pair_start','population':'A/B','pair':pair,'host_fence':host_guard()})
                  order=['baseline','candidate'] if pair%2==0 else ['candidate','baseline']
                  values={k:run(k,'pair'+str(pair),COUNT) for k in order}
                  equivalent(values['baseline'],values['candidate'])
              emit({'type':'block_result','status':'parity_passed','pairs':3,'allocation':'unavailable; observer not yet qualified'})
          except Exception as e:
              emit({'type':'block_result','status':'failed','error':repr(e)})
              raise
          finally:
              live=live_groups()
              emit({'type':'terminal_release','utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'owned_groups_checked':sorted(GROUPS),'live_owned_groups':live,'released':not live})
              if live:raise RuntimeError('owned process groups remain; release not established')
          PY
          python3 -c "import ast; from pathlib import Path; ast.parse(Path('pair/measure.py').read_text())"
          timeout --signal=TERM --kill-after=30s 20m python3 pair/measure.py

      - name: Upload bounded paired evidence without publication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-evidence-pair-${{ github.run_id }}
          path: |
            pair/bindings.json
            pair/rustc-version.txt
            pair/cargo-version.txt
            pair/measure.py
            pair/measurement/
          if-no-files-found: warn
          retention-days: 7
