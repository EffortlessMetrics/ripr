name: One-use #1574 candidate formatting

on:
  push:
    branches:
      - feat/source-promotion-resolved-tree-validator-1574

permissions:
  contents: write

concurrency:
  group: one-use-1574-format
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Format candidate and remove one-use control
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/one-use-1574-format.yml
          git diff --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- \
            xtask/src/reports/source_promotion_validate_resolved_tree.rs \
            xtask/src/reports/mod.rs \
            xtask/src/dispatch.rs \
            .github/workflows/one-use-1574-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(promotion): format resolved-tree validator candidate'
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
