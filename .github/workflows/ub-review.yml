name: ub-review

# Generated by `ub-review enable`. MiniMax reviews each PR with specialist
# lanes, selects relevant PR-specific proof, runs it safely, and posts one
# review plus a CI gate result. See docs/QUICKSTART.md and docs/ADOPTION_MODES.md.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ub-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ub-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Cache the ub-review source build so subsequent runs skip the ~12 min
      # cargo recompile. Keyed on the action SHA so a new pin invalidates.
      # Cuts repeat runs from ~14 min to ~2-3 min (ub-review #728).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target/ub-review-build"
          key: ub-review-a1e64c65e39aadf341f4e5cb14094b9a87f592ad

      - name: ub-review
        env:
          CARGO_TARGET_DIR: target/ub-review-build
        uses: EffortlessMetrics/ub-review@a1e64c65e39aadf341f4e5cb14094b9a87f592ad
        with:
          # review-mode hides the internal mode/fail-on-gate/review_forward
          # knobs. advisory = comment only; gate = recommended CI gate;
          # strict = + reporter verdict can block.
          review-mode: advisory
          provider-policy: minimax-only
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          github-token: ${{ github.token }}
          root: .
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
          posting: review

      - name: Upload ub-review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ub-review-${{ github.event.pull_request.number || github.run_id }}
          path: target/ub-review
          if-no-files-found: warn
          retention-days: 7
