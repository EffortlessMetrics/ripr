name: Coverage

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  coverage:
    name: rust-coverage
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'coverage') || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # cargo-llvm-cov

      - name: Generate coverage
        run: |
          set -euo pipefail
          llvm_cov_env="$(cargo llvm-cov show-env --export-prefix)"
          eval "$llvm_cov_env"
          cargo llvm-cov clean --workspace
          cargo build --workspace --all-features
          export RIPR_TEST_BINARY="$CARGO_LLVM_COV_TARGET_DIR/debug/ripr"
          test -f "$RIPR_TEST_BINARY"
          "$RIPR_TEST_BINARY" --version
          sha256sum "$RIPR_TEST_BINARY"
          cargo test --workspace --all-features --tests
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 5

      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          name: rust-workspace
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Explain skipped Codecov upload
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping Codecov upload for fork pull requests because repository secrets are unavailable."
