name: Auto-resolve bot review threads

# Auto-resolves inline review threads from automated bots so they don't
# block merges under the repository's "all conversations must be resolved"
# rule (#2341). Only threads from known bot accounts are resolved; human
# review threads are always left for manual resolution.
#
# Bots covered: coderabbitai, sourcery-ai, gemini-code-assist,
# chatgpt-codex-connector, github-actions.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-resolve:
    name: Resolve bot review threads
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve bot review threads
        uses: actions/github-script@v7
        with:
          script: |
            const botAuthors = new Set([
              'coderabbitai',
              'sourcery-ai',
              'gemini-code-assist',
              'chatgpt-codex-connector',
              'github-actions',
              'codegen-bot',
              'effortlesssteven[bot]',
            ]);

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const botReviewIds = new Set(
              reviews
                .filter(r => botAuthors.has(r.user?.login?.toLowerCase()))
                .map(r => r.id)
            );

            if (botReviewIds.size === 0) {
              core.info('No bot reviews found; nothing to resolve.');
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        comments(first: 1) {
                          nodes {
                            author { login }
                            pullRequestReview { databaseId }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const { repository: { pullRequest: { reviewThreads } } } = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number,
            });

            let resolved = 0;
            for (const thread of reviewThreads.nodes) {
              if (thread.isResolved) continue;
              const comment = thread.comments.nodes[0];
              if (!comment) continue;
              const author = comment.author?.login?.toLowerCase();
              const reviewDbId = comment.pullRequestReview?.databaseId;
              const isBotThread = botAuthors.has(author) ||
                (reviewDbId && botReviewIds.has(reviewDbId));
              if (isBotThread) {
                const mutation = `
                  mutation($threadId: ID!) {
                    resolveReviewThread(input: {threadId: $threadId}) {
                      thread { isResolved }
                    }
                  }
                `;
                await github.graphql(mutation, { threadId: thread.id });
                resolved++;
                core.info(`Resolved thread ${thread.id} from ${author}`);
              }
            }
            core.info(`Resolved ${resolved} bot review thread(s).`);
