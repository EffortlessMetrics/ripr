name: Repair 1710 candidate

on:
  push:
    branches:
      - release/manifest-v2-producer-catalog

permissions:
  contents: write

concurrency:
  group: repair-1710-candidate
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/manifest-v2-producer-catalog

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new))

          # Manifest/catalog field naming must reflect each producer's actual schema.
          replace(
              '.github/workflows/server-archive-qualification.yml',
              'test "$(jq -r .distributionGeneration dist/ripr-distribution-catalog.json)" = "$(jq -r .distributionGeneration "dist/ripr-server-manifest-v${version}.json")"',
              'test "$(jq -r .distributionGeneration dist/ripr-distribution-catalog.json)" = "$(jq -r .distribution_generation "dist/ripr-server-manifest-v${version}.json")"',
          )

          # Keep the bounded evidence command usable on this source branch without a one-hour hang budget.
          replace(
              '.github/workflows/rust-gates.yml',
              '# diff measured ~3,100s locally and exceeded 1,800s on CI, so\n          # the ceiling is 3,600s (measured locally per the raise rule;\n          # a hung producer wastes at most one hour — the scope guard\n          # still caps memory).\n          RIPR_PR_EVIDENCE_TIMEOUT_SECS: "3600"',
              '# diff historically required a raised ceiling. The source-release\n          # candidate completes well inside 1,800s; retain a bounded 30-minute\n          # failure limit for both producer and check invocations.\n          RIPR_PR_EVIDENCE_TIMEOUT_SECS: "1800"',
          )

          # Command metadata must describe the real default and both override mechanisms.
          replace(
              'xtask/src/command.rs',
              '"release-distribution-catalog --product-version <version> --channel <stable|rc> --stable-tag <tag> [--rc-tag <tag>] --manifest <path> --repository <owner/repo> [--out <path>]",\n            "mutating",\n            "target/release artifacts",',
              '"release-distribution-catalog --product-version <version> --channel <stable|rc> --stable-tag <tag> [--rc-tag <tag>] --manifest <path> --repository <owner/repo> [--out <path>]",\n            "mutating",\n            "dist/ripr-distribution-catalog.json by default; --out or DISTRIBUTION_CATALOG_OUT may select another path",',
          )

          # Catalog repository normalization rejects controls in both URL and owner/repo forms.
          replace(
              'xtask/src/reports/distribution_catalog.rs',
              "if rest.contains(['?', '#', '@', ' ', '\\t', '\\n', '\\r']) {",
              'if repository_has_forbidden_chars(rest) {',
          )
          replace(
              'xtask/src/reports/distribution_catalog.rs',
              'if owner.is_empty() || name.is_empty() || segments.next().is_some() {\n        return Err(format!(\n            "source repository `{repository}` must be `owner/repo` or an HTTPS owner/repo URL"\n        ));\n    }',
              'if owner.is_empty()\n        || name.is_empty()\n        || segments.next().is_some()\n        || repository_has_forbidden_chars(repository)\n    {\n        return Err(format!(\n            "source repository `{repository}` must be `owner/repo` or an HTTPS owner/repo URL"\n        ));\n    }',
          )
          replace(
              'xtask/src/reports/distribution_catalog.rs',
              'fn normalize_manifest_repository(manifest_repository: &str) -> Result<String, String> {',
              "fn repository_has_forbidden_chars(value: &str) -> bool {\n    value\n        .chars()\n        .any(|character| character.is_control() || matches!(character, '?' | '#' | '@' | ' '))\n}\n\nfn normalize_manifest_repository(manifest_repository: &str) -> Result<String, String> {",
          )
          replace(
              'xtask/src/reports/distribution_catalog.rs',
              '"https://github.com/owner/re\\tpo",\n        ] {',
              '"https://github.com/owner/re\\tpo",\n            "own\\rer/repo",\n            "own\\ner/repo",\n            "owner/re\\tpo",\n            "owner/repo?query",\n        ] {',
          )
          replace(
              'xtask/src/reports/distribution_catalog.rs',
              '|| !digest\n            .chars()\n            .all(|character| character.is_ascii_hexdigit())',
              "|| !digest\n            .bytes()\n            .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte))",
          )

          # Admit and preserve the catalog producer identity through the closed descriptor schema.
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              'export interface DistributionPlacement {\n  readonly channel: DistributionChannel;\n  readonly releaseTag: string;\n  readonly releaseRef: string;\n}\n',
              "export interface DistributionPlacement {\n  readonly channel: DistributionChannel;\n  readonly releaseTag: string;\n  readonly releaseRef: string;\n}\n\n/** Identifies the only producer admitted for schema-2 release catalogs. */\nexport interface DistributionProducer {\n  readonly tool: 'xtask release-distribution-catalog';\n  readonly schema: 'distribution-catalog/1';\n}\n",
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '  readonly targetSetDigest?: string;\n}',
              '  readonly targetSetDigest?: string;\n  readonly producer?: DistributionProducer;\n}',
              expected=2,
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              "    'targetSetDigest'\n  ]);",
              "    'targetSetDigest',\n    'producer'\n  ]);",
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              "  validateReleaseIdentity(value.schema, value.channel, {\n    distributionGeneration: value.distributionGeneration,\n    manifestSha256: value.manifestSha256,\n    targetSetDigest: value.targetSetDigest\n  });\n  if (!isChannel(channel)) {\n    throw new Error(`unsupported release descriptor channel: ${channel}`);\n  }",
              "  if (!isChannel(channel)) {\n    throw new Error(`unsupported release descriptor channel: ${channel}`);\n  }\n  validateReleaseIdentity(value.schema, channel, {\n    distributionGeneration: value.distributionGeneration,\n    manifestSha256: value.manifestSha256,\n    targetSetDigest: value.targetSetDigest\n  });\n  const producer = parseDistributionProducer(value.producer, value.schema, channel);",
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '    sourceRepository,\n    ...releaseIdentity\n  };',
              '    sourceRepository,\n    ...releaseIdentity,\n    ...(producer ? { producer } : {})\n  };',
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '    targetSetDigest: validated.targetSetDigest,\n    preferredPlacement:',
              '    targetSetDigest: validated.targetSetDigest,\n    producer: validated.producer,\n    preferredPlacement:',
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '    placementFromDescriptor(descriptor),\n    descriptor.fallbackPlacements ?? []\n  ]);',
              '    placementFromDescriptor(descriptor),\n    descriptor.fallbackPlacements ?? [],\n    ...(descriptor.producer ? [descriptor.producer] : [])\n  ]);',
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '/**\n * Enforces schema-versioned release identity:',
              "function parseDistributionProducer(\n  value: unknown,\n  schema: 1 | 2,\n  channel: DistributionChannel\n): DistributionProducer | undefined {\n  const releaseCatalog = schema === 2 && channel !== 'development';\n  if (!releaseCatalog) {\n    if (value !== undefined) {\n      throw new Error('release descriptor producer requires a schema-2 release catalog');\n    }\n    return undefined;\n  }\n  if (!isRecord(value)) {\n    throw new Error('schema-2 release catalog requires a producer object');\n  }\n  const allowed = new Set(['tool', 'schema']);\n  const unknown = Object.keys(value).find((key) => !allowed.has(key));\n  if (unknown) {\n    throw new Error(`unsupported release descriptor producer field: ${unknown}`);\n  }\n  if (\n    value.tool !== 'xtask release-distribution-catalog' ||\n    value.schema !== 'distribution-catalog/1'\n  ) {\n    throw new Error('schema-2 release catalog carries an unsupported producer identity');\n  }\n  return {\n    tool: 'xtask release-distribution-catalog',\n    schema: 'distribution-catalog/1'\n  };\n}\n\n/**\n * Enforces schema-versioned release identity:",
          )

          replace(
              'editors/vscode/scripts/admit-distribution-catalog.ts',
              '      targetSetDigest: request.targetSetDigest ?? null,\n      catalogSha256:',
              '      targetSetDigest: request.targetSetDigest ?? null,\n      producer: request.producer ?? null,\n      catalogSha256:',
          )

          # Schema-2 tests consume the same typed producer identity as the real catalog.
          replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              "    sourceRepository: 'https://github.com/EffortlessMetrics/ripr',\n    ...releaseIdentity",
              "    sourceRepository: 'https://github.com/EffortlessMetrics/ripr',\n    producer: {\n      tool: 'xtask release-distribution-catalog',\n      schema: 'distribution-catalog/1'\n    },\n    ...releaseIdentity",
          )
          replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              "    assert.strictEqual(request.targetSetDigest, digest('c'));",
              "    assert.strictEqual(request.targetSetDigest, digest('c'));\n    assert.deepStrictEqual(request.producer, {\n      tool: 'xtask release-distribution-catalog',\n      schema: 'distribution-catalog/1'\n    });",
          )
          replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, ...bareDevelopment2 } = {',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, producer: _producer, ...bareDevelopment2 } = {',
              expected=2,
          )
          replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              "  test('keeps absent release identity out of development descriptor identity', () => {",
              "  test('rejects missing, widened, or unsupported producer identity', () => {\n    const { producer: _producer, ...missingProducer } = stable2;\n    assert.throws(\n      () => parseDistributionDescriptor(JSON.stringify(missingProducer)),\n      /requires a producer object/\n    );\n    assert.throws(\n      () => parseDistributionDescriptor(JSON.stringify({\n        ...stable2,\n        producer: { ...stable2.producer, extra: true }\n      })),\n      /unsupported release descriptor producer field/\n    );\n    assert.throws(\n      () => parseDistributionDescriptor(JSON.stringify({\n        ...stable2,\n        producer: { tool: 'other', schema: 'distribution-catalog/1' }\n      })),\n      /unsupported producer identity/\n    );\n  });\n\n  test('keeps absent release identity out of development descriptor identity', () => {",
          )
          replace(
              'editors/vscode/test/suite/catalog_admission.test.ts',
              "    targetSetDigest: digest('c')\n  };",
              "    targetSetDigest: digest('c'),\n    producer: {\n      tool: 'xtask release-distribution-catalog',\n      schema: 'distribution-catalog/1'\n    }\n  };",
          )
          replace(
              'editors/vscode/test/suite/catalog_admission.test.ts',
              "      assert.strictEqual(receipt['manifestSha256'], digest('b'));",
              "      assert.strictEqual(receipt['manifestSha256'], digest('b'));\n      assert.deepStrictEqual(receipt['producer'], stableCatalog.producer);",
          )

          # Package verification is bound to immutable admission bytes, not a mutable reread.
          replace(
              'xtask/src/main.rs',
              'use reports::release_server::{create_zip_archive, sha256_file};',
              'use reports::release_server::{create_zip_archive, sha256_bytes, sha256_file};',
          )
          replace(
              'xtask/src/main.rs',
              '    let packaged = read_vsix_catalog(&vsix_path)?;\n    let staged_bytes = fs::read(&catalog_path).map_err(|err| {\n        format!(\n            "failed to re-read {} after packaging: {err}",\n            catalog_path.display()\n        )\n    })?;\n    if packaged != staged_bytes {\n        return Err(\n            "packaged VSIX catalog bytes differ from the admitted staged catalog".to_string(),\n        );\n    }',
              '    let packaged = read_vsix_catalog(&vsix_path)?;\n    verify_packaged_catalog_against_admission(&packaged, &admission_value)?;',
          )
          replace(
              'xtask/src/main.rs',
              'fn admit_distribution_catalog(\n    extension_dir: &Path,',
              'fn verify_packaged_catalog_against_admission(\n    packaged: &[u8],\n    admission: &Value,\n) -> Result<(), String> {\n    let admitted_sha256 = admission\n        .get("catalogSha256")\n        .and_then(Value::as_str)\n        .ok_or_else(|| "admission receipt has no catalogSha256".to_string())?;\n    let packaged_sha256 = sha256_bytes(packaged);\n    if packaged_sha256 != admitted_sha256 {\n        return Err(format!(\n            "packaged VSIX catalog digest {packaged_sha256} differs from admitted catalog digest {admitted_sha256}"\n        ));\n    }\n    Ok(())\n}\n\nfn admit_distribution_catalog(\n    extension_dir: &Path,',
          )
          replace(
              'xtask/src/tests.rs',
              '#[test]\nfn vscode_commands_use_extension_cwd_and_local_bins() {',
              '#[test]\nfn vscode_package_verification_binds_packaged_bytes_to_admission_receipt() -> Result<(), String> {\n    let admitted = br#"{\"schema\":2,\"productVersion\":\"0.11.0\"}"#;\n    let admission = serde_json::json!({\n        "catalogSha256": super::reports::release_server::sha256_bytes(admitted),\n    });\n    super::verify_packaged_catalog_against_admission(admitted, &admission)?;\n\n    let mut mutated = admitted.to_vec();\n    mutated.push(b\' \');\n    let Err(error) = super::verify_packaged_catalog_against_admission(&mutated, &admission) else {\n        return Err("post-admission catalog mutation must reject packaging".to_string());\n    };\n    assert!(error.contains("differs from admitted catalog digest"), "{error}");\n\n    let Err(error) = super::verify_packaged_catalog_against_admission(admitted, &serde_json::json!({})) else {\n        return Err("missing admission catalog digest must reject packaging".to_string());\n    };\n    assert!(error.contains("has no catalogSha256"), "{error}");\n    Ok(())\n}\n\n#[test]\nfn vscode_commands_use_extension_cwd_and_local_bins() {',
          )

          # The workflow is a one-shot transport and must not enter the reviewed candidate tree.
          Path('.github/workflows/repair-1710.yml').unlink()
          PY

          cargo fmt --all
          git diff --check

      - name: Focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask release_distribution_catalog -- --nocapture
          cargo test -p xtask vscode_package -- --nocapture
          cargo test -p xtask command_catalog -- --nocapture
          npm --prefix editors/vscode ci
          npm --prefix editors/vscode run compile
          npm --prefix editors/vscode test
          cargo xtask check-command-catalog
          cargo xtask check-process-policy
          cargo xtask check-network-policy
          cargo xtask check-generated-clean
          cargo xtask precommit
          git diff --check

      - name: Commit repaired candidate
        shell: bash
        env:
          BRANCH: release/manifest-v2-producer-catalog
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "fix(release): bind catalog production and packaging admission"
          git push origin "HEAD:${BRANCH}"
