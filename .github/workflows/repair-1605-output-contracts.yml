name: One-use repair for PR 1605 output contracts

on:
  push:
    branches:
      - feat/source-promotion-resolved-tree-validator-1574

permissions:
  contents: write

concurrency:
  group: repair-1605-output-contracts
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: feat/source-promotion-resolved-tree-validator-1574
          fetch-depth: 0

      - name: Patch the owning checker and schema contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("xtask/src/main.rs")
          text = main.read_text(encoding="utf-8")

          loader_anchor = '''    let swarm_ingest = read_text_lossy(Path::new("crates/ripr/src/output/swarm_ingest.rs"))?;
    let mut json_output = String::new();
'''
          loader_replacement = '''    let swarm_ingest = read_text_lossy(Path::new("crates/ripr/src/output/swarm_ingest.rs"))?;
    let mut source_promotion_resolved_tree = String::new();
    for path in [
        "xtask/src/reports/source_promotion_validate_resolved_tree.rs",
        "xtask/src/reports/source_promotion_validate_resolved_tree/core.rs",
        "xtask/src/reports/source_promotion_validate_resolved_tree/validation.rs",
        "xtask/src/reports/source_promotion_validate_resolved_tree/materialization.rs",
        "xtask/src/reports/source_promotion_validate_resolved_tree/receipt.rs",
        "xtask/src/reports/source_promotion_validate_resolved_tree/io.rs",
    ] {
        source_promotion_resolved_tree.push_str(&read_text_lossy(Path::new(path))?);
        source_promotion_resolved_tree.push('\\n');
    }
    let mut json_output = String::new();
'''
          if "let mut source_promotion_resolved_tree = String::new();" not in text:
              if text.count(loader_anchor) != 1:
                  raise SystemExit("source-promotion output-contract loader anchor is not unique")
              text = text.replace(loader_anchor, loader_replacement, 1)

          arm_anchor = '''            "ingest_reason" => {
                require_contract_value(
                    "crates/ripr/src/output/swarm_ingest.rs",
                    &swarm_ingest,
                    value,
                    kind,
                    &mut violations,
                );
                require_contract_value(
                    "docs/OUTPUT_SCHEMA.md",
                    &schema,
                    value,
                    kind,
                    &mut violations,
                );
            }
            other => violations.push(format!(
'''
          arm_replacement = '''            "ingest_reason" => {
                require_contract_value(
                    "crates/ripr/src/output/swarm_ingest.rs",
                    &swarm_ingest,
                    value,
                    kind,
                    &mut violations,
                );
                require_contract_value(
                    "docs/OUTPUT_SCHEMA.md",
                    &schema,
                    value,
                    kind,
                    &mut violations,
                );
            }
            "source_promotion_resolved_tree_schema"
            | "source_promotion_resolved_tree_status"
            | "source_promotion_command_state"
            | "source_promotion_path_role" => {
                require_contract_value(
                    "xtask/src/reports/source_promotion_validate_resolved_tree/",
                    &source_promotion_resolved_tree,
                    value,
                    kind,
                    &mut violations,
                );
                require_contract_value(
                    "docs/OUTPUT_SCHEMA.md",
                    &schema,
                    value,
                    kind,
                    &mut violations,
                );
            }
            other => violations.push(format!(
'''
          if '"source_promotion_resolved_tree_schema"' not in text:
              if text.count(arm_anchor) != 1:
                  raise SystemExit("source-promotion output-contract match anchor is not unique")
              text = text.replace(arm_anchor, arm_replacement, 1)

          main.write_text(text, encoding="utf-8")

          docs = Path("docs/OUTPUT_SCHEMA.md")
          docs_text = docs.read_text(encoding="utf-8")
          marker = "## Source-promotion resolved-tree validation receipt"
          if marker not in docs_text:
              docs_text = docs_text.rstrip() + '''

## Source-promotion resolved-tree validation receipt

`cargo xtask source-promotion validate-resolved-tree` writes a deterministic,
source-trusted preconstruction receipt with schema
`ripr.source_promotion_resolved_tree_validation.v1`.

The top-level `status` is one of:

- `rejected` — the reviewed tree is ineligible for direct-J construction;
- `validated` — every required source-governed command passed for the exact
  bound source parent, frozen swarm parent, reviewed tree, and sidecars.

Each required command records one `state`:

- `failed` — the governed command executed and failed;
- `not_run` — execution stopped before the command and the receipt carries the
  reason;
- `passed` — the governed command executed successfully;
- `unavailable` — the command or its retained evidence could not be produced.

Receipt paths carry an explicit role rather than ambient authority:

- `os_temp_disposable_checkout` — the reviewed tree was materialized in an
  operating-system temporary checkout and no authoritative ref points to it;
- `source_checkout_regular_file` — the bound sidecar is a non-symlink regular
  file beneath the exact source checkout.

This receipt proves only the named source-governed repository contracts for one
exact reviewed tree. It does not construct J, qualify later product or editor
surfaces, move source or swarm authority, or authorize release publication.
'''
              docs.write_text(docs_text, encoding="utf-8")

          test = Path("xtask/tests/output_contract_registry.rs")
          if not test.exists():
              test.write_text('''use std::fs;
use std::path::{Path, PathBuf};

fn repository_root() -> Result<PathBuf, String> {
    PathBuf::from(env!("CARGO_MANIFEST_DIR"))
        .parent()
        .map(Path::to_path_buf)
        .ok_or_else(|| "xtask manifest directory has no repository parent".to_string())
}

fn read(root: &Path, path: &str) -> Result<String, String> {
    fs::read_to_string(root.join(path)).map_err(|error| format!("read {path}: {error}"))
}

#[test]
fn source_promotion_output_contract_vocabulary_is_registered_and_checked() -> Result<(), String> {
    let root = repository_root()?;
    let registry = read(&root, "policy/output_contracts.txt")?;
    let checker = read(&root, "xtask/src/main.rs")?;
    let schema = read(&root, "docs/OUTPUT_SCHEMA.md")?;

    for kind in [
        "source_promotion_resolved_tree_schema",
        "source_promotion_resolved_tree_status",
        "source_promotion_command_state",
        "source_promotion_path_role",
    ] {
        if !registry.lines().any(|line| line.starts_with(&format!("{kind}|"))) {
            return Err(format!("output-contract registry is missing kind {kind}"));
        }
        if !checker.contains(&format!("\\\"{kind}\\\"")) {
            return Err(format!("output-contract checker does not own kind {kind}"));
        }
    }

    for value in [
        "ripr.source_promotion_resolved_tree_validation.v1",
        "rejected",
        "validated",
        "failed",
        "not_run",
        "passed",
        "unavailable",
        "os_temp_disposable_checkout",
        "source_checkout_regular_file",
    ] {
        if !schema.contains(value) {
            return Err(format!("output schema does not document contract value {value}"));
        }
    }

    Ok(())
}
''', encoding="utf-8")

          Path(".github/workflows/repair-1605-output-contracts.yml").unlink()
          PY

      - name: Verify focused repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p xtask --test output_contract_registry
          cargo xtask check-output-contracts
          cargo test -p xtask source_promotion_validate_resolved_tree -- --nocapture
          cargo test -p xtask --test source_promotion_workflow_contract --locked
          git diff --check

      - name: Commit durable repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --quiet && { echo "No repair required"; exit 0; }
          git commit -m "fix(promotion): register resolved-tree output contracts"
          git push origin HEAD:feat/source-promotion-resolved-tree-validator-1574
