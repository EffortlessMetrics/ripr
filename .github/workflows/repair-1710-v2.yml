name: Repair 1710 candidate v2

on:
  push:
    branches:
      - release/manifest-v2-producer-catalog

permissions:
  contents: write

concurrency:
  group: repair-1710-candidate-v2
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/manifest-v2-producer-catalog

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/repair-1710.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          interface_old = """replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '  readonly targetSetDigest?: string;\\n}',
              '  readonly targetSetDigest?: string;\\n  readonly producer?: DistributionProducer;\\n}',
              expected=2,
          )"""
          interface_new = """replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '  readonly targetSetDigest?: string;\\n}',
              '  readonly targetSetDigest?: string;\\n  readonly producer?: DistributionProducer;\\n}',
          )
          replace(
              'editors/vscode/src/distributionDescriptor.ts',
              '  readonly targetSetDigest?: string;\\n  readonly preferredPlacement:',
              '  readonly targetSetDigest?: string;\\n  readonly producer?: DistributionProducer;\\n  readonly preferredPlacement:',
          )"""
          if script.count(interface_old) != 1:
              raise SystemExit('could not locate the exact failed interface replacement')
          script = script.replace(interface_old, interface_new)

          destructure_old = """replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, ...bareDevelopment2 } = {',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, producer: _producer, ...bareDevelopment2 } = {',
              expected=2,
          )"""
          destructure_new = """replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, ...bareDevelopment2 } = {',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, producer: _producer, ...bareDevelopment2 } = {',
          )
          replace(
              'editors/vscode/test/suite/distribution_descriptor.test.ts',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, ...bareDevelopment2 } = development2;',
              'const { distributionGeneration: _generation, manifestSha256: _manifest, targetSetDigest: _targets, producer: _producer, ...bareDevelopment2 } = development2;',
          )"""
          if script.count(destructure_old) != 1:
              raise SystemExit('could not locate the exact failed development-descriptor replacement')
          script = script.replace(destructure_old, destructure_new)

          schema_old = "const producer = parseDistributionProducer(value.producer, value.schema, channel);"
          schema_new = "const producer = parseDistributionProducer(value.producer, schema, channel);"
          if script.count(schema_old) != 1:
              raise SystemExit('could not locate the raw schema call')
          script = script.replace(schema_old, schema_new)

          exec(compile(script, 'repair-1710-extracted.py', 'exec'))
          PY
          rm .github/workflows/repair-1710-v2.yml
          cargo fmt --all
          git diff --check

      - name: Focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask release_distribution_catalog -- --nocapture
          cargo test -p xtask vscode_package -- --nocapture
          cargo test -p xtask command_catalog -- --nocapture
          npm --prefix editors/vscode ci
          npm --prefix editors/vscode run compile
          npm --prefix editors/vscode test
          cargo xtask check-command-catalog
          cargo xtask check-process-policy
          cargo xtask check-network-policy
          cargo xtask check-generated-clean
          cargo xtask precommit
          git diff --check

      - name: Commit repaired candidate
        shell: bash
        env:
          BRANCH: release/manifest-v2-producer-catalog
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "fix(release): bind catalog production and packaging admission"
          git push origin "HEAD:${BRANCH}"
