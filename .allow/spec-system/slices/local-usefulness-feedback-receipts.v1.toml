claim_boundary = """
Adds an explicit local CLI that records result-bound usefulness feedback
receipts and a read-only join onto existing route-quality rows. Recording
changes no diagnostic, classification, baseline, suppression, gate, or gap
closure state. Identity is snapshot plus optional canonical item, not
file/line. This slice does not add editor, LSP, or MCP write surfaces, a
second attempt ledger, hosted telemetry, or support promotion.
"""

