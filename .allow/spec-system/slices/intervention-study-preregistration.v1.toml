  "seam:ripr:docs:output-schema",
  "seam:ripr:policy:document-artifact-ledger",
]

forbidden_seams = [
  "seam:ripr:agent:command-runner",
  "seam:ripr:output:gate-authority",
  "seam:ripr:cli:intervention-study-execute",
  "seam:ripr:release:promotion",
]

