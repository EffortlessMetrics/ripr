  "Return to root if agent snapshot_id is recorded as CompletedAnalysisSnapshotId.",
  "Return to root if unknown governed identity fields are accepted.",
  "Return to root if this slice migrates consumers or changes actionability, currentness, transport, or support claims.",
]

