claim_boundary = """
Defines one checked identity registry and compatibility map for governed RIPR
identifiers. Vocabulary and relationship graph only. Existing authorities are
recorded, not wrapped again. This slice does not migrate consumers, mint
replacement types owned by #4805–#4809, or change actionability, currentness,
transport behavior, or support claims.
"""

