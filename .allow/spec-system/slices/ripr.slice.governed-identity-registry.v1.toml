  "action or edit execution",
  "replacement of existing snapshot, command, continuation, or repair-attempt authority",
  "actionability or currentness changes",
  "support-tier promotion",
  "release membership",
]

return_conditions = [
  "Return to root if the registry wraps an existing canonical type instead of recording it.",
