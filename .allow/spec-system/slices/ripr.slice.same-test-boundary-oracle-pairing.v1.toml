claim_boundary = """
For a predicate probe, exposed requires one test that both feeds a boundary
input to the owner and holds a discriminating oracle on that call's result.
A split (boundary call with no oracle in one test, exact far oracle in another)
reads at most weakly_exposed and names same_test_pairing_missing. The
assert_eq!(owner(boundary), ...) control stays exposed. Does not absorb
#4486, #4760, #4574, or #4715.
"""

