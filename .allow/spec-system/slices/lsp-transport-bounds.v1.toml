schema_version = "2.0"
id = "ripr.slice.lsp-transport-bounds.v1"
generation = 1

source_issue = "issue:2034"
design_reference = "docs/LSP_TRANSPORT_BOUNDS.md"
change_class = "behavior_change"

claim_boundary = """
Bounds JSON-RPC framing, typed request payloads, request concurrency, and
slow-reader egress for `ripr lsp --stdio` behind reviewed defaults with
bounded rejections. Does not claim OS sandboxing, resistance to every
denial-of-service technique, per-message write deadlines, frame-level wire
recovery, processId monitoring, or bounds for the capability-only riprAgent
request family.
"""

non_goals = [
  "forking or patching tower-lsp-server",
  "full lifecycle and parent-process cleanup (issue #2030)",
  "riprAgent typed request handlers (capability-only slice)",
  "LSP surface manifest representation (issue #1995 not landed)",
  "operating-system sandboxing or universal denial-of-service resistance",
]

return_conditions = [
  "Return to root if tower-lsp-server is upgraded and its codec or Server composition seams change.",
  "Return to root if a legitimate client payload class exceeds a reviewed bound and the bound must move.",
]

