claim_boundary = """
Adds a repeatable saved-edit sequence harness and identity-bound
lsp-performance report for the 2026-09-28 #1578 packet: cold start,
unchanged save/refresh, production edit, related-test edit, unrelated-test
edit, rename, config change, cancellation, corrupt cache, and explicit full
refresh. A stale cached answer cannot satisfy a speed target; a fast run
cannot hide redundant full rescans or duplicate diagnostics. Historical
2s/10s/30s figures remain proposals. It reuses landed #3837/#3795 cache/phase
and #1575/#1565/#1566 scheduler/delivery metrics. It does not reopen #3795,
absorb #3796 semantic reuse or #1702 trial execution, add a new always-on
full-workspace CI job, or change support tiers or release scope.
"""

