change_class = "behavior_change"

claim_boundary = """
Makes the evidence-promotion honesty corpus load fail closed on duplicate
JSON object keys so a spliced case object can no longer silently drop a pin
while the file still parses. Claims nothing about other JSON corpora or
report artifacts loaded elsewhere in xtask.
"""

non_goals = [
  "duplicate-key enforcement for other corpus.json files outside the evidence-promotion honesty loader",
  "JSON Schema validation of the corpus",
  "changes to the honesty assertion vocabulary or tier contract",
]

return_conditions = [
  "Return to root if another loader of the same corpus bypasses the shared parse helper.",
]

