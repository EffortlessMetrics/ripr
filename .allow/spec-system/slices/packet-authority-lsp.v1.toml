producer-emitted category constant; and `check-architecture` gains a coupling
guard forbidding direct `repair_projection_ready` / `repair_route_readiness`
calls outside the authority and its declared compatibility exemptions.
Behavior-preserving except one documented fail-closed (withhold-only) delta:
the brief action now also honors the cross-language oracle-visibility
conjunct (RIPR-SPEC-0087 §8.4). Does not claim changes to the authority
itself, fixtures, goldens, editor extension, workflows, or any schema.
"""

