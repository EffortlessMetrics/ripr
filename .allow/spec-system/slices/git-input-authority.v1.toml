schema_version = "2.0"
id = "ripr.slice.git-input-authority.v1"
generation = 1

source_issue = "issue:2000"
design_reference = "RIPR-SPEC-0142"
change_class = "behavior_change"

claim_boundary = """
Resolves the LSP refresh path's load-bearing Git inputs once per accepted
refresh request into a typed request-local `ResolvedGitInputs` record that
the refresh scheduler, input identity, dedup decision, committed snapshot,
and status projection all share, with episode-bounded reuse, explicit
invalidation (idle, input invalidation, root/base/revision change,
explicit refresh), and a fail-closed `unresolved` state. It does not
change analysis results, CLI behavior, output contracts, or the
RIPR-SPEC-0112 dirty-worktree disclosure semantics, and it introduces no
global Git cache, no new production process-spawn site, and no network
access. Sharing the default-base SHA for the `loader_default` state is a
named follow-up requiring an `analysis::diff` export.
"""

non_goals = [
  "default-base SHA sharing for the loader_default state (analysis::diff export follow-up)",
  "HEAD/merge-base commit identity beyond current refresh consumers",
  "git fetch, merge-compatibility assessment, or merge policy",
  "diff-cache redesign, debounce implementation, or repository-watcher expansion",
  "analysis result, classification, or CLI behavior changes",
  "global or ambient Git caches or time-based reuse",
]

return_conditions = [
  "Return to root if the resolved values differ from the pre-change resolution path for the same inputs.",
  "Return to root if any consumer re-resolves the same base ref inside one accepted refresh.",
  "Return to root if golden fixtures drift or the LSP status payload contract breaks.",
]

owned_seams = [
  "seam:ripr:lsp:git-input-authority",
  "seam:ripr:lsp:input-identity",
  "seam:ripr:lsp:refresh-scheduler",
]

shared_seams = [
  "seam:ripr:analysis:diff-load",
]

forbidden_seams = [
  "seam:ripr:analysis:diff-load-edit",
  "seam:ripr:fixtures:goldens",
  "seam:ripr:output:check-json-contract",
  "seam:ripr:cli:commands",
]

