claim_boundary = """
Adds the saved-workspace end-to-end LSP fixture for issue #1622 criterion 6
under the editor integration contract (RIPR-SPEC-0129): one framed,
session-level test in crates/ripr/src/lsp/tests.rs that drives the real
tower-lsp-server wire framing through initialize, didOpen, didChange
(dirty), didSave, textDocument/diagnostic pulls, hover, an explicit refresh,
and shutdown/exit against a writable temp copy of the boundary_gap fixture
workspace with its own git HEAD. The test only asserts already-shipped
saved-workspace authority semantics — a dirty buffer's line-local
diagnostics are withdrawn under a distinct quarantined result id (never
presented as current), an analyzed save lifts the withdrawal and re-serves
the saved state, the interactive path discloses run_status seams_deferred
rather than presenting a partial run as complete, and the explicit refresh
delivers a current diagnostic for the saved content. No production code,
wire contract, fixture golden, or spec text changes. change_class is
"spec_or_contract_change" because the slice vocabulary has no test-only
class: the delta rides on the RIPR-SPEC-0129 contract's evidence surface
(the spec Test Mapping entry rides with the separate ratification PR), and
"behavior_change" would wrongly imply a production behavior delta.
"""

