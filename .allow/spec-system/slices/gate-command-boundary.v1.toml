claim_boundary = """
Pins the external ripr gate evaluate command boundary for a complete
producer-owned gap-ledger route: an explicitly configured blocking mode writes
the decision report and returns nonzero, while visible-only writes the same
route as advisory and returns zero. The proof checks typed seam identity,
inspection routing, and the static advisory authority boundary. It does not
change default generated-CI posture, execute verification commands, issue
receipts, or promote support tiers.
"""

