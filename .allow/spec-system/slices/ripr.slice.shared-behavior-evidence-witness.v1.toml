Adds one internal BehaviorEvidenceWitnessV1 and pure-projection adapters from
existing Rust Finding and ClassifiedSeam facts, plus a discriminating paired
parity corpus and a deterministic JSON/Markdown report DTO. Existing
classifiers, public classes, actionability, routes, schemas, cache
generations, and output bytes stay unchanged. Candidate relations cannot
appear as established reach. #4792–#4794 authority migration and deletion
are out of scope.
"""

