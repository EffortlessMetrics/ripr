]

shared_seams = [
  "seam:ripr:xtask:main-rs-decomposition",
  "seam:ripr:output:badge-endpoint-contract",
]

forbidden_seams = [
  "seam:ripr:fixtures:goldens",
  "seam:ripr:xtask:tests-rs",
  "seam:ripr:repo:workflows",
  "seam:ripr:output:check-json-contract",
]

