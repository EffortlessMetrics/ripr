design_reference = "RIPR-SPEC-0007#config-validate"
change_class = "behavior_change"

claim_boundary = """
Adds the read-only `ripr config validate [--root PATH]` command, which invokes
the existing root-scoped ripr.toml loader and reports valid or invalid config.
It does not run doctor workspace probes, change config precedence, write files,
or add a new configuration parser.
"""

