[alias]
build-lld = [
    "--config",
    "target.x86_64-unknown-linux-gnu.linker='clang'",
    "--config",
    "target.x86_64-unknown-linux-gnu.rustflags=['-C','link-arg=-fuse-ld=lld']",
    "build",
]
# Keep the live driver outside the workspace products it rebuilds on Windows.
# Share intermediate artifacts instead of compiling a second dependency cache.
xtask = "run --target-dir target/xtask-driver --config build.build-dir='target' -p xtask --"

[env]
TEMP = { value = "target", relative = true, force = true }
TMP = { value = "target", relative = true, force = true }
TMPDIR = { value = "target", relative = true, force = true }
