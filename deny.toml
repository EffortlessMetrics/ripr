# cargo-deny policy for ripr.
#
# This is intentionally narrow: advisories, licenses, bans, and sources are
# enforced; duplicate dependency findings start as warnings until the graph has
# a stable baseline.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
# cargo-deny advisory ignore entries accept IDs or `{ id, reason }` metadata,
# but reject per-entry `until` fields (verified with cargo-deny 0.19.0). Keep
# expiry metadata in comments and enforce it with `cargo xtask check-dependencies`.
# Fail when an ignore entry no longer matches any crate in the graph, so a
# suppression cannot outlive the dependency it was written for.
unused-ignored-advisory = "deny"
ignore = [
  # The `rust-unic` Unicode crate family is declared unmaintained
  # (RustSec informational `unmaintained`, advisory-db issue #2414). Each
  # crate has its own RUSTSEC entry; cargo-deny treats them as separate
  # errors, so every unic crate in the graph is listed by ID. All six
  # reach the graph through one path:
  #   ripr (default feature `lang-python`) -> rustpython-parser 0.4.0
  #     -> unic-emoji-char / unic-ucd-ident -> the other four
  # `lang-python` is a default feature, so the crates compile into the
  # published crate's default build and the release server binaries.
  #
  # None of the six carries a vulnerability; they are unmaintained
  # Unicode table crates with `patched = []`. A different advisory
  # against these crates gets a new ID and fails the check again.
  #
  # Disposition (#3811, 2026-09-22): accepted time-bounded suppression.
  # No dependency movement removes them for 0.11: rustpython-parser
  # 0.4.0 (2024-08-06) is its latest release. The candidate unic-free
  # substrate, Astral's `ruff_python_parser` (crates.io 0.0.x since
  # 2026-06), is a parser migration and requires Rust 1.96 against our
  # MSRV 1.95. Owner of that migration: EffortlessMetrics/ripr#1430
  # (ADR 0009 revisit). Revisit at expiry or when the parser moves,
  # whichever comes first; `unused-ignored-advisory` rejects these rows
  # once the unic crates leave the graph.
  "RUSTSEC-2025-0075",  # unic-char-range; expires: 2026-12-31
  "RUSTSEC-2025-0080",  # unic-common; expires: 2026-12-31
  "RUSTSEC-2025-0081",  # unic-char-property; expires: 2026-12-31
  "RUSTSEC-2025-0090",  # unic-emoji-char; expires: 2026-12-31
  "RUSTSEC-2025-0098",  # unic-ucd-version; expires: 2026-12-31
  "RUSTSEC-2025-0100",  # unic-ucd-ident; expires: 2026-12-31
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    # Permissive Apache-2.0 variant with the LLVM compiler-runtime
    # exception, OSI-approved and SPDX-tracked. Reached the dependency
    # graph via `oxc_*` crates (the TypeScript/JavaScript parser approved
    # by ADR 0008 for the Campaign 27 preview adapter); the underlying
    # transitive crate dual-licenses as `Apache-2.0 WITH LLVM-exception
    # OR BSL-1.0`, so allowing either satisfies cargo-deny.
    "Apache-2.0 WITH LLVM-exception",
    # OSI-approved and FSF Free/Libre. Permissive, universally accepted
    # as compatible with MIT/Apache. Reached the dependency graph via the
    # same `oxc_*` transitive that dual-licenses with LLVM-exception.
    "BSL-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    # OSI-approved and FSF Free/Libre. Permissive, universally accepted as
    # compatible with MIT/Apache. Reached the dependency graph via
    # `zlib-rs` (the pure-Rust zlib port pulled by `flate2` underneath the
    # `zip` crate used by `cargo xtask release-server-archive`).
    "Zlib",
    # FSF-recognised public-domain dedication (CC0). Reached the dependency
    # graph via `tiny-keccak`, a build-time hash helper pulled by
    # `rustpython-parser` (the Python preview adapter substrate approved by
    # the corrected ADR 0009 for Campaign 27). CC0 places the work in the
    # public domain with no attribution requirement, so it is strictly
    # weaker than MIT/Apache and adds no obligations to downstream consumers.
    "CC0-1.0",
    # OSI-approved. Reached the dependency graph via `unicode_names2` (a
    # transitive of `rustpython-parser`); the underlying crate dual-licenses
    # as `(MIT OR Apache-2.0) AND Unicode-DFS-2016`, so allowing the Unicode
    # data-file clause satisfies cargo-deny. The clause covers the bundled
    # Unicode character-name tables and is the standard companion license
    # for crates that ship Unicode data.
    "Unicode-DFS-2016",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
